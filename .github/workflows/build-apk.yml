# 안드로이드 앱(APK)을 빌드해서 Releases 페이지에 올립니다.
# 게임 내용만 바꿀 땐 다시 돌릴 필요 없어요. 앱 껍데기(android/)를 바꿨을 때만 실행됩니다.
name: APK 빌드

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 게임 주소 계산
        id: url
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "game=https://${OWNER}.github.io/${REPO}/" >> "$GITHUB_OUTPUT"

      - name: APK 빌드
        run: gradle -p android assembleRelease -PgameUrl=${{ steps.url.outputs.game }} -PversionCode=${{ github.run_number }}

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/release/app-release.apk PokeStory-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PokeStory-apk
          path: PokeStory-${{ github.run_number }}.apk

      - name: Releases에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 포켓몬스토리 앱 ${{ github.run_number }}
          body: |
            친구들에게 아래 APK 파일을 보내주세요.
            게임 주소: ${{ steps.url.outputs.game }}
          files: PokeStory-${{ github.run_number }}.apk
