<title>포켓몬스토리 키우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@400;600;800&display=swap">
<style>
/* 세로 폰 화면: 위쪽은 전투 무대, 아래쪽은 탭으로 나뉜 관리 패널 */
:root{
  --bg:#12151d; --panel:#1a1f2b; --panel2:#232a39; --line:#2f3749;
  --fg:#eceef5; --muted:#8e96aa; --accent:#f2b84b; --accent-ink:#1d1504;
  --good:#5fd38d; --warn:#f2c94c; --bad:#ff6b6b; --admin:#c58cff;
  --f-display:"Do Hyeon","Gothic A1",system-ui,sans-serif;
  --f-body:"Gothic A1",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;padding-inline:16px;padding-block:10px 40px;user-select:none;-webkit-user-select:none}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:inherit}
input,select{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;user-select:text;-webkit-user-select:text}
input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
small{color:var(--muted);font-weight:400}

.top{display:flex;flex-direction:column;gap:7px}
.stagebar{display:flex;align-items:baseline;gap:10px}
.stage-no{font-family:var(--f-display);font-size:30px;line-height:1}
.region{color:var(--muted);font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog-label{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);width:0;transition:width .15s linear}
.prog.boss>i{background:var(--bad)}
.prog.mine>i{background:#8fb3ff}
.res{display:flex;flex-wrap:wrap;gap:5px}
.tutbtn{flex:none;background:var(--panel2);border:1px solid var(--accent);color:var(--accent);border-radius:10px;padding:7px 10px;font-size:12px;font-weight:800;cursor:pointer;animation:tutPulse 1.4s ease-in-out infinite;white-space:nowrap}
.tutbtn.ready{background:var(--accent);color:var(--accent-ink)}
@keyframes tutPulse{0%,100%{box-shadow:0 0 0 0 rgba(242,184,75,.55)}50%{box-shadow:0 0 0 6px rgba(242,184,75,0)}}
@media (prefers-reduced-motion:reduce){.tutbtn{animation:none}}
.res{flex-wrap:nowrap}
.tut-step{display:flex;gap:4px}.tut-step i{flex:1;height:5px;border-radius:3px;background:var(--panel2)}.tut-step i.on{background:var(--accent)}
.invbtn{display:flex;align-items:center;gap:8px;flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer;font-size:13px;font-variant-numeric:tabular-nums}
.invbtn b{color:var(--accent);font-weight:600}
.invbtn span:last-child{margin-left:auto;color:var(--muted);font-size:12px}
.shop-row{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:12px;padding:10px}
.shop-row .grow b{font-size:14px}
.iico{width:var(--isz);height:var(--isz);display:inline-grid;place-items:center;flex:none}
.iico img,.iico svg{width:100%;height:100%;image-rendering:pixelated}
.inv-row{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:8px}
.inv-row .cnt{font-family:var(--f-display);font-size:20px;color:var(--accent);min-width:48px;text-align:right}
.rgrade{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.rgrade b{font-size:14px}
.odds{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11px;text-align:center}
.odds span{background:var(--panel2);border-radius:8px;padding:5px 2px}
.res>span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.res>span b{color:var(--accent);font-weight:600}

.field{position:relative;border-radius:16px;padding:0;height:250px;display:block;
  background:radial-gradient(120% 80% at 50% 110%,rgba(0,0,0,.55),transparent 60%),linear-gradient(180deg,var(--regc,#2a3348),var(--bg));border:1px solid var(--line);overflow:hidden}
.field canvas{display:block;width:100%;height:100%}
.side{display:flex;flex-direction:column;gap:6px;justify-content:center;min-width:0}
.unit{position:relative;display:flex;align-items:center;gap:6px;background:rgba(8,10,16,.5);border-radius:11px;padding:4px 7px;min-width:0;transition:opacity .2s}
.enemy{flex-direction:row-reverse;text-align:right}
.unit.dead{opacity:.18}
.unit.down{opacity:.35;filter:grayscale(1)}
.unit.boss{padding:8px;border:1px solid rgba(255,107,107,.5)}
.unit .meta{min-width:0;flex:1}
.unit .nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit .nm small{font-size:11px}
.hp{height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;margin-top:3px}
.hp>i{display:block;height:100%;background:var(--good);width:100%}
.hp.mid>i{background:var(--warn)}.hp.low>i{background:var(--bad)}
.unit.boss .hp{height:8px}.unit.boss .hp>i{background:var(--bad)}
.etrait{font-size:10px;color:#ffb0d0}
.cds{display:flex;gap:3px;margin-top:4px}
.cds i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.12);position:relative;overflow:hidden}
.cds i>b{position:absolute;inset:0;background:var(--c);transform-origin:left center}
.cds i.none{background:rgba(255,255,255,.05)}
.lock-slot{border:1px dashed var(--line);border-radius:11px;padding:10px;color:var(--muted);font-size:12px;text-align:center}
.buffbar{position:absolute;left:10px;top:6px;font-size:11px;color:#ffe08a}

/* 포켓몬 그림: PokeAPI 이미지를 불러오고, 못 불러오면 타입색 구슬로 표시 */
.orb{position:relative;width:var(--sz);height:var(--sz);flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);color:transparent;font-size:calc(var(--sz)*.44);line-height:1;background:none}
.orb.bad{color:#10121a;background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.6),transparent 36%),linear-gradient(135deg,var(--c1) 0 50%,var(--c2) 50% 100%);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 2px 6px rgba(0,0,0,.35)}
.orb img{position:absolute;left:50%;top:50%;width:150%;height:150%;transform:translate(-50%,-55%);image-rendering:pixelated;opacity:0;pointer-events:none}
.orb.ok{background:none;box-shadow:none;color:transparent}
.orb.ok img{opacity:1}

.float{position:absolute;pointer-events:none;font-family:var(--f-display);font-size:15px;animation:up .85s ease-out forwards;text-shadow:0 1px 2px #000,0 0 4px #000;white-space:nowrap;z-index:3;color:#fff}
.float.crit{color:#ffd34d;font-size:20px}.float.sup{color:#ff9a6b}.float.weak{color:#9aa1b1}.float.info{color:#cfe3ff;font-size:12px}.float.zero{color:#9aa1b1;font-size:12px}
.float.hurt{color:#ff8080;font-size:14px}.float.heal{color:var(--good);font-size:13px}.float.trait{color:#ffb0d0;font-size:12px}
@keyframes up{from{transform:translateY(0);opacity:1}to{transform:translateY(-34px);opacity:0}}
@media (prefers-reduced-motion:reduce){.float{animation-duration:.01s}.prog>i{transition:none}}

.controls{display:flex;gap:6px;flex-wrap:wrap}
.controls .btn{flex:1 1 30%;padding-inline:4px}
.stgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.stb{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 2px;cursor:pointer;font-family:var(--f-display);font-size:15px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1}
.stb small{font-family:var(--f-body);font-size:9px;color:var(--muted)}
.stb.clr{border-color:#3d6b52}
.stb.cur{border-color:var(--accent);background:rgba(242,184,75,.14)}
.stb:disabled{opacity:.3;cursor:not-allowed}
.btn{font-size:13px;font-weight:600;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer;line-height:1.2}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.tab:focus-visible,.slot-main:focus-visible,.row-btn:focus-visible,.mcell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.on,.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn.adm{border-color:var(--admin);color:var(--admin)}
.btn.sm{padding:6px 9px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:6px;z-index:5}
.tab{background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 0;font-size:13px;cursor:pointer;color:var(--muted);position:relative}
.tab.on{background:var(--panel2);color:var(--fg);border-color:var(--muted)}
.dgwrap{position:fixed;inset:0;z-index:15;background:#07080c;display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px));gap:6px}
.dgwrap[hidden]{display:none}
.dg-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:13px;color:var(--muted)}.dg-top b{color:var(--fg);font-family:var(--f-display);font-weight:400;font-size:18px}
.dg-field{flex:1;min-height:0;border-radius:12px;overflow:hidden;border:1px solid var(--line)}.dg-field canvas{width:100%;height:100%;display:block}
.dg-party{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.dgp{background:var(--panel);border:1px solid transparent;border-radius:8px;padding:5px 7px;font-size:12px;color:var(--fg);text-align:left;cursor:pointer;font-family:inherit}.dgp.lead{border-color:var(--accent)}.dgp i.xp{height:2px;margin-top:2px;background:linear-gradient(90deg,#7fd8ff var(--w),rgba(255,255,255,.08) var(--w))}.dgp i{display:block;height:4px;margin-top:4px;border-radius:2px;background:linear-gradient(90deg,var(--good) var(--w),rgba(255,255,255,.12) var(--w))}.dgp.down{opacity:.45}
.dg-log{font-size:12px;color:#c8d4f0;min-height:54px;max-height:54px;overflow:hidden;line-height:1.4;background:linear-gradient(#18234a,#0e1630);border:2px solid #8fa8e0;border-radius:10px;padding:4px 10px;box-shadow:inset 0 0 0 1px #0b1024}.dg-log div:first-child{color:var(--fg)}
.dg-ctl{display:flex;gap:6px;align-items:center}.dg-ctl [hidden]{display:none}
.dg-man{display:flex;gap:8px;align-items:flex-start}.dg-man[hidden]{display:none}.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,50px);gap:5px;flex:none}
.dpad button{background:linear-gradient(#2a3550,#1c2438);border:2px solid #4a5a80;border-radius:12px;color:#fff;font-size:22px;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.dpad button:active,.dpad button.hold{background:#3a4a70;border-color:#9fd0ff}.dpad .wait{font-size:11px;color:var(--muted)}
.dg-sk{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:5px;align-content:start}.dgsk{border-left:4px solid var(--tc);text-align:left;touch-action:manipulation;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;padding:6px 8px}.dgsk small{color:var(--muted);font-size:11px}.dgsk.cd{opacity:.45}
.dexrw{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}.seg{display:flex;gap:4px;flex-wrap:wrap}.dgi{width:16px;height:16px;border-radius:50%;background:var(--ic);flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.story{display:flex;gap:12px;align-items:flex-start;min-height:96px;background:linear-gradient(#1b2650,#101834);border:2px solid #9fb6ec;border-radius:12px;padding:12px;box-shadow:inset 0 0 0 1px #0a0f24}.pport{width:64px;height:64px;image-rendering:pixelated;border:2px solid #9fb6ec;border-radius:6px;background:#0e1630;flex:none}.bstbar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}.bstbar i{display:block;height:100%;background:var(--accent)}.sec.dgon{border-left:3px solid var(--accent);padding-left:8px}.mcell.indg{outline:2px dashed #7fd8ff}.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;background:var(--panel2);color:var(--muted);vertical-align:middle}.story .spic{flex:none}.story .stxt b{display:block;color:var(--accent);margin-bottom:4px}.story .stxt p{margin:0;font-size:15px;line-height:1.6}.story.narr .stxt p{color:var(--muted);font-style:italic}
.trn{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#e0574f,#f2b84b);font-family:var(--f-display);font-size:26px;color:#1d1504}
.dgteam{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.dgteam>div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;background:var(--panel2);border-radius:10px;padding:6px}
.dgcard{border-left:4px solid var(--dgc)}.dgcard.off{opacity:.55}
.att{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.att>div{background:var(--panel2);border-radius:8px;padding:6px 2px;text-align:center;font-size:11px;color:var(--muted)}.att>div.on{outline:2px solid var(--accent);color:var(--fg)}.att>div.got{opacity:.45}.att .attr{display:flex;flex-direction:column;align-items:center;margin-top:3px}.att small{font-size:10px;color:var(--fg)}
.mbar{height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}.mbar i{display:block;height:100%;background:var(--accent)}
.tab .dot{position:absolute;top:4px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--bad)}
.panel{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:19px}
.sub{color:var(--muted);font-size:12px;line-height:1.5}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.mon-h{display:flex;gap:10px;align-items:center}
.mon-n{font-family:var(--f-display);font-size:20px}
.bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-block:5px}
.bar>i{display:block;height:100%;background:#8fb3ff}
.role{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;margin-right:3px;border:1px solid var(--rc);color:var(--rc)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;color:#10121a;background:var(--tc);margin-right:3px;white-space:nowrap}
.tchip{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--tg);color:var(--tg);margin:0 3px 3px 0;white-space:nowrap;background:transparent;cursor:pointer}
.locked{color:var(--muted);text-align:center;border-style:dashed}
.empty-card{background:transparent;border:1px dashed var(--line);border-radius:14px;padding:18px;cursor:pointer;color:var(--muted);font-weight:600}

.slots{display:flex;flex-direction:column;gap:5px}
.slot{display:flex;align-items:center;gap:6px}
.ord{width:18px;text-align:center;font-family:var(--f-display);color:var(--muted);flex:none}
.slot-main,.row-btn{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 8px;cursor:pointer;text-align:left}
.slot-main.empty{color:var(--muted);justify-content:center;border-style:dashed;background:transparent;font-size:12px}
.ico{background:var(--panel2);border:1px solid var(--line);border-radius:8px;width:30px;height:32px;cursor:pointer;flex:none;font-size:11px}
.g{flex:none;min-width:24px;height:22px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-display);font-size:14px;color:#10121a;background:var(--gc);padding-inline:3px}
.g.g10{background:linear-gradient(90deg,#ff6b6b,#ffd34d,#5fd38d,#4fa3ff,#b07cff)}
.sn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.st{color:#ffd34d;font-size:12px;flex:none}
.pt{font-size:11px;font-weight:800;flex:none}
.cd{color:var(--muted);font-size:11px;flex:none;font-variant-numeric:tabular-nums}
.cat{font-size:10px;color:var(--muted);flex:none}
.eqtag{font-size:10px;color:var(--accent);flex:none}
.row-btn.sel{border-color:var(--accent);background:rgba(242,184,75,.14)}
.row-btn.dim{opacity:.4}
.list{display:flex;flex-direction:column;gap:5px}
.filters{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .btn{flex:none}

.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-variant-numeric:tabular-nums}
.sec{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h b{font-size:14px}
.lines{display:flex;flex-direction:column;gap:3px;font-size:13px}
.lines div::before{content:"· ";color:var(--muted)}
.tier{font-weight:800;font-size:12px}

.stats{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.stats th{color:var(--muted);font-weight:400;font-size:11px;text-align:right;padding:3px 4px}
.stats th:first-child,.stats td:first-child{text-align:left}
.stats td{padding:5px 4px;text-align:right;border-top:1px solid var(--line)}
.stats .sbar{display:inline-block;height:6px;border-radius:3px;background:var(--sc);vertical-align:middle;margin-right:6px}
.ivg{display:inline-block;min-width:28px;text-align:center;font-family:var(--f-display);font-size:14px;border-radius:5px;padding:0 4px;color:#10121a;background:var(--ivc)}
.ivg.ss{background:linear-gradient(90deg,#ff6b6b,#ffd34d,#5fd38d,#4fa3ff)}

.hex{display:block;width:100%;max-width:300px;margin:0 auto}
.trait-line{display:flex;gap:8px;align-items:flex-start;background:var(--panel2);border-radius:10px;padding:9px 10px}
.trait-line .grow b{font-size:14px}
.trait-line input{width:18px;height:18px;accent-color:var(--accent);margin-top:2px;flex:none;padding:0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.mcell{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:12px}
.mcell.inparty{border-color:var(--accent)}
.mcell .lv{color:var(--muted);font-size:11px;text-align:center}
.relic{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:3px}
.relic.off{opacity:.45}
.relic b{font-size:13px}
.relic .lvl{font-family:var(--f-display);color:var(--accent)}
.log{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;max-height:360px;overflow:auto}
.log b{color:var(--fg);font-weight:600}
.adm-h{color:var(--admin)}
.adm-sec{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.adm-sec>b{font-size:13px;color:var(--admin)}
.fld{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);min-width:0}
.fld input,.fld select{width:100%}

.modal{position:fixed;inset:0;background:rgba(5,6,10,.72);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:520px;width:100%;max-height:86vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.sheet-h{display:flex;align-items:center;gap:10px}
.sheet-h h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px;flex:1;min-width:0}
.x{background:var(--panel2);border:1px solid var(--line);border-radius:9px;width:34px;height:34px;cursor:pointer;flex:none}
.toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;z-index:30;width:min(440px,calc(100% - 32px));pointer-events:none}
.toast{background:#2b3346;border:1px solid var(--muted);border-radius:12px;padding:10px 12px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:tin .25s ease-out}
.toast.gold{border-color:var(--accent)}
.toast.bad{border-color:var(--bad)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}

.starter{position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto;padding:24px 16px}
.starter-in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.logo{font-family:var(--f-display);font-size:40px;line-height:1.05;margin:12px 0 0;text-wrap:balance}
.logo span{color:var(--accent)}
.st-card{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;text-align:left}
.st-card:hover{border-color:var(--accent)}
.st-card .mon-n{font-size:24px}
.ver{color:var(--muted);font-size:11px;text-align:center}
.pn h4{margin:6px 0 2px;font-family:var(--f-display);font-weight:400;font-size:18px}
.pn ul{margin:0;padding-left:18px;font-size:13px;line-height:1.6}
.pn .d{color:var(--muted);font-size:11px}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:5px}
.dcell{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:5px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:11px;min-width:0}
.dcell .dno{color:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}
.dcell .dnm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dcell.seen .orb img{filter:brightness(0);opacity:.55}
.dcell.seen .dnm{color:var(--muted)}
.dcell.unseen{cursor:default;opacity:.45}
.qorb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--panel);color:var(--muted);font-family:var(--f-display);font-size:18px}
.badges{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;text-align:center;color:var(--muted)}
.badge i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-display);font-size:16px;color:#10121a;background:var(--bc);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.badge.off i{background:var(--panel2);color:var(--muted);box-shadow:none;border:1px dashed var(--line)}
.badge.on{color:var(--fg)}
textarea.code{width:100%;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px;resize:none;word-break:break-all;user-select:text;-webkit-user-select:text}
.pvp-team{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pvp-u{background:var(--panel2);border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;min-width:0;transition:opacity .2s}
.pvp-u.down{opacity:.3;filter:grayscale(1)}
.pvp-u .hp{width:100%}
.pvp-vs{text-align:center;font-family:var(--f-display);font-size:18px;color:var(--muted)}
.pvp-log{font-size:12px;color:var(--muted);max-height:160px;overflow:auto;display:flex;flex-direction:column-reverse;gap:2px;background:var(--panel2);border-radius:10px;padding:8px}
.pvp-res{font-family:var(--f-display);font-size:30px;text-align:center}
.pvp-res.win{color:var(--accent)}.pvp-res.lose{color:var(--bad)}
.name-in{font-size:16px;padding:12px}
.gymtag{color:var(--accent)}
.setbtn{flex:none;width:38px;background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer;display:grid;place-items:center;padding:0}
.setbtn svg{width:18px;height:18px}
#dim{position:fixed;inset:0;pointer-events:none;z-index:60}
input[type=range]{width:100%;accent-color:var(--accent);padding:0}
.ricon{width:var(--rsz);height:var(--rsz);display:inline-grid;place-items:center;flex:none;border-radius:12px;background:var(--panel2);border:1px solid var(--rg);box-shadow:0 0 8px color-mix(in srgb,var(--rg) 45%,transparent)}
.ricon svg{width:78%;height:78%}
.relic .ricon{margin-bottom:2px}
.ropen{position:relative;min-height:150px;display:flex;flex-direction:column;align-items:center}
.rchest{position:absolute;top:14px;left:50%;width:88px;height:88px;margin-left:-44px;animation:rshake .6s ease-in-out,rgone .3s .6s ease-in forwards;z-index:2}
.rchest svg{width:100%;height:100%}
.rburst{position:absolute;top:-20px;left:50%;width:180px;height:180px;margin-left:-90px;border-radius:50%;background:radial-gradient(circle,rgba(255,230,150,.95),rgba(255,200,80,0) 65%);opacity:0;animation:rburst .8s .55s ease-out;pointer-events:none}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;width:100%;padding-top:6px}
.ritem{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;text-align:center;opacity:0;transform:scale(.4) translateY(10px);animation:rpop .4s ease-out forwards}
.ritem b{font-size:12px}
.ritem.g2 .ricon,.ritem.g3 .ricon{animation:rglow 1s ease-in-out infinite alternate}
@keyframes rshake{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-7deg)}80%{transform:rotate(7deg)}}
@keyframes rgone{to{opacity:0;transform:scale(1.5)}}
@keyframes rburst{0%{opacity:0;transform:scale(.3)}35%{opacity:1}100%{opacity:0;transform:scale(1.4)}}
@keyframes rpop{to{opacity:1;transform:none}}
@keyframes rglow{from{box-shadow:0 0 6px var(--rg)}to{box-shadow:0 0 20px var(--rg),0 0 4px #fff}}
@media (prefers-reduced-motion:reduce){.rchest{display:none}.rburst{display:none}.ritem{animation:none;opacity:1;transform:none}.ritem .ricon{animation:none!important}}
</style>

<script>
'use strict';
const GAME_VERSION='2.2.0';
const PATCH_NOTES=[
 {v:'2.2.0',d:'2026-10-11',items:['탐험대: 최대 10마리. 키우기 보관함에서 등록하거나(등록 중엔 키우기 파티에 못 들어가요) 던전에서 동료가 된 포켓몬을 넣어요',
  '던전 동료 보관함: 던전에서 동료가 된 포켓몬은 이제 키우기 보관함이 아니라 던전 전용 동료 보관함으로 가요 (도감에는 등록). 데려온 레벨 그대로, 던전에서 레벨업·진화해요',
  '던전 전용 레벨: 원작처럼 던전 레벨이 계속 이어져요. 던전마다 적 레벨이 정해져 있고, 너무 레벨이 높으면 경험치가 거의 안 들어와요',
  '참가 인원: 한 번에 최대 4마리, 종족값 합이 1000 + 뱃지×100 (최대 2000) 이하. 예: 뱃지 0개면 600+400 두 마리까지',
  '기술 PP: 기술마다 쓸 수 있는 횟수가 있어요. 과사열매로 회복, 최심부 보스를 만나면 전부 회복. 몸통박치기는 PP 없이 쓸 수 있어요',
  '배고픔: 10턴마다 1씩 줄고, 0이 되면 체력이 줄어요. 사과(+50)·큰사과(가득 + 최대치 +10)',
  '날씨: 층마다 맑음·쾌청·비·모래바람·싸라기눈·안개. 불꽃/물 위력, 지속 피해, 시야가 달라져요',
  '어둠의 탐험대 기믹: 나옹 상점(던전 상인), 보물상자(탐험 후 개봉), 이상한 타일, 회전 함정(혼란)·봉인 함정, 600턴 바람 경고, 집합구슬·석화구슬·쇠가시(던지기)',
  '원작 느낌 그래픽: 던전별 타일셋, 원작 스타일 도트 걷기·대기·공격 애니메이션(8방향), 대화창 초상화, B1F 표기 HUD, 층 진입 화면, 날씨 연출',
  '수동 조작: 방향키를 크게, 꾹 누르면 계속 이동해요. 기술 버튼에 PP 표시',
  '동료가 줄지어 잘 따라오고, 멀리 떨어지면 서둘러 쫓아와요 (미아 방지)',
  '경험치 바·다음 레벨까지 남은 경험치 표시',
  '친구와 던전 기록 비교 (친구 탭 → 던전 기록 비교)',
  '같은 던전 2회차부터 보상 감소 (골드 60%, 클리어 보너스는 50% 확률로 각성의 구슬 1개)']},
 {v:'2.1.0',d:'2026-10-11',items:['불가사의 던전 스토리 추가: 피죤 우편부와 함께 관동의 ‘일그러짐’을 쫓는 이야기. 던전마다 시작·보스·클리어 장면이 있고, 던전 탭 → 이야기에서 다시 볼 수 있어요',
  '수동 조작 모드: 방향 패드(대각선 포함)·대기·기술 버튼·계단 버튼으로 선두를 직접 움직여요. 자동/수동은 던전 안에서 언제든 바꿀 수 있어요 (PC는 방향키·스페이스·1~4·엔터)',
  '대열과 작전: 맨 앞 선두는 받는 피해 -15%, 적이 먼저 노려요(탱커). 동료 작전은 돌격/따라가기/신중. 던전 탭 → 대열, 또는 던전 안에서 동료 칸을 눌러 바꿔요',
  '함정 8종: 독가시·수면·마비·가시·워프·끈적끈적·경보·낙하 구멍. 밟으면 드러나고, 드러난 함정은 자동으로 피해 가요',
  '상태이상: 독·잠듦·마비 (함정, 독·전기·풀·에스퍼 기술로 걸려요. 적에게도 걸려요)',
  '던전 도구 8종: 오랭열매·자뭉열매·복슝열매·부활의씨앗·폭렬씨앗·수면씨앗·투시구슬·계단구슬. 던전 탭 → 도구에서 사거나 바닥에서 주워요. 자동 모드에선 알아서 써요',
  '몬스터하우스: 가끔 포켓몬이 잔뜩 잠들어 있는 방이 있어요. 들어가면 한꺼번에 깨어나요!',
  '구조·현상수배 의뢰 게시판: 매일 3개. 그 층에 가면 구조할 포켓몬(!)이나 현상수배범이 나타나요',
  '최심부 보스: 40턴이 지나면 격노하고, 50턴 안에 못 쓰러뜨리면 던전 밖으로 튕겨 나가요',
  '2세대로 가는 열쇠 조건 변경: 미지의 동굴 클리어 + 10-10 챔피언 그린 격파',

 {v:'1.2.0',d:'2026-10-10',items:['불가사의 던전 오픈! (던전 탭) 1세대 던전 8곳: 상록숲 깊은 곳 → 달맞이산 동굴 → 디그다의 굴 → 쌍둥이섬 바다 동굴 → 포켓몬타워 꼭대기 → 불타버린 포켓몬저택 → 사파리존 깊은 숲 → 미지의 동굴','던전은 칸 단위 턴제(내가 한 칸, 적도 한 칸)로 자동 진행돼요. 파티 3마리가 레벨 1부터 시작하고, 키우기에서는 종족값과 장착한 기술(등급)만 가져가요','최종 데미지 = 뱃지 1개당 10%. 실패해도 잃는 건 없어요','최심부 보스는 40턴 안에 쓰러뜨리지 못하면 격노해요. 보스를 만나면 파티가 한 번 완전히 회복돼요','던전을 탐험하는 동안에도 키우기 전투는 계속 진행돼요','던전에서 쓰러뜨린 포켓몬이 가끔 동료가 되고 싶어 해요. 알에서만 나오던 포켓몬(이상해씨·파이리·꼬부기·이브이·잠만보·화석 포켓몬 등)도 던전에서 영입할 수 있어요. 도감에 없는 포켓몬일수록 잘 따라와요','8곳을 모두 클리어하면 2세대로 가는 열쇠를 얻어요','출석부(7일 순환 보상)와 일일 미션 6개 + 전부 완료 보너스 추가 (미션 탭)','탭이 2줄 5칸으로 바뀌었어요']},

function ivHex(m){const ord=[0,1,3,2,4,5],lab=['HP','공격','특수공격','방어','특수방어','스피드'];const cx=130,cy=108,R0=72;
  const pt=(i,r)=>{const a=-Math.PI/2+i*Math.PI/3;return[+(cx+Math.cos(a)*r).toFixed(1),+(cy+Math.sin(a)*r).toFixed(1)]};
  const poly=r=>ord.map((_,i)=>pt(i,r).join(',')).join(' ');let s=`<svg viewBox="0 0 260 216" class="hex" role="img" aria-label="개체값 육각형">`;
  [20,40,60,80,100].forEach(v=>{s+=`<polygon points="${poly(R0*v/100)}" fill="${v===100?'rgba(255,255,255,.03)':'none'}" stroke="#2f3749" stroke-width="1"/>`});
  ord.forEach((_,i)=>{const[x,y]=pt(i,R0);s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#2f3749"/>`});
  ['D','C','B','A','S'].forEach((g,i)=>{s+=`<text x="${cx+3}" y="${cy-R0*(i*20+10)/100+3}" font-size="8" fill="#59617a">${g}</text>`});
  const vals=ord.map(k=>m.iv[k]);s+=`<polygon points="${vals.map((v,i)=>pt(i,R0*Math.max(4,v)/100).join(',')).join(' ')}" fill="rgba(242,184,75,.28)" stroke="#f2b84b" stroke-width="2" stroke-linejoin="round"/>`;
  vals.forEach((v,i)=>{const[x,y]=pt(i,R0*Math.max(4,v)/100);const g=ivGrade(v);s+=`<circle cx="${x}" cy="${y}" r="3.5" fill="${IVG_COL[g]}"/>`;const[lx,ly]=pt(i,R0+24);
    s+=`<text x="${lx}" y="${ly-4}" text-anchor="middle" fill="#8e96aa" font-size="10">${lab[i]}</text><text x="${lx}" y="${ly+10}" text-anchor="middle" fill="${IVG_COL[g]}" font-size="13" font-weight="800">${v} ${g}</text>`});
  return s+'</svg>'}
function ivGrade(v){return v>=100?'SS':v>=81?'S':v>=61?'A':v>=41?'B':v>=21?'C':'D'}
const IVG_COL={D:'#8e96aa',C:'#5fd38d',B:'#4fa3ff',A:'#b07cff',S:'#ff9a3d',SS:'#ffd34d'};
const rollIv=()=>{const mn=Math.min(100,1+Math.round((typeof B!=='undefined'&&B.ivmin)||0));return STAT_K.map(()=>mn+Math.floor(Math.random()*(101-mn)))};

function rollTraitCount(){const r=rnd();return r<0.01?3:r<0.11?2:1}
function rollTrait(ex,forceG){const up=1+((B&&B.augup)||0)/100;const g=forceG!==undefined?forceG:+wpick({0:TG_W[0],1:TG_W[1]*up,2:TG_W[2]*up,3:TG_W[3]*up});
  const opts=Object.keys(TRAITS).filter(k=>TRAITS[k].g===g&&!ex.includes(k));return pick(opts.length?opts:Object.keys(TRAITS).filter(k=>!ex.includes(k)))}
function rollTraits(n,forceG){const a=[];for(let i=0;i<n;i++)a.push(rollTrait(a,forceG));return a}
function makeMon(id,lv,traits,iv){const m={uid:S.uid++,id,lv,exp:0,iv:iv||rollIv(),traits:traits||rollTraits(rollTraitCount()),skills:[null,null,null,null]};S.caught[id]=1;return m}

function dropSkill(types,boss,quiet){
  const maxG=Math.min(5,1+Math.floor(S.stage/12));const w={};
  for(let g=1;g<=maxG;g++)w[g]=Math.pow(boss?0.6:0.4,g-1);
  const g=+wpick(w);const t=rnd()<0.6?pick(types):pick(TK);
  if(S.bag.length>=S.bagMax){S.gold+=skillSellPrice({g});return null}
  const s=makeSkill(t,g);S.bag.push(s);UI.dirty=true;
  if(S.autoSynth&&!quiet)autoSynthFrom(g);
  if(g>=4&&!quiet){toast(`<b style="color:${GRADE_COL[g]}">${g}등급</b> ${T[t]} 스킬 「${MV(s).name}」 획득!`,'gold');log(`${g}등급 ${MV(s).name} 획득`)}

  const use=pool.slice(0,SYN_N).map(s=>s.uid);S.bag=S.bag.filter(s=>!use.includes(s.uid));const n=makeSkill(pick(TK),g+1);S.bag.push(n);
  toast(`자동 합성: <b style="color:${GRADE_COL[g+1]}">${g+1}등급</b> ${T[n.t]} 「${MV(n).name}」`,'gold');log(`자동 합성 → ${g+1}등급 ${MV(n).name}`);g++}}

function syncMax(m){const rt=getRt(m),mx=maxHp(m);if(mx!==rt.max){rt.hp=rt.down?0:Math.min(mx,rt.hp+(mx-rt.max));rt.max=mx}}
function mkEnemy(id,boss,rb,o){o=o||{};const p=D(id),lv=enemyLv(S.stage);const st={};STAT_K.forEach((k,i)=>{st[k]=calcStat(p.base[i],50,lv,i===0)});S.seen[id]=1;
  const role=rnd()<(st.atk>=st.spa?0.7:0.3)?'melee':'ranged';const rm=ROLE_MOD[role];st.hp*=rm.hp;st.atk*=rm.atk;st.spa*=rm.atk;st.def*=rm.def;st.spd*=rm.def;st.spe*=rm.spe;
  let hp=st.hp*M_HP(S.stage);if(boss)hp*=o.gym?(7.5/o.size):(LEGEND.includes(id)?6:5);const pw=(boss&&o.gym&&S.stage>10)?1.2:1;hp*=pw;
  let trait=null;if(boss)trait=(rb&&o.ace)?REG().bt:(!o.gym&&rnd()<0.5?pick(BOSS_TRAITS):null);
  return{...st,uid:++R.eid,id,lv,types:p.types,hp,max:hp,boss,gym:!!o.gym,ace:!!o.ace,trait,pw,sturdyUsed:false,dots:[],vuln:0,vulnVal:0,para:0,seal:0,atkT:0.6+rnd()*0.8,aoeT:7,role,x:365+(o.slot||0)*24,stack:rnd()*12-6,stopX:280+rnd()*60,flash:0,lunge:0}}
function spawnWave(){const pool=S.mine?MINE_POOL:REG().pool;R.enemies=[];for(let i=0;i<3;i++)R.enemies.push(mkEnemy(pick(pool),false,false,{slot:i}));R.ever++;R.waveT=0}
function healBetween(){for(const m of partyMons()){const rt=getRt(m);
  if(rt.down){if(R.t-rt.downAt>8-B.revive){rt.down=false;rt.hp=rt.max*0.25;floatOn('u'+m.uid,'회복','heal')}continue}

function enemyHit(e,m,pow,ty){

    <p class="sub" style="margin:0">해당 던전의 그 층에 가면 구조를 기다리는 포켓몬(!)이나 현상수배범이 나타나요. 구조는 옆까지 가면 완료, 현상수배범은 쓰러뜨리면 완료예요. 완료하면 여기서 보상을 받아요.</p>
    ${reqs.length?reqs.map((q,i)=>`<div class="sec"><div class="row">${orb(q.mon,36)}<span class="grow">${q.type==='rescue'?'🆘 ':'⚠️ '}${dgReqText(q)}</span></div>
      <div class="row"><span class="sub grow">보상: ${tutRewardText(q.rw)}, ${Object.entries(q.dgi).map(([k,v])=>`${DGI[k].n} ${v}개`).join(', ')}</span>${q.claimed?'<span class="sub">완료</span>':q.done?`<button class="btn sm pri" data-act="dgReqClaim" data-i="${i}">보상 받기</button>`:`<span class="sub">진행 중</span>`}</div></div>`).join(''):'<p class="sub">1-10을 클리어해 첫 던전이 열리면 의뢰가 들어와요.</p>'}</div>`}
  else if(tab==='shop'){
    h+=`<div class="card"><div class="row"><b class="grow">던전 도구</b><span class="sub">골드 ${fmt(S.gold)}</span></div><p class="sub" style="margin:0">탐험할 때 종류별로 정해진 개수까지 가방에 넣어 가고, 쓰지 않은 건 그대로 돌아와요. 던전 바닥에서 주운 도구·보물상자에서 나온 도구도 여기에 쌓여요.</p>
    ${Object.keys(DGI).map(k=>{const it=DGI[k],pr=dgPrice(k);return`<div class="shop-row"><span class="dgi" style="--ic:${it.c}"></span><span class="grow"><b>${it.n}</b> <small>보유 ${s.items[k]||0} · 탐험당 최대 ${it.cap}개</small><br><span class="sub">${it.d}</span></span><button class="btn sm" data-act="dgBuy" data-k="${k}" ${S.gold>=pr?'':'disabled'}>${fmt(pr)}${it.stack?` (${it.stack}개)`:''}</button></div>`}).join('')}</div>`}
  else if(tab==='story'){
    h+=`<div class="card"><b>이야기 다시 보기</b><p class="sub" style="margin:0">던전에 처음 들어갈 때, 보스를 만날 때, 처음 클리어할 때 이야기가 펼쳐져요.</p>
    ${STORY_CH.map(([k,n])=>{const keys=k==='prologue'||k==='epilogue'?[k]:[k+'_in',k+'_boss',k+'_clear'];const seen=keys.filter(x=>s.story[x]||(x==='prologue'&&s.runs>0)||(x==='epilogue'&&s.key2)||(s.clear[k]&&x.startsWith(k+'_')));return`<div class="row"><span class="grow">${n}</span>${seen.length?`<button class="btn sm" data-act="dgReplay" data-k="${seen.join(',')}">보기 (${seen.length}/${keys.length})</button>`:'<span class="sub">아직 못 봄</span>'}</div>`}).join('')}</div>`}
  return h},
mission(){const d=dState(),g=goldUnit(),att=S.att,can=att.last!==today(),cur=att.n%7;
  let h=`<div class="card"><div class="row"><h3 class="grow">출석부</h3><span class="sub">누적 ${att.n}일</span></div>
  <div class="att">${ATT.map((f,i)=>`<div class="${i===cur&&can?'on':i<cur||(i===cur&&!can)?'got':''}"><b>${i+1}일</b>${Object.entries(f(g)).map(([k,v])=>`<span class="attr">${itemIcon(k==='free'?'relic':k,22)}<small>${k==='gold'?fmt(v):'×'+v}</small></span>`).join('')}</div>`).join('')}</div>
  <p class="sub" style="margin:0">${ATT.map((f,i)=>`${i+1}일: ${tutRewardText(f(g))}`).join(' · ')}</p><div class="row"><button class="btn pri" data-act="attClaim" ${can?'':'disabled'}>${can?`${cur+1}일차 출석 보상 받기`:'오늘은 이미 받았어요'}</button></div></div>`;
  const list=dailyList();
  h+=`<div class="card"><div class="row"><h3 class="grow">일일 미션</h3><span class="sub">매일 자정 초기화</span></div>`+list.map(m=>{const c=Math.min(m.goal,d.c[m.k]||0),ok=c>=m.goal,got=d.got[m.k];
    return`<div class="sec"><div class="row"><span class="grow">${m.n}</span><span class="sub">${c}/${m.goal}</span></div><div class="mbar"><i style="width:${c/m.goal*100}%"></i></div>
    <div class="row"><span class="sub grow">보상: ${tutRewardText(m.rw(g))}</span><button class="btn sm${ok&&!got?' pri':''}" data-act="dailyClaim" data-k="${m.k}" ${ok&&!got?'':'disabled'}>${got?'완료':'받기'}</button></div></div>`}).join('')+
    `<div class="row"><span class="sub grow">전부 완료 보너스: ${tutRewardText(DAILY_ALL())}</span><button class="btn sm${!d.all&&list.every(m=>d.got[m.k])?' pri':''}" data-act="dailyAll" ${!d.all&&list.every(m=>d.got[m.k])?'':'disabled'}>${d.all?'완료':'받기'}</button></div></div>`;
  return h},
party(){const n=slotsFor(S.maxStage);let h='';
  for(let i=0;i<3;i++){
    if(i>=n){h+=`<div class="card locked"><b>${i+1}번 슬롯</b><span class="sub">스테이지 ${i===1?'2-1':'4-1'}에 도달하면 해금됩니다</span></div>`;continue}
    const m=monBy(S.party[i]);if(!m){h+=`<button class="empty-card" data-act="pickParty" data-slot="${i}">+ ${i+1}번 슬롯에 포켓몬 편성</button>`;continue}
    const p=D(m.id),nd=need(m.lv),rt=getRt(m);
    h+=`<div class="card"><div class="mon-h">${orb(m.id,56)}<div class="grow"><div class="mon-n">${monName(m)} <small>Lv.${m.lv}</small></div><div><span class="role" style="--rc:${ROLE_MOD[i===0?'melee':'ranged'].col}">${i+1}번 · ${ROLE_MOD[i===0?'melee':'ranged'].n}</span>${p.types.map(chip).join('')}</div>
      <div class="bar"><i style="width:${m.lv>=LV_MAX?100:m.exp/nd*100}%"></i></div><div class="sub">HP ${fmt(Math.max(0,rt.hp))}/${fmt(rt.max)}${rt.down?' · 기절':''} · ${evoHint(m)}</div></div></div>
      <div>${traitChips(m,true)}</div>
      <div class="slots">${[0,1,2,3].map(j=>{const s=skBy(m.skills[j]);
        return s?`<div class="slot"><span class="ord">${j+1}</span><button class="slot-main" data-act="skill" data-uid="${s.uid}">${skLine(s,'',m)}</button>${j>0?`<button class="ico" data-act="skUp" data-m="${m.uid}" data-j="${j}" aria-label="시전 순서 올리기">▲</button>`:'<span style="width:30px;flex:none"></span>'}</div>`
        :`<div class="slot"><span class="ord">${j+1}</span><button class="slot-main empty" data-act="pickSkill" data-m="${m.uid}" data-j="${j}">빈 슬롯 · 눌러서 ${p.types.map(t=>T[t]).join('/')}·노말 스킬 착용</button><span style="width:30px;flex:none"></span></div>`}).join('')}</div>
      <div class="row">${i>0?`<button class="btn sm" data-act="partyUp" data-i="${i}">▲ 앞으로</button>`:''}<button class="btn sm" data-act="mon" data-uid="${m.uid}">능력치·특성</button><button class="btn sm" data-act="pickParty" data-slot="${i}">교체</button>${S.party.length>1?`<button class="btn sm" data-act="unparty" data-uid="${m.uid}">편성 해제</button>`:''}</div></div>`}
  h+=`<p class="sub" style="margin:0">1번은 근거리(${ROLE_MOD.melee.d}), 2·3번은 원거리(${ROLE_MOD.ranged.d})입니다. 적은 근거리를 먼저 노리고, 원거리는 광역 공격을 받거나 근거리가 쓰러졌을 때 맞습니다. 근거리는 적에게 붙어야 공격할 수 있어요. 스킬은 전투 시작 시 1번부터 순서대로, 이후엔 쿨타임대로 자동 시전하고, 스킬이 없으면 박치기(노말 물리)만 씁니다. 전멸하면 이전 스테이지로 돌아가 다시 성장하며 무한 도전합니다.</p>`;
  return h},
skills(){
  const list=S.bag.filter(s=>UI.filter==='all'||s.t===UI.filter).sort((a,b)=>b.g-a.g||a.t.localeCompare(b.t)||b.sc+b.st-a.sc-a.st);
  const selG=UI.sel.length?skBy(UI.sel[0]).g:null;
  return`<div class="card"><div class="row"><h3 class="grow">스킬 가방 <small>${S.bag.length}/${S.bagMax}</small></h3>
    <button class="btn sm${UI.synth?' on':''}" data-act="synthMode">${UI.synth?'합성 취소':'합성'}</button><button class="btn sm" data-act="autoSynth">지금 일괄 합성</button></div>
    <div class="row"><button class="btn sm${S.autoSynth?' on':''}" data-act="toggleAutoSynth">자동 합성 ${S.autoSynth?'ON':'OFF'}</button><span class="sub grow">켜두면 게임 중(오프라인 보상 제외) 같은 등급 미강화 스킬이 ${SYN_N}개 모일 때마다 자동으로 다음 등급으로 합성됩니다.</span></div>
    <div class="row"><select id="sellG" data-act="setSellG" aria-label="판매 기준 등급">${[1,2,3,4,5,6,7,8,9].map(g=>`<option value="${g}" ${S.sellG===g?'selected':''}>${g}등급 이하</option>`).join('')}</select><button class="btn sm warn" data-act="sellLow">전부 판매</button><span class="sub grow">착용·잠금·강화한 스킬은 판매되지 않아요.</span></div>
    <div class="filters"><button class="btn sm${UI.filter==='all'?' on':''}" data-act="filter" data-t="all">전체</button>${TK.map(t=>`<button class="btn sm${UI.filter===t?' on':''}" data-act="filter" data-t="${t}">${T[t]}</button>`).join('')}</div>
    ${UI.synth?`<div class="row"><span class="sub grow">같은 등급 스킬 ${SYN_N}개를 고르면 한 등급 위 스킬 1개(타입 랜덤)가 나옵니다. 착용·잠금 스킬은 고를 수 없고, 재료의 강화 수치는 사라져요. 선택 ${UI.sel.length}/${SYN_N}</span><button class="btn sm pri" data-act="synthGo" ${UI.sel.length===SYN_N?'':'disabled'}>합성하기</button></div>`:''}
    <div class="list">${list.length?list.map(s=>{const eqm=s.eq?monBy(s.eq):null;const tag=eqm?`<span class="eqtag">${esc(monShort(eqm))}</span>`:s.lock?'<span class="eqtag">잠금</span>':s.isNew?'<span class="eqtag" style="color:var(--bad)">NEW</span>':'';
      if(UI.synth){const bad=s.eq||s.lock||s.g>=10||(selG&&s.g!==selG&&!UI.sel.includes(s.uid));return`<button class="row-btn${UI.sel.includes(s.uid)?' sel':''}${bad?' dim':''}" data-act="synthPick" data-uid="${s.uid}" ${bad?'disabled':''}>${skLine(s,tag)}</button>`}
      return`<button class="row-btn" data-act="skill" data-uid="${s.uid}">${skLine(s,tag)}</button>`}).join(''):'<p class="sub">스킬이 없습니다. 몬스터를 처치하면 일정 확률로 스킬이 떨어집니다.</p>'}</div></div>`},
box(){const caught=Object.keys(S.caught).length;return`<div class="card"><div class="row"><h3 class="grow">보관함 <small>${S.mons.length}/${S.boxMax}</small></h3><span class="sub">도감 ${caught}/151</span></div>
  <p class="sub" style="margin:0">몬스터를 처치하면 아주 낮은 확률로 포획합니다 (일반 0.2%, 보스 2%, 전설 0.5%). 포획 시 개체값과 특성이 무작위로 정해지고, 특성은 1개 89% · 2개 10% · 3개 1%입니다. 노란 테두리가 현재 파티입니다.</p>
  <div class="grid">${S.mons.map(m=>`<button class="mcell${S.party.includes(m.uid)?' inparty':''}${dgIsReg(m.uid)?' indg':''}" data-act="mon" data-uid="${m.uid}">${orb(m.id,48)}<b>${monName(m)}</b><span class="lv">${dgIsReg(m.uid)?'탐험대 · ':''}Lv.${m.lv} · 개체 ${(g=>`<b style="color:${IVG_COL[g]}">${g}</b>`)(ivGrade(Math.round(m.iv.reduce((a,x)=>a+x,0)/6)))} · 특성 ${m.traits.length}</span></button>`).join('')}</div>
  <div class="sec"><b>진화의 돌</b><div class="row">${Object.entries(STONES).map(([k,n])=>`<span class="sub" style="display:inline-flex;align-items:center;gap:3px">${itemIcon(k,22)}${n} ${S.items[k]}</span>`).join('')}</div>
  <p class="sub" style="margin:0">스테이지 2-5부터 아주 드물게(0.06%) 떨어지고, 광산 파밍 중엔 0.8%로 오릅니다 (대신 골드·경험치 절반).</p></div></div>`},
relic(){const w=relicWeights();const tot=w.reduce((a,x)=>a+x,0)||1;
  return`<div class="card"><div class="row"><h3 class="grow">유물</h3><span class="sub">보유 ${relicCount()}/${Object.keys(RELICS).length*RELIC_MAX}</span></div>
  <p class="sub" style="margin:0">골드로 유물 상자를 사서 엽니다. 무작위 유물 하나의 레벨이 1 오르고(최대 10), 파티 전체에 적용됩니다. 상자 가격은 처음 1만 골드이고 살 때마다 1만씩 올라 최대 50만 골드입니다. 한 등급을 전부 모으면 그 등급의 확률은 다음 등급으로 넘어갑니다.</p>
  <div class="odds">${RG_N.map((n,g)=>`<span style="color:${RG_COL[g]}">${n}<br><b>${g===3&&!legendRelicOpen()?'4-10 후':pct(w[g]/tot*100)+'%'}</b></span>`).join('')}</div>
  ${S.freeRelic?`<div class="row"><button class="btn pri grow" data-act="relicFree">무료 상자 열기 (${S.freeRelic}개)</button><button class="btn" data-act="relicFree" data-n="all">모두 열기</button></div>`:''}
  <div class="row"><button class="btn pri grow" data-act="relicDraw" ${S.gold>=relicPrice()&&!relicsAllMax()?'':'disabled'}>유물 상자 열기 · ${fmt(relicPrice())}골드</button><button class="btn" data-act="relicDraw" data-n="10" ${S.gold>=relicPrice10()&&!relicsAllMax()?'':'disabled'}>10회 · ${fmt(relicPrice10())}</button></div>
  ${RG_N.map((n,g)=>{const ks=Object.keys(RELICS).filter(k=>RELICS[k].g===g);const have=ks.reduce((a,k)=>a+(S.relics[k]||0),0);
    return`<div class="rgrade"><b style="color:${RG_COL[g]}">${n}</b><span class="sub">${have}/${ks.length*RELIC_MAX}</span></div><div class="grid">${ks.map(k=>{const r=RELICS[k],lv=S.relics[k]||0;
      return`<div class="relic${lv?'':' off'}" style="border-color:${lv?RG_COL[g]:'var(--line)'}">${relicIcon(k,40)}<span class="lvl">Lv.${lv}/${RELIC_MAX}</span><b>${r.n}</b><span class="sub">${r.f(pct(r.per*Math.max(lv,1)))}${lv?'':' (미보유)'}</span></div>`}).join('')}</div>`}).join('')}</div>`},
shop(){const row=(name,desc,price,act,extra,dis,ic)=>`<div class="shop-row">${ic?itemIcon(ic,36):''}<span class="grow"><b>${name}</b><br><span class="sub">${desc}</span></span><button class="btn sm pri" data-act="${act}" ${extra||''} ${(dis||S.gold<price)?'disabled':''}>${price===Infinity?'최대':fmt(price)+'골드'}</button></div>`;

  ${row('유물 상자','무작위 유물 1레벨 · 살 때마다 1만씩, 최대 50만',relicPrice(),'relicDraw','',relicsAllMax(),'relic')}
  ${row('이상한사탕','포켓몬 1마리 레벨 +1 (능력치·특성 화면에서 사용) · 가격 = 최고 레벨 × 1,000골드',candyPrice(),'buyItem','data-k="candy"',false,'candy')}
  ${row('포켓몬 알','전설을 뺀 1세대 기본형 포켓몬 1마리가 Lv.5로 부화 · 개체값·특성 무작위 · 1만부터 1만씩, 최대 25만',eggPrice(),'buyEgg','',S.mons.length>=S.boxMax)}
  ${row('스킬 상자','현재 스테이지 보스 드랍 기준으로 무작위 스킬 1개',skillBoxPrice(),'buySkillBox','',S.bag.length>=S.bagMax)}

  ${row('특성결정','포켓몬 특성 재설정',cubePrice()*2,'buyItem','data-k="capsule"',false,'capsule')}
  <div class="sec-h"><b>진화의 돌</b><span class="sub">살 때마다 10만씩 비싸짐</span></div>
  <div class="row">${Object.entries(STONES).map(([k,n])=>`<button class="btn sm" style="display:inline-flex;align-items:center;gap:4px" data-act="buyItem" data-k="${k}" ${S.gold>=stonePrice()?'':'disabled'}>${itemIcon(k,22)}${n}</button>`).join('')}<span class="sub">개당 ${fmt(stonePrice())}골드</span></div></div>`},
dex(){const c=Object.keys(S.caught).length,s=Object.keys(S.seen).length;
  return`<div class="card"><div class="row"><h3 class="grow">도감</h3><span class="sub">잡은 포켓몬 ${c} · 본 포켓몬 ${s} / 151</span></div>

traitList(){const up=1+((B&&B.augup)||0)/100;const w=[TG_W[0],TG_W[1]*up,TG_W[2]*up,TG_W[3]*up];const ws=w.reduce((a,b)=>a+b,0);
  return head('특성 목록 · 확률')+`<p class="sub" style="margin:0">포획·알로 얻을 때 특성 개수는 1개 89% · 2개 10% · 3개 1%예요. 각 칸의 등급은 아래 확률로 정해지고, 같은 등급 안에서는 똑같은 확률로 뽑힙니다. 특성결정으로 재설정하면 개수는 그대로예요.${B.augup?' (각성의 결정 유물 효과로 높은 등급 확률 증가 중)':''}</p>`+

augList(){const up=1+((B&&B.augup)||0)/100;
  const sd={aoe:'단일기를 광역기로 (수치 = 광역 위력 %)',dmg:'스킬 데미지 +%',multi:'추가 타격 (수치 = 위력 %)',dot:'5초 지속 피해 (초당 %)',crit:'이 스킬의 급소 확률 +%p',exec:'체력 30% 이하 적에게 데미지 +%',reset:'쿨타임 즉시 초기화 확률 %',boss:'보스 데미지 +%',spow:'강화·약화 효과 +%',sdur:'지속시간 +%',sheal:'사용 시 파티 체력 회복 %',sguard:'효과 중 받는 피해 -%',shaste:'효과 중 쿨타임 회복 속도 +%',scrit:'효과 중 파티 급소 확률 +%p',sexec:'효과 중 체력 30% 이하 적 데미지 +%',sboss:'보스전 효과 +%'};
  const tbl=(sup,title)=>{const ks=augPool(sup);const ws=ks.reduce((t,k)=>t+AUG[k].w,0);return`<div class="sec"><b>${title}</b></div><div style="overflow-x:auto"><table class="stats"><thead><tr><th>옵션</th><th>확률</th>${TIER_N.map((n,i)=>`<th style="color:${TIER_COL[i]}">${n}</th>`).join('')}</tr></thead><tbody>${ks.map(k=>{const a=AUG[k];return`<tr><td><b>${a.n}</b><br><span class="sub">${sd[k]}</span></td><td>${pct(a.w/ws*100)}%</td>${a.v.map(v=>`<td>${v}</td>`).join('')}</tr>`}).join('')}</tbody></table></div>`};

dgRegPick(){const list=S.mons.filter(m=>!dgIsReg(m.uid)).sort((a,b)=>D(b.id).bst-D(a.id).bst);
  return head('탐험대에 등록할 포켓몬')+`<p class="sub" style="margin:0">등록하면 키우기 파티에서 빠지고, 해제할 때까지 키우기에 참여할 수 없어요. 던전 레벨은 Lv.1부터(전에 등록했던 포켓몬은 그 레벨 그대로) 시작해요.</p>
  <div class="grid">${list.map(m=>`<button class="mcell${S.party.includes(m.uid)?' inparty':''}" data-act="dgReg" data-uid="${m.uid}">${orb(m.id,44)}<b>${monName(m)}</b><span class="lv">종족값 ${D(m.id).bst} · 던전 Lv.${(dgState().lv['m'+m.uid]||{lv:1}).lv}${S.party.includes(m.uid)?' · 키우기 파티':''}</span></button>`).join('')||'<p class="sub">등록할 수 있는 포켓몬이 없어요.</p>'}</div>`},
dgRelease(did){const o=dgBoxMon(did);if(!o)return null;return head('동료 놓아주기')+`<p><b>${D(o.id).name}</b> (던전 Lv.${o.lv})을(를) 놓아줄까요? 되돌릴 수 없어요. 도감 기록은 남아요.</p><div class="row"><button class="btn warn" data-act="dgReleaseGo" data-did="${did}">놓아주기</button><button class="btn" data-act="close">취소</button></div>`},
friendDg(i){const f=S.friends[i];if(!f)return null;const s=dgState(),g=f.dg||{};
  return head(`${esc(f.name)}님과 던전 기록 비교`)+`<p class="sub" style="margin:0">친구 코드에 담긴 기록이에요. 친구가 새 코드를 보내 주면 갱신돼요.</p>
  <div style="overflow-x:auto"><table class="stats"><thead><tr><th>던전</th><th>나</th><th>${esc(f.name)}</th></tr></thead><tbody>${DUNGEONS.map(d=>{const me=s.clear[d.id]?`클리어 ${s.clear[d.id]}회${s.bestT[d.id]?`<br><small>최단 ${s.bestT[d.id]}턴</small>`:''}`:`<small>${s.best[d.id]||0}/${d.floors}층</small>`;const fr=g[d.id];const fo=fr?(fr[0]?`클리어 ${fr[0]}회${fr[1]?`<br><small>최단 ${fr[1]}턴</small>`:''}`:`<small>${fr[2]||0}/${d.floors}층</small>`):'<small>-</small>';
    const win=fr&&s.bestT[d.id]&&fr[1]?(s.bestT[d.id]<fr[1]?' style="color:var(--good)"':s.bestT[d.id]>fr[1]?' style="color:var(--bad)"':''):'';return`<tr><td>${d.name}</td><td${win}>${me}</td><td>${fo}</td></tr>`}).join('')}</tbody></table></div>
  <p class="sub" style="margin:0">구조 횟수: 나 ${s.rescued}회 · ${esc(f.name)} ${f.dgr||0}회 · 2세대 열쇠: 나 ${s.key2?'획득':'미획득'} · ${esc(f.name)} ${f.dgk?'획득':'미획득'}</p>`},
dgBag(){const r=DG.run;if(!r)return null;const L=dgLeader();const ks=Object.keys(DGI).filter(k=>r.bag[k]>0);
  return head('가방')+`<p class="sub" style="margin:0">${r.manual?'도구를 쓰면 선두의 한 턴이 지나가요.':'자동 모드에서는 다음 턴에 선두가 사용해요.'} 부활의씨앗은 가지고만 있으면 자동으로 발동해요.</p>
  ${ks.length?ks.map(k=>`<div class="shop-row"><span class="dgi" style="--ic:${DGI[k].c}"></span><span class="grow"><b>${DGI[k].n}</b> ×${r.bag[k]}<br><span class="sub">${DGI[k].d}</span></span>${k==='reviver'&&!r.party.some(x=>x.down)?'<span class="sub">자동</span>':`<button class="btn sm pri" data-act="dgUse" data-k="${k}" ${L&&dgCanUse(k,L)?'':'disabled'}>사용</button>`}</div>`).join(''):'<p class="sub">가방이 비어 있어요. 던전 탭 → 도구에서 사 두거나 바닥에서 주워요.</p>'}
  <div class="row"><button class="btn" data-act="close">닫기</button></div>`},
dgResult(){const r=DG.run;if(!r)return null;const win=r.over==='win';const used=Object.entries(r.used).map(([k,v])=>`${DGI[k].n} ${v}`).join(', ');const found=Object.entries(r.found).map(([k,v])=>`${DGI[k].n} ${v}`).join(', ');const bought=Object.entries(r.bought).map(([k,v])=>`${DGI[k].n} ${v}`).join(', ');
  return head(win?`${r.d.name} 클리어!`:'탐험 종료')+`<p>${win?'최심부까지 도달했어요!':esc(r.msg||'')} <span class="sub">(${dgFL(r.floor)}/${dgFL(r.d.floors)} · ${r.turn}턴 · 쓰러뜨린 적 ${r.kills})</span></p>
  ${r.lvUp&&r.lvUp.length?`<p class="sub" style="margin:0">던전 레벨 업: ${r.lvUp.map(([id,a,b])=>`${D(id).name} Lv.${a}→<b>${b}</b>`).join(', ')}</p>`:''}
  ${r.recruits.length?`<div class="sec"><b>동료가 된 포켓몬</b><div class="row">${r.recruits.map(id=>`<span style="display:inline-flex;flex-direction:column;align-items:center">${orb(id,44)}<small>${D(id).name}</small></span>`).join('')}</div><p class="sub" style="margin:0">던전 동료 보관함으로 보냈어요 (도감 등록).</p></div>`:''}
  ${r.evos&&r.evos.length?`<p>던전 동료 진화: ${r.evos.map(([a,b])=>`${D(a).name} → <b>${D(b).name}</b>`).join(', ')}</p>`:''}
  ${r.boxRw.length?`<p>보물상자 ${r.boxRw.length}개를 열었다: <b>${r.boxRw.join(', ')}</b></p>`:''}
  ${r.reqDone.length?`<p>의뢰 완료 <b>${r.reqDone.length}개</b> — 던전 탭 → 의뢰에서 보상을 받으세요.</p>`:''}
  ${found||used||bought?`<p class="sub" style="margin:0">${[found&&`주운 도구: ${found}`,bought&&`나옹 상점: ${bought}`,used&&`사용: ${used}`].filter(Boolean).join(' · ')}</p>`:''}
  <p>보상: <b>${tutRewardText(r.reward||{})||'없음'}</b>${r.rep?' <span class="sub">(2회차부터 골드 60%, 클리어 보너스 감소)</span>':''}</p>${r.key2?'<p><b style="color:var(--accent)">2세대로 가는 열쇠를 얻었다!</b> 2세대는 다음 업데이트에서 열려요.</p>':win&&r.d.id==='cerulean'&&!S.badges[9]?'<p class="sub">열쇠를 얻으려면 10-10 챔피언 그린도 이겨야 해요.</p>':''}
  <div class="row"><button class="btn pri" data-act="dgDone">확인</button>${!win?`<button class="btn" data-act="dgRetry" data-id="${r.d.id}">다시 도전</button>`:''}</div>`},
dgExit(){return head('던전에서 나가기')+`<p>탐험을 그만두고 나갈까요? 지금까지 모은 골드·영입한 포켓몬·완료한 의뢰는 그대로 가져가요.</p><div class="row"><button class="btn warn" data-act="dgExitGo">나가기</button><button class="btn" data-act="close">계속 탐험</button></div>`},
backupConfirm(){return head('백업 불러오기')+`<p>지금 진행 상황이 백업 내용으로 바뀝니다. 되돌릴 수 없어요.</p><div class="row"><button class="btn warn" data-act="backupGo">불러오기</button><button class="btn" data-act="settings">취소</button></div>`},
inheritPick(uid){const s=skBy(uid);if(!s)return null;const ts=inheritTargets(s).sort((a,b)=>(b.sc+b.st)-(a.sc+a.st));const pv=t=>`주문서 +${t.sc}→+${s.sc-5} · 숙련 ◆${t.st}→◆${s.st-5}${s.pot?` · 각성 ${TIER_N[s.pot.tier]}`:''}${s.add?` · 공명 ${TIER_N[s.add.tier]}`:''}`;
  return head(`${MV(s).name} 전승`)+`<p class="sub" style="margin:0">강화를 받을 ${T[s.t]} ${s.g+1}등급 스킬을 고르세요.</p><div class="list">${ts.map(t=>`<button class="row-btn" style="flex-wrap:wrap" data-act="inheritAsk" data-from="${s.uid}" data-to="${t.uid}">${skLine(t,t.eq?`<span class="eqtag">${esc(monShort(monBy(t.eq)))}</span>`:'')}<span class="sub" style="flex-basis:100%">${pv(t)}</span></button>`).join('')}</div><button class="btn" data-act="skill" data-uid="${s.uid}">뒤로</button>`},
inheritConfirm(a,b){const s=skBy(a),t=skBy(b);if(!s||!t)return null;const lost=isPlain(t)?'':'<br><b style="color:var(--bad)">받는 스킬에 이미 있던 강화는 사라집니다.</b>';
  return head('스킬 전승')+`<div class="list"><div class="row-btn" style="cursor:default">${skLine(s)}</div><div style="text-align:center;color:var(--muted)">▼ 전승</div><div class="row-btn" style="cursor:default">${skLine(t)}</div></div>
  <p style="margin:0">결과: <b>${MV(t).name}</b> 주문서 +${s.sc-5}, 숙련 ◆${s.st-5}${s.pot?`, 각성 ${TIER_N[s.pot.tier]}`:''}${s.add?`, 공명 ${TIER_N[s.add.tier]}`:''}<br><span class="sub">${MV(s).name}(${s.g}등급)은 사라집니다.</span>${lost}</p>
  <div class="row"><button class="btn pri" data-act="inheritGo" data-from="${a}" data-to="${b}">전승하기</button><button class="btn" data-act="inheritPick" data-uid="${a}">취소</button></div>`},
traitInfo(k){const t=TRAITS[k];return head(t.n)+`<p><span class="tier" style="color:${TG_COL[t.g]}">${TG_N[t.g]} 특성</span></p><p>${t.d}</p><button class="btn pri" data-act="close">확인</button>`},
sellMon(uid){const m=monBy(uid);if(!m)return null;return head('포켓몬 판매')+`<p>${D(m.id).name} (Lv.${m.lv}, 특성 ${m.traits.map(k=>TRAITS[k].n).join('·')})를 ${fmt(monSellPrice(m))}골드에 판매할까요? 착용한 스킬은 가방으로 돌아갑니다. 되돌릴 수 없어요.</p><div class="row"><button class="btn warn" data-act="sellMonGo" data-uid="${uid}">판매</button><button class="btn" data-act="close">취소</button></div>`},
reset(){return head('진행 초기화')+`<p>모든 포켓몬, 스킬, 재화가 사라지고 스타팅 선택부터 다시 시작합니다. 되돌릴 수 없어요.</p><div class="row"><button class="btn warn" data-act="resetGo">초기화</button><button class="btn" data-act="close">취소</button></div>`},
offline(r){return head('다녀오셨군요!')+`<p class="sub" style="margin:0">자리를 비운 ${r.time} 동안 포켓몬들이 계속 싸웠어요. (최대 ${offMaxH()}시간 · 온라인 효율의 ${Math.round(r.eff*100)}%)</p>
  <dl class="kv"><dt>골드</dt><dd>+${fmt(r.gold)}</dd><dt>경험치</dt><dd>파티 각 +${fmt(r.xp)}</dd><dt>스킬북</dt><dd>${r.skills}개</dd><dt>특성결정</dt><dd>${r.caps}개</dd><dt>포획</dt><dd>${r.mons.length?r.mons.join(', '):'없음'}</dd></dl><button class="btn pri" data-act="close">받기</button>`},
dexInfo(id){const p=D(id);const caught=!!S.caught[id];if(!caught&&!S.seen[id])return head(`No.${String(id).padStart(3,'0')} ???`,'<div class="qorb">?</div>')+`<p class="sub" style="margin:0">아직 만난 적 없는 포켓몬이에요.</p><dl class="kv"><dt>얻는 곳</dt><dd>${dexWhere(id).map(x=>`<div>${x}</div>`).join('')}</dd></dl>`;const where=REGIONS.map((r,i)=>r.pool.includes(id)||(GYMS[i].team!=='rival'&&GYMS[i].team.includes(id))?r.name:null).filter(Boolean);
  let first=p;while(first.prev)first=D(first.prev);const chain=[];const walk=q=>{chain.push(q);q.evo.forEach(e=>walk(D(e.to)))};walk(first);
  return head(`No.${String(id).padStart(3,'0')} ${caught||S.seen[id]?p.name:'???'}`,orb(id,56))+`<div>${p.types.map(chip).join('')}<span class="sub"> ${caught?'잡은 적 있음':'만난 적만 있음'}</span></div>
  <div style="overflow-x:auto"><table class="stats"><thead><tr><th>종족값</th><th></th></tr></thead><tbody>${STAT_K.map((k,i)=>`<tr><td>${STAT_N[k]}</td><td><span class="sbar" style="width:${Math.round(p.base[i]/160*110)}px;--sc:${TC[p.types[0]]}"></span>${p.base[i]}</td></tr>`).join('')}<tr><td>합계</td><td>${p.bst}</td></tr></tbody></table></div>
  <dl class="kv"><dt>진화</dt><dd>${chain.length>1?chain.map(q=>S.caught[q.id]||S.seen[q.id]?q.name:'???').join(' → '):'진화하지 않음'}</dd><dt>얻는 곳</dt><dd>${dexWhere(id).map(x=>`<div>${x}</div>`).join('')}</dd></dl>`},
pvp(i){const f=S.friends[i];if(!f)return null;
  return head(`${esc(S.name)} vs ${esc(f.name)}`)+`<div class="pvp-team" id="pvpB">${f.team.map((u,j)=>`<div class="pvp-u" id="pvB${j}">${orb(u.i,44)}<span>${u.k?esc(u.k):D(u.i).name} Lv.${u.l}</span><div class="hp"><i></i></div></div>`).join('')}</div>
  <div class="pvp-vs" id="pvpRes">VS</div>
  <div class="pvp-team" id="pvpA">${myTeam().map((u,j)=>`<div class="pvp-u" id="pvA${j}">${orb(u.i,44,true)}<span>${u.k?esc(u.k):D(u.i).name} Lv.${u.l}</span><div class="hp"><i></i></div></div>`).join('')}</div>
  <div class="pvp-log" id="pvpLog"></div><div class="row"><button class="btn" data-act="pvpSkip" id="pvpSkipBtn">결과 바로 보기</button><button class="btn" data-act="close">닫기</button></div>`},
stageSel(){const max=S.maxStage;const chs=Math.ceil(max/10);let o=head('스테이지 선택')+`<p class="sub" style="margin:0">가본 스테이지 중 원하는 곳을 고르세요. 최고 기록보다 3단계 이상 낮은 스테이지는 골드·경험치·드랍률이 5%씩 줄어듭니다 (1~2단계 아래는 그대로, 최대 50%). /h는 실제 클리어 시간으로 계산한 시간당 예상 골드예요 (반복 기준, 감소·보너스 반영). 반복을 켜면 보스를 잡아도 다음 스테이지로 넘어가지 않아요.</p>
  <div class="row"><button class="btn sm${S.repeat?' on':''}" data-act="toggleRepeat">현재 스테이지 반복 ${S.repeat?'ON':'OFF'}</button><span class="sub">최고 ${stageLabel(Math.max(1,max-1))} 클리어</span></div>`;
  for(let c=chs-1;c>=0;c--){const reg=REGIONS[c%10];o+=`<div class="sec"><div class="sec-h"><b>${c+1}. ${reg.name}</b>${c<10?`<span class="sub">${GYMS[c].title}${S.badges[c]?' · 뱃지 획득':''}</span>`:''}</div><div class="stgrid">`;
    for(let i=1;i<=10;i++){const st=c*10+i;const lock=st>max;const pen=farmPen(st);o+=`<button class="stb${st===S.stage?' cur':''}${S.best&&S.best[st]?' clr':''}" data-act="goStage" data-s="${st}" ${lock?'disabled':''}>${c+1}-${i}${i===10?'<small>관장</small>':''}${!lock&&pen?`<small>-${pen}%</small>`:''}${S.best&&S.best[st]?`<small>${fmtTime(S.best[st])}</small>`:''}${!lock&&goldPerHour(st)?`<small style="color:var(--accent)">${fmt(goldPerHour(st))}/h</small>`:''}</button>`}
    o+='</div></div>'}
  return o},
equipTo(uid){const s=skBy(uid);if(!s)return null;const list=S.mons.filter(m=>canEquip(s,m)).sort((a,b)=>(S.party.includes(b.uid)?1:0)-(S.party.includes(a.uid)?1:0)||b.lv-a.lv);
  return head(`${MV(s).name} 장착`)+`<p class="sub" style="margin:0">${equipNote(s.t)}. 넣을 칸을 누르세요. 칸에 있던 스킬은 가방으로 돌아갑니다.</p>`+
  (list.length?list.map(m=>`<div class="shop-row" style="flex-direction:column;align-items:stretch"><div class="row">${orb(m.id,36)}<b class="grow">${monName(m)} <small>Lv.${m.lv}${S.party.includes(m.uid)?` · ${roleOf(m)?ROLE_MOD[roleOf(m)].n:'파티'}`:''}</small></b></div>
    <div class="slots">${[0,1,2,3].map(j=>{const c=skBy(m.skills[j]);return`<button class="slot-main${c?'':' empty'}" data-act="equip" data-uid="${s.uid}" data-m="${m.uid}" data-j="${j}" ${c&&c.uid===s.uid?'disabled':''}>${j+1}번 · ${c?(c.uid===s.uid?'지금 장착 중':`${MV(c).name} (${c.g}등급)와 교체`):'빈 칸에 장착'}</button>`}).join('')}</div></div>`).join('')
   :`<p class="sub">${T[s.t]} 타입 포켓몬이 없어요.</p>`)},
patch(){return head('패치노트')+`<div class="pn">${PATCH_NOTES.map(n=>`<h4>v${n.v} <span class="d">${n.d}</span></h4><ul>${n.items.map(x=>`<li>${x}</li>`).join('')}</ul>`).join('')}</div><button class="btn pri" data-act="close">확인</button>`},
nick(uid){const m=monBy(uid);if(!m)return null;return head(`${D(m.id).name} 이름 변경`,orb(m.id,44))+`<p class="sub" style="margin:0">최대 10자. 비워두고 저장하면 원래 이름으로 돌아갑니다. 화면에는 "별명(${D(m.id).name})"으로 표시돼요.</p>
  <input id="nickIn" class="name-in" maxlength="10" value="${m.nick?esc(m.nick):''}" placeholder="${D(m.id).name}" aria-label="새 이름"><div class="row"><button class="btn pri" data-act="nickGo" data-uid="${uid}">저장</button><button class="btn" data-act="mon" data-uid="${uid}">취소</button></div>`},
rename(){return head('트레이너 이름 변경')+`<input id="newName" class="name-in" maxlength="10" value="${esc(S.name)}" aria-label="새 이름"><div class="row"><button class="btn pri" data-act="renameGo">저장</button><button class="btn" data-act="close">취소</button></div>`},
delFriend(i){const f=S.friends[i];if(!f)return null;return head('친구 삭제')+`<p>${esc(f.name)}님을 친구 목록에서 삭제할까요?</p><div class="row"><button class="btn warn" data-act="delFriendGo" data-i="${i}">삭제</button><button class="btn" data-act="close">취소</button></div>`},
result(r){return head(r.title)+`<p>${r.body}</p><button class="btn pri" data-act="close">확인</button>`},
adminLogin(err){return head('관리자 로그인')+`<p class="sub" style="margin:0">관리자 암호를 입력하세요.</p>
  <div class="row"><input type="password" id="admPw" inputmode="numeric" autocomplete="off" placeholder="암호" class="grow" aria-label="관리자 암호"><button class="btn pri" data-act="adminLogin">확인</button></div>

const mf=n=>440*Math.pow(2,(n-69)/12);
function sdeg(s,d,oct){const sc=SC[s.sc];const o=Math.floor(d/7),i=((d%7)+7)%7;return s.root+sc[i]+12*(o+(oct||0))}
function auInit(){if(AU.ctx)return true;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;AU.ctx=new C();AU.bgm=AU.ctx.createGain();AU.sfxG=AU.ctx.createGain();AU.bgm.connect(AU.ctx.destination);AU.sfxG.connect(AU.ctx.destination);
  const len=AU.ctx.sampleRate*0.5;AU.nb=AU.ctx.createBuffer(1,len,AU.ctx.sampleRate);const d=AU.nb.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;auVol();return true}catch(e){AU.ctx=null;return false}}
function auVol(){if(!AU.ctx||!S||!S.set)return;AU.bgm.gain.value=(S.set.bgm/100)*0.2;AU.sfxG.gain.value=(S.set.sfx/100)*0.32}
function tone(f,t,d,type,g,dest,slide){const c=AU.ctx,o=c.createOscillator(),v=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  v.gain.setValueAtTime(0.0001,t);v.gain.linearRampToValueAtTime(g,t+0.01);v.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(v);v.connect(dest);o.start(t);o.stop(t+d+0.03)}
function noise(t,d,g,dest,hp){const c=AU.ctx,s=c.createBufferSource();s.buffer=AU.nb;const v=c.createGain();let n=s;if(hp){const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp;s.connect(f);n=f}
  v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(0.0001,t+d);n.connect(v);v.connect(dest);s.start(t);s.stop(t+d+0.03)}
function playStep(s,step,t){const sd=60/s.bpm/2,bar=Math.floor(step/8)%s.prog.length,cd=s.prog[bar],m=s._m,i=step%m.length,tok=m[i],B=AU.bgm;
  if(typeof tok==='number'){let len=1;while(m[(i+len)%m.length]==='.'&&len<8)len++;const g=s.lead==='sawtooth'?0.07:s.lead==='square'?0.09:0.16;
    tone(mf(sdeg(s,tok,0)),t,len*sd*0.92,s.lead,g,B);if(Math.floor(step/m.length)%2===1)tone(mf(sdeg(s,tok-2,0)),t,len*sd*0.9,'triangle',0.05,B)}
  if(s.run)tone(mf(sdeg(s,cd,step%2?-1:-2)),t,sd*0.9,'triangle',0.2,B);else if(step%2===0)tone(mf(sdeg(s,cd,-2)),t,sd*1.8,'triangle',0.22,B);
  if(s.arp){const ch=[cd,cd+2,cd+4,cd+2];tone(mf(sdeg(s,ch[step%4],-1)),t,sd*0.8,'sine',0.06,B)}
  if(s.pad&&step%8===0)[cd,cd+2,cd+4].forEach(d=>tone(mf(sdeg(s,d,-1)),t,sd*7.5,'sine',0.035,B));
  if(s.drums){if(step%4===0)tone(140,t,0.14,'sine',0.32,B,40);if(step%4===2)noise(t,0.11,0.16,B,1600);if(s.drums>1)noise(t,0.03,0.05,B,7000)}}
function auSched(){if(!AU.ctx||!AU.cur)return;const s=SONGS[AU.cur];const sd=60/s.bpm/2;while(AU.nextT<AU.ctx.currentTime+0.25){playStep(s,AU.step,AU.nextT);AU.nextT+=sd;AU.step++}}
function musicUpdate(){if(!AU.ctx||!S||!S.set)return;let want=null;if(S.set.bgm>0)want=DG.open?(DG.run&&DG.run.boss&&!DG.run.boss.down?'battle':'mine'):R.legend?'legend':R.boss?'battle':S.mine?'mine':REGION_SONG[Math.floor((S.stage-1)/10)%10];
  if(want===AU.cur)return;AU.cur=want;AU.step=0;AU.nextT=AU.ctx.currentTime+0.12;if(want&&!AU.timer)AU.timer=setInterval(auSched,40);if(!want&&AU.timer){clearInterval(AU.timer);AU.timer=null}}
function auUnlock(){if(!S)return;if(auInit()){if(AU.ctx.state==='suspended')AU.ctx.resume();musicUpdate()}}
const SFX_F={N:520,F:392,W:330,G:440,E:880,I:988,C:262,P:294,D:196,A:660,S:740,B:587,R:220,H:247,X:349};
function sfx(k,type){if(!AU.ctx||!S||!S.set||S.set.sfx<=0||document.hidden)return;const now=AU.ctx.currentTime;if(AU.last[k]&&now-AU.last[k]<(k==='skill'?0.09:0.15))return;AU.last[k]=now;const t=now+0.01,G=AU.sfxG;
  if(k==='skill'){const f=SFX_F[type]||520;tone(f,t,0.12,'square',0.12,G,f*1.5);if(type==='E')noise(t,0.08,0.08,G,4000)}
  else if(k==='crit'){tone(1320,t,0.08,'square',0.12,G);tone(1760,t+0.05,0.1,'square',0.1,G)}
  else if(k==='hit')noise(t,0.05,0.08,G,2500);
  else if(k==='buff')[0,4,7].forEach((n,i)=>tone(mf(72+n),t+i*0.05,0.15,'triangle',0.12,G));
  else if(k==='win')[0,4,7,12,7,12].forEach((n,i)=>tone(mf(72+n),t+i*0.1,i===5?0.5:0.12,'square',0.1,G));
  else if(k==='lose')[7,5,3,0].forEach((n,i)=>tone(mf(64+n),t+i*0.14,0.2,'triangle',0.14,G));
  else if(k==='lvl')[0,4,7,12].forEach((n,i)=>tone(mf(76+n),t+i*0.06,0.12,'square',0.08,G));
  else if(k==='cap'){[0,7,12].forEach((n,i)=>tone(mf(67+n),t+i*0.12,0.18,'square',0.1,G));tone(mf(79),t+0.4,0.4,'triangle',0.12,G)}
  else if(k==='evo')[0,2,4,7,9,12,16].forEach((n,i)=>tone(mf(67+n),t+i*0.07,0.16,'triangle',0.12,G));
  else if(k==='relic'){noise(t,0.3,0.06,G,3000);[0,7,12,19].forEach((n,i)=>tone(mf(79+n),t+0.55+i*0.06,0.25,'sine',0.12,G))}
  else if(k==='coin')[0,7].forEach((n,i)=>tone(mf(84+n),t+i*0.07,0.12,'square',0.08,G))}

const COUPON_SALT='pks-0522-cpn';
const COUPONS={POKESTORY:{g:50000,i:{cube:3,capsule:2},f:3,msg:'포켓몬스토리 오픈 기념 쿠폰'}};
function fnv(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
function makeCoupon(r){const body={id:Math.random().toString(36).slice(2,9),...r};const b=btoa(unescape(encodeURIComponent(JSON.stringify(body)))).replace(/=+$/,'').replace(/\+/g,'-').replace(/\//g,'_');return`PSC.${b}.${fnv(b+COUPON_SALT)}`}
function redeemCoupon(raw){S.coupons=S.coupons||{};const up=raw.toUpperCase();
  if(COUPONS[up]){if(S.coupons['P:'+up])return{err:'이미 사용한 쿠폰이에요'};const c=COUPONS[up];S.coupons['P:'+up]=1;const reward={};if(c.g)reward.gold=c.g;Object.assign(reward,c.i||{});if(c.f)reward.free=c.f;return{reward,msg:c.msg}}
  const parts=raw.split('.');if(parts.length!==3||parts[0]!=='PSC')return{err:'쿠폰 코드가 올바르지 않아요'};
  if(fnv(parts[1]+COUPON_SALT)!==parts[2])return{err:'쿠폰 코드가 올바르지 않아요'};
  let o;try{o=JSON.parse(decodeURIComponent(escape(atob(parts[1].replace(/-/g,'+').replace(/_/g,'/')))))}catch(e){return{err:'쿠폰 코드가 올바르지 않아요'}}
  if(!o.id||S.coupons[o.id])return{err:'이미 사용한 쿠폰이에요'};if(o.e&&Date.now()>o.e)return{err:'기간이 끝난 쿠폰이에요'};
  const num=(v,mx)=>Number.isFinite(+v)?clamp(Math.floor(+v),0,mx):0;const reward={};if(o.g)reward.gold=num(o.g,1e12);if(o.f)reward.free=num(o.f,999);
  for(const k in (o.i||{}))if(ITEM_N[k])reward[k]=num(o.i[k],99999);S.coupons[o.id]=1;return{reward,msg:typeof o.m==='string'?o.m.slice(0,40):''}}

function parseCode(c){c=(c||'').replace(/\s/g,'');if(!c.startsWith('PKS1.'))throw new Error('코드 형식이 아니에요');
  const o=JSON.parse(decodeURIComponent(escape(atob(c.slice(5)))));const int=(v,a,b)=>Number.isInteger(v)&&v>=a&&v<=b;
  if(typeof o.id!=='string'||o.id.length>16||typeof o.n!=='string'||!Array.isArray(o.p)||o.p.length<1||o.p.length>3)throw new Error('코드가 손상됐어요');
  const team=o.p.map(u=>{if(!int(u.i,1,151)||!int(u.l,1,99)||!Array.isArray(u.v)||u.v.length!==6||!u.v.every(x=>int(x,1,100)))throw new Error('포켓몬 정보가 잘못됐어요');
    const t=(Array.isArray(u.t)?u.t:[]).filter(k=>TRAITS[k]).slice(0,3);if(!t.length)t.push('keeneye');
    const okPot=x=>x===0||(Array.isArray(x)&&int(x[0],0,3)&&Array.isArray(x[1])&&x[1].length<=2&&x[1].every(k=>AUG[k]));
    const s=(Array.isArray(u.s)?u.s:[]).slice(0,4).filter(a=>Array.isArray(a)&&MOVES[a[0]]&&int(a[1],0,MOVES[a[0]].length-1)&&int(a[2],1,10)&&int(a[3],0,15)&&int(a[4],0,10)&&okPot(a[5])&&okPot(a[6])&&(a[0]==='N'||D(u.i).types.includes(a[0])));
    return{i:u.i,k:typeof u.k==='string'?u.k.slice(0,10):undefined,l:u.l,v:u.v,t,s}});
  const dg={};if(o.g&&typeof o.g==='object')DUNGEONS.forEach(d=>{const a=o.g[d.id];if(Array.isArray(a)&&a.length===3&&int(a[0],0,99999)&&int(a[1],0,99999)&&int(a[2],0,20))dg[d.id]=a});
  return{id:o.id,name:o.n.slice(0,10)||'트레이너',badges:int(o.b,0,10)?o.b:0,max:int(o.x,1,9999)?o.x:1,team,dg,dgr:int(o.gr,0,99999)?o.gr:0,dgk:o.gk===1}}

/* ================= 3대3 배틀 엔진 ================= */
function pvpRun(teamA,teamB){
  const mk=(u,side,idx)=>{const p=D(u.i);const st={};STAT_K.forEach((k,i)=>st[k]=calcStat(p.base[i],u.v[i],u.l,i===0));const rm=ROLE_MOD[idx===0?'melee':'ranged'];st.hp*=rm.hp;st.atk*=rm.atk;st.spa*=rm.atk;st.def*=rm.def;st.spd*=rm.def;st.spe*=rm.spe;const mx=st.hp*HP_MUL;
    return{side,idx,role:idx===0?'melee':'ranged',id:u.i,name:p.name,lv:u.l,types:p.types,st,traits:u.t,hp:mx,max:mx,down:false,cd:[0,0,0,0],gap:0,basic:0.3+Math.random()*0.4,dots:[],para:0,seal:0,moxie:0,
      skills:u.s.map(a=>({t:a[0],m:a[1],g:a[2],sc:a[3],st:a[4],pot:a[5]?{tier:a[5][0],lines:a[5][1]}:null,add:a[6]?{tier:a[6][0],lines:a[6][1]}:null}))}};
  const sides=[teamA.map((u,i)=>mk(u,0,i)),teamB.map((u,i)=>mk(u,1,i))];const SD=[{buff:0,bv:0,vuln:0,vv:0},{buff:0,bv:0,vuln:0,vv:0}];
  let t=0;const logs=[],frames=[];const L=s=>{if(logs.length<400)logs.push(s)};const has=(u,k)=>u.traits.includes(k);
  const alive=s=>sides[s].filter(u=>!u.down);
  const pickT=s=>{const al=alive(s);if(!al.length)return null;const mel=al.find(u=>u.role==='melee');if(mel)return mel;const w=[0.5,0.3,0.2];let sum=0;al.forEach((u,i)=>sum+=w[i]);let r=Math.random()*sum;for(let i=0;i<al.length;i++){r-=w[i];if(r<=0)return al[i]}return al[0]};
  const faint=(u,by)=>{if(!u.down&&u.hp<=0){u.down=true;u.hp=0;L(`${u.side?'상대':'내'} ${u.name} 쓰러짐!`);if(by&&has(by,'moxie'))by.moxie=Math.min(5,by.moxie+1)}};
  function dmg(a,d,type,pow,cat,mul,o){if(d.down)return;const mb=has(a,'moldbreaker');
    if(has(a,'hustle')&&cat==='p'&&Math.random()<0.15)return;
    if(!mb){const ab=d.traits.find(k=>ABSORB[k]===type);if(ab){L(`${d.name}의 ${TRAITS[ab].n}! 효과가 없다`);return}}
    const ef=eff(type,d.types);if(ef===0)return;
    let A=cat==='p'?a.st.atk:a.st.spa;if(cat==='p'&&has(a,'hugepower'))A*=2;if(cat==='p'&&has(a,'hustle'))A*=1.4;if(has(a,'guts')&&a.hp<a.max*0.5)A*=1.4;if(a.moxie)A*=1+0.06*a.moxie;
    if(t<SD[a.side].buff)A*=1+SD[a.side].bv;if(!mb&&alive(d.side).some(u=>has(u,'intimidate')))A*=0.8;
    let Df=cat==='p'?d.st.def:d.st.spd;if(has(a,'unaware'))Df*=0.5;
    let x=pow*A*Math.sqrt(A/Math.max(1,Df))*0.6*mul;
    if(a.types.includes(type)||has(a,'protean'))x*=has(a,'adaptability')?2:1.5;if(type==='N'&&pow!==0.8&&a.types.includes('N'))x*=1.1;
    x*=ef;if(ef<1&&has(a,'tintedlens'))x*=2;if((a.role==='melee'&&cat==='p')||(a.role==='ranged'&&cat==='s'))x*=1.15;
    for(const k of a.traits){const tr=TRAITS[k];if(tr.boost&&tr.boost[type])x*=1+tr.boost[type]/100;if(tr.pinch===type)x*=a.hp<=a.max/3?1.3:1.1}
    if(has(a,'compoundeyes'))x*=1.08;if(has(a,'technician')&&pow<=1)x*=1.5;
    if(!mb){if(has(d,'thickfat')&&(type==='F'||type==='I'))x*=0.5;if(has(d,'multiscale')&&d.hp>=d.max)x*=0.5;if(has(d,'solidrock')&&ef>1)x*=0.65;if(has(d,'wonderguard')&&ef<=1)x*=0.4;if(has(d,'magicguard'))x*=0.9}
    if(t<SD[d.side].vuln)x*=1+SD[d.side].vv;if(o.exec&&d.hp<d.max*0.3)x*=1+o.exec/100;
    const cr=Math.random()<(5+(has(a,'keeneye')?5:0)+(has(a,'superluck')?12:0)+(o.crit||0))/100;if(cr)x*=has(a,'sniper')?3:2;
    if(!mb&&has(d,'sturdy')&&d.hp>=d.max&&x>=d.hp){x=d.hp-1;L(`${d.name}은(는) 옹골참으로 버텼다!`)}
    d.hp-=x;if(ef>1&&pow>0.85)L(`효과가 굉장했다! (${d.name})`);
    if(o.dot&&!has(a,'sheerforce'))d.dots.push({until:t+5,dps:x*o.dot/100*(has(a,'serenegrace')?2:1)});
    const sg=has(d,'serenegrace')?2:1;
    if(has(d,'roughskin'))a.hp-=x*0.15;
    if(has(d,'static')&&Math.random()<0.2*sg)a.para=t+3;
    if(has(d,'flamebody')&&Math.random()<0.2*sg)a.dots.push({until:t+5,dps:d.st.spa*0.35});
    if(has(d,'poisonpoint')&&Math.random()<0.2*sg)a.dots.push({until:t+5,dps:d.st.atk*0.35});
    if(has(d,'cursedbody')&&Math.random()<0.3*sg)a.seal=t+3;
    faint(d,a);faint(a,d)}
  function castP(u,s,i){const mv=MV(s),a=augs(s),foe=1-u.side;L(`${u.side?'상대':'내'} ${u.name}의 ${mv.name}!`);
    if(mv.kind==='buff'){const si=supInfo(s,false,true);SD[u.side].buff=t+si.dur;SD[u.side].bv=si.val}
    else if(mv.kind==='debuff'){const si=supInfo(s,false,true);SD[foe].vuln=t+si.dur;SD[foe].vv=si.val}
    else{let tg,pm=1;if(mv.kind==='aoe'){tg=alive(foe);if(a.aoe)pm=1+a.aoe*0.004}else if(a.aoe){tg=alive(foe);pm=a.aoe/100}else{const x=pickT(foe);tg=x?[x]:[]}
      let mul=gradeMul(s.g)*(1+0.1*s.sc)*(1+(a.dmg||0)/100)*pm;if(has(u,'sheerforce'))mul*=1.3;if(has(u,'reckless'))mul*=1.35;
      const hits=mv.hits+(mv.kind==='multi'&&has(u,'skilllink')?2:0);const o={crit:a.crit||0,exec:a.exec||0,dot:a.dot||0};
      for(let k=0;k<hits;k++)tg.forEach(d=>dmg(u,d,s.t,mv.pow,mv.cat,mul,o));if(a.multi)tg.forEach(d=>dmg(u,d,s.t,mv.pow,mv.cat,mul*a.multi/100,{...o,dot:0}));
      if(has(u,'reckless')&&!has(u,'magicguard')){u.hp-=u.max*0.04;faint(u,null)}}
    const rc=(a.reset||0)*(has(u,'serenegrace')?2:1);u.cd[i]=rc&&Math.random()<rc/100?0:MV(s).cd*Math.max(0.4,1-0.06*s.st);u.gap=has(u,'earlybird')&&t<6?0.4:0.8}
  const snap=()=>frames.push({t,hp:sides.map(s=>s.map(u=>Math.max(0,u.hp/u.max))),l:logs.length});
  snap();let nextF=0.5;const dt=0.1;
  while(t<90&&alive(0).length&&alive(1).length){t+=dt;
    for(const u of[...sides[0],...sides[1]]){if(u.down)continue;u.dots=u.dots.filter(x=>x.until>t);for(const x of u.dots)u.hp-=x.dps*dt;faint(u,null);if(u.down)continue;
      u.gap-=dt;u.basic-=dt;for(let i=0;i<4;i++)u.cd[i]-=dt;if(t<u.seal)continue;const foe=1-u.side;if(!alive(foe).length)break;
      if(u.gap<=0)for(let i=0;i<u.skills.length;i++){if(u.cd[i]<=0){castP(u,u.skills[i],i);break}}
      if(u.down)continue;
      if(u.basic<=0){u.basic=interval(u.st.spe,u.lv)*(t<u.para?2:1)/(has(u,'speedboost')?1+Math.min(0.5,Math.floor(t/5)*0.1):1);const tg=pickT(foe);if(tg)dmg(u,tg,'N',0.8,'p',1,{})}}
    if(t>=nextF){snap();nextF+=0.5}}
  snap();const ra=alive(0).length,rb=alive(1).length;let win;
  if(ra&&!rb)win=0;else if(rb&&!ra)win=1;else{const sa=sides[0].reduce((x,u)=>x+u.hp/u.max,0)/sides[0].length,sb=sides[1].reduce((x,u)=>x+u.hp/u.max,0)/sides[1].length;win=sa>=sb?0:1;L('시간 종료! 남은 체력으로 판정')}
  return{frames,logs,win}}
function playPvp(i){const f=S.friends[i];if(!f)return;const mine=myTeam();if(!mine.length)return;
  const res=pvpRun(mine,f.team);openModal('pvp',i);let k=0,shown=0;
  const draw=fr=>{['A','B'].forEach((s,si)=>fr.hp[si].forEach((v,j)=>{const el=document.getElementById(`pv${s}${j}`);if(!el)return;const hb=el.querySelector('.hp');hb.className='hp'+hpCls(v);hb.firstChild.style.width=(v*100)+'%';el.classList.toggle('down',v<=0)}));
    const lg=$('#pvpLog');if(lg){while(shown<fr.l){const d=document.createElement('div');d.textContent=res.logs[shown++];lg.prepend(d)}}};
  const finish=()=>{if(UI.pvpTimer){clearInterval(UI.pvpTimer);UI.pvpTimer=null}draw(res.frames[res.frames.length-1]);const r=$('#pvpRes');if(r){r.className='pvp-res '+(res.win===0?'win':'lose');r.textContent=res.win===0?'승리!':'패배…'}
    const b=$('#pvpSkipBtn');if(b)b.remove();if(res.win===0){S.pvp.w++;f.w=(f.w||0)+1}else{S.pvp.l++;f.l=(f.l||0)+1}log(`${esc(f.name)}님과의 3대3 배틀 ${res.win===0?'승리':'패배'}`);save()};
  UI.pvpFinish=finish;UI.pvpTimer=setInterval(()=>{if(k>=res.frames.length){finish();return}draw(res.frames[k++])},100)}

filter(d){UI.filter=d.t;renderPanel()},
skill(d){openModal('skill',+d.uid)},
pickSkill(d){openModal('pickSkill',+d.m,+d.j)},
pickParty(d){openModal('pickParty',+d.slot)},
mon(d){openModal('mon',+d.uid)},
traitInfo(d){openModal('traitInfo',d.k)},
equip(d){const s=skBy(+d.uid),m=monBy(+d.m),j=+d.j;if(!s||!m||!canEquip(s,m))return;
  if(s.eq){const o=monBy(s.eq);if(o)o.skills=o.skills.map(u=>u===s.uid?null:u)}

unequip(d){const s=skBy(+d.uid);if(!s||!s.eq)return;const m=monBy(s.eq);if(m)m.skills=m.skills.map(u=>u===s.uid?null:u);s.eq=null;R.pver++;renderModal();renderPanel()},
skUp(d){const m=monBy(+d.m),j=+d.j;if(!m||j<1)return;[m.skills[j-1],m.skills[j]]=[m.skills[j],m.skills[j-1]];const rt=R.rt[m.uid];if(rt)[rt.cd[j-1],rt.cd[j]]=[rt.cd[j],rt.cd[j-1]];R.pver++;renderPanel()},
pset(d){const slot=+d.slot,uid=+d.uid;if(slot>=slotsFor(S.maxStage)||S.party.includes(uid))return;if(dgIsReg(uid)){toast('탐험대에 등록된 포켓몬이에요. 던전 탭에서 해제한 뒤 편성할 수 있어요','bad');return}
  if(slot<S.party.length)S.party[slot]=uid;else S.party.push(uid);const nm=monBy(uid);const rt=getRt(nm);rt.x=HOME[S.party.indexOf(uid)];syncParty();R.pver++;closeModal()},
partyUp(d){const i=+d.i;if(i<1||i>=S.party.length)return;[S.party[i-1],S.party[i]]=[S.party[i],S.party[i-1]];syncParty();R.pver++;renderPanel()},
unparty(d){if(S.party.length<=1)return;S.party=S.party.filter(u=>u!==+d.uid);syncParty();R.pver++;if(UI.modal)renderModal();renderPanel()},
lock(d){const s=skBy(+d.uid);s.lock=!s.lock;renderModal()},
sellSkill(d){const s=skBy(+d.uid);if(!s||s.eq||s.lock)return;S.gold+=skillSellPrice(s);S.bag=S.bag.filter(x=>x!==s);toast(`${MV(s).name} 판매 +${fmt(skillSellPrice(s))}골드`);closeModal()},
scroll(d){const s=skBy(+d.uid);if(!s||s.sc>=15)return;const c=scrollCost(s);if(S.gold<c)return;S.gold-=c;
  dAdd('enh');if(rnd()*100<scrollRate(s)){s.sc++;toast(`주문서 성공! +${s.sc}`,'gold')}else toast('주문서 실패… (수치 유지)');renderModal()},
star(d){const s=skBy(+d.uid);if(!s||s.st>=10)return;const c=starCost(s);if(S.gold<c)return;S.gold-=c;
  dAdd('enh');if(rnd()*100<starRate(s)){s.st++;toast(`숙련 성공! ◆${s.st}`,'gold')}else if(s.st>=5&&rnd()<0.3){s.st--;toast(`숙련 실패, ◆${s.st}로 하락`)}else toast('숙련 실패 (유지)');renderModal()},
cube(d){const s=skBy(+d.uid),k=d.k,item=k==='pot'?'cube':'acube';if(!s)return;const need=cubeCost(s[k]);if(S.items[item]<need){toast(`${ITEM_N[item]}이 ${need}개 필요해요`,'bad');return}S.items[item]-=need;
  const n=k==='pot'?2:1;let p=s[k];let up=false;
  if(!p)p={tier:0,lines:[]};else if(p.tier<3&&rnd()<TIER_UP[p.tier]*(1+B.augup/100)){p.tier++;up=true}
  const lines=[];const sup=isSup(MV(s));for(let i=0;i<n;i++)lines.push(rollAug(lines,sup));p.lines=lines;s[k]=p;
  if(up)toast(`등급 상승! <b style="color:${TIER_COL[p.tier]}">${TIER_N[p.tier]}</b>`,'gold');renderModal()},
buyCube(d){const price=cubePrice()*(d.k==='acube'?4:1);if(S.gold<price)return;S.gold-=price;S.items[d.k]++;renderModal()},
synthMode(){UI.synth=!UI.synth;UI.sel=[];renderPanel()},
synthPick(d){const u=+d.uid;const s=skBy(u);if(!s||s.eq||s.lock||s.g>=10)return;
  if(UI.sel.includes(u))UI.sel=UI.sel.filter(x=>x!==u);else{if(UI.sel.length&&skBy(UI.sel[0]).g!==s.g)return;if(UI.sel.length<SYN_N)UI.sel.push(u)}renderPanel()},
synthGo(){if(UI.sel.length!==SYN_N)return;const ss=UI.sel.map(skBy);if(ss.some(s=>!s||s.eq||s.lock)||new Set(ss.map(s=>s.g)).size!==1)return;
  const g=ss[0].g+1;S.bag=S.bag.filter(s=>!UI.sel.includes(s.uid));const n=makeSkill(pick(TK),g);S.bag.push(n);UI.sel=[];UI.synth=false;
  log(`합성: <b>${g}등급 ${MV(n).name}</b>`);openModal('result',{title:'합성 성공!',body:`<b style="color:${GRADE_COL[g]}">${g}등급</b> ${T[n.t]} 스킬 「${MV(n).name}」이 탄생했습니다.`})},
autoSynth(){const before=S.bag.length;const got={};const logLen=S.log.length;
  for(let g=1;g<=9;g++){let pool=S.bag.filter(s=>s.g===g&&!s.eq&&!s.lock&&isPlain(s));
    while(pool.length>=SYN_N){const use=pool.splice(0,SYN_N).map(s=>s.uid);S.bag=S.bag.filter(s=>!use.includes(s.uid));S.bag.push(makeSkill(pick(TK),g+1));got[g+1]=(got[g+1]||0)+1}}
  const made=Object.values(got).reduce((a,x)=>a+x,0);
  openModal('result',{title:'일괄 합성',body:made?`미강화 스킬 ${SYN_N}개씩 ${made}번 합성했어요. 결과: ${Object.entries(got).map(([g,c])=>`${g}등급 ${c}개`).join(', ')}`:`합성할 수 있는 조합이 없어요. (같은 등급, 미착용·미잠금·미강화 스킬 ${SYN_N}개 필요)`})},
toggleAutoSynth(){S.autoSynth=!S.autoSynth;if(S.autoSynth)for(let g=1;g<10;g++)autoSynthFrom(g);toast(S.autoSynth?'자동 합성 ON':'자동 합성 OFF');renderPanel()},
setSellG(d,el){S.sellG=+el.value},
sellLow(){const G=S.sellG||2;const list=S.bag.filter(s=>s.g<=G&&!s.eq&&!s.lock&&isPlain(s));const gold=list.reduce((a,s)=>a+skillSellPrice(s),0);S.gold+=gold;S.bag=S.bag.filter(s=>!list.includes(s));toast(list.length?`${G}등급 이하 ${list.length}개 판매 +${fmt(gold)}골드`:`판매할 ${G}등급 이하 스킬이 없어요.`);renderPanel()},
