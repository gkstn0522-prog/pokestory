<title>포켓몬스토리 키우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@400;600;800&display=swap">
<style>
/* 세로 폰 화면: 위쪽은 전투 무대, 아래쪽은 탭으로 나뉜 관리 패널 */
:root{
  --bg:#12151d; --panel:#1a1f2b; --panel2:#232a39; --line:#2f3749;
  --fg:#eceef5; --muted:#8e96aa; --accent:#f2b84b; --accent-ink:#1d1504;
  --good:#5fd38d; --warn:#f2c94c; --bad:#ff6b6b; --admin:#c58cff;
  --f-display:"Do Hyeon","Gothic A1",system-ui,sans-serif;
  --f-body:"Gothic A1",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;padding-inline:16px;padding-block:10px 40px;user-select:none;-webkit-user-select:none}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:inherit}
input,select{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;user-select:text;-webkit-user-select:text}
input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
small{color:var(--muted);font-weight:400}

.top{display:flex;flex-direction:column;gap:7px}
.stagebar{display:flex;align-items:baseline;gap:10px}
.stage-no{font-family:var(--f-display);font-size:30px;line-height:1}
.region{color:var(--muted);font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog-label{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);width:0;transition:width .15s linear}
.prog.boss>i{background:var(--bad)}
.prog.mine>i{background:#8fb3ff}
.res{display:flex;flex-wrap:wrap;gap:5px}
.invbtn{display:flex;align-items:center;gap:8px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer;font-size:13px;font-variant-numeric:tabular-nums}
.invbtn b{color:var(--accent);font-weight:600}
.invbtn span:last-child{margin-left:auto;color:var(--muted);font-size:12px}
.shop-row{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:12px;padding:10px}
.shop-row .grow b{font-size:14px}
.inv-row{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:8px}
.inv-row .cnt{font-family:var(--f-display);font-size:20px;color:var(--accent);min-width:48px;text-align:right}
.rgrade{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.rgrade b{font-size:14px}
.odds{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11px;text-align:center}
.odds span{background:var(--panel2);border-radius:8px;padding:5px 2px}
.res>span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.res>span b{color:var(--accent);font-weight:600}

.field{position:relative;border-radius:16px;padding:0;height:250px;display:block;
  background:radial-gradient(120% 80% at 50% 110%,rgba(0,0,0,.55),transparent 60%),linear-gradient(180deg,var(--regc,#2a3348),var(--bg));border:1px solid var(--line);overflow:hidden}
.field canvas{display:block;width:100%;height:100%}
.side{display:flex;flex-direction:column;gap:6px;justify-content:center;min-width:0}
.unit{position:relative;display:flex;align-items:center;gap:6px;background:rgba(8,10,16,.5);border-radius:11px;padding:4px 7px;min-width:0;transition:opacity .2s}
.enemy{flex-direction:row-reverse;text-align:right}
.unit.dead{opacity:.18}
.unit.down{opacity:.35;filter:grayscale(1)}
.unit.boss{padding:8px;border:1px solid rgba(255,107,107,.5)}
.unit .meta{min-width:0;flex:1}
.unit .nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit .nm small{font-size:11px}
.hp{height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;margin-top:3px}
.hp>i{display:block;height:100%;background:var(--good);width:100%}
.hp.mid>i{background:var(--warn)}.hp.low>i{background:var(--bad)}
.unit.boss .hp{height:8px}.unit.boss .hp>i{background:var(--bad)}
.etrait{font-size:10px;color:#ffb0d0}
.cds{display:flex;gap:3px;margin-top:4px}
.cds i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.12);position:relative;overflow:hidden}
.cds i>b{position:absolute;inset:0;background:var(--c);transform-origin:left center}
.cds i.none{background:rgba(255,255,255,.05)}
.lock-slot{border:1px dashed var(--line);border-radius:11px;padding:10px;color:var(--muted);font-size:12px;text-align:center}
.buffbar{position:absolute;left:10px;top:6px;font-size:11px;color:#ffe08a}

/* 포켓몬 그림: PokeAPI 이미지를 불러오고, 못 불러오면 타입색 구슬로 표시 */
.orb{position:relative;width:var(--sz);height:var(--sz);flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);color:#10121a;font-size:calc(var(--sz)*.44);line-height:1;
  background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.6),transparent 36%),linear-gradient(135deg,var(--c1) 0 50%,var(--c2) 50% 100%);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 2px 6px rgba(0,0,0,.35)}
.orb img{position:absolute;left:50%;top:50%;width:150%;height:150%;transform:translate(-50%,-55%);image-rendering:pixelated;opacity:0;pointer-events:none}
.orb.ok{background:none;box-shadow:none;color:transparent}
.orb.ok img{opacity:1}

.float{position:absolute;pointer-events:none;font-family:var(--f-display);font-size:15px;animation:up .85s ease-out forwards;text-shadow:0 1px 2px #000,0 0 4px #000;white-space:nowrap;z-index:3;color:#fff}
.float.crit{color:#ffd34d;font-size:20px}.float.sup{color:#ff9a6b}.float.weak{color:#9aa1b1}.float.info{color:#cfe3ff;font-size:12px}.float.zero{color:#9aa1b1;font-size:12px}
.float.hurt{color:#ff8080;font-size:14px}.float.heal{color:var(--good);font-size:13px}.float.trait{color:#ffb0d0;font-size:12px}
@keyframes up{from{transform:translateY(0);opacity:1}to{transform:translateY(-34px);opacity:0}}
@media (prefers-reduced-motion:reduce){.float{animation-duration:.01s}.prog>i{transition:none}}

.controls{display:flex;gap:6px;flex-wrap:wrap}
.controls .btn{flex:1 1 30%}
.btn{font-size:13px;font-weight:600;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer;line-height:1.2}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.tab:focus-visible,.slot-main:focus-visible,.row-btn:focus-visible,.mcell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.on,.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn.adm{border-color:var(--admin);color:var(--admin)}
.btn.sm{padding:6px 9px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:6px;z-index:5}
.tab{background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 0;font-size:13px;cursor:pointer;color:var(--muted);position:relative}
.tab.on{background:var(--panel2);color:var(--fg);border-color:var(--muted)}
.tab .dot{position:absolute;top:4px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--bad)}
.panel{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:19px}
.sub{color:var(--muted);font-size:12px;line-height:1.5}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.mon-h{display:flex;gap:10px;align-items:center}
.mon-n{font-family:var(--f-display);font-size:20px}
.bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-block:5px}
.bar>i{display:block;height:100%;background:#8fb3ff}
.role{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;margin-right:3px;border:1px solid var(--rc);color:var(--rc)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;color:#10121a;background:var(--tc);margin-right:3px;white-space:nowrap}
.tchip{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--tg);color:var(--tg);margin:0 3px 3px 0;white-space:nowrap;background:transparent;cursor:pointer}
.locked{color:var(--muted);text-align:center;border-style:dashed}
.empty-card{background:transparent;border:1px dashed var(--line);border-radius:14px;padding:18px;cursor:pointer;color:var(--muted);font-weight:600}

.slots{display:flex;flex-direction:column;gap:5px}
.slot{display:flex;align-items:center;gap:6px}
.ord{width:18px;text-align:center;font-family:var(--f-display);color:var(--muted);flex:none}
.slot-main,.row-btn{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 8px;cursor:pointer;text-align:left}
.slot-main.empty{color:var(--muted);justify-content:center;border-style:dashed;background:transparent;font-size:12px}
.ico{background:var(--panel2);border:1px solid var(--line);border-radius:8px;width:30px;height:32px;cursor:pointer;flex:none;font-size:11px}
.g{flex:none;min-width:24px;height:22px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-display);font-size:14px;color:#10121a;background:var(--gc);padding-inline:3px}
.g.g10{background:linear-gradient(90deg,#ff6b6b,#ffd34d,#5fd38d,#4fa3ff,#b07cff)}
.sn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.st{color:#ffd34d;font-size:12px;flex:none}
.pt{font-size:11px;font-weight:800;flex:none}
.cd{color:var(--muted);font-size:11px;flex:none;font-variant-numeric:tabular-nums}
.cat{font-size:10px;color:var(--muted);flex:none}
.eqtag{font-size:10px;color:var(--accent);flex:none}
.row-btn.sel{border-color:var(--accent);background:rgba(242,184,75,.14)}
.row-btn.dim{opacity:.4}
.list{display:flex;flex-direction:column;gap:5px}
.filters{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .btn{flex:none}

.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-variant-numeric:tabular-nums}
.sec{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h b{font-size:14px}
.lines{display:flex;flex-direction:column;gap:3px;font-size:13px}
.lines div::before{content:"· ";color:var(--muted)}
.tier{font-weight:800;font-size:12px}

.stats{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.stats th{color:var(--muted);font-weight:400;font-size:11px;text-align:right;padding:3px 4px}
.stats th:first-child,.stats td:first-child{text-align:left}
.stats td{padding:5px 4px;text-align:right;border-top:1px solid var(--line)}
.stats .sbar{display:inline-block;height:6px;border-radius:3px;background:var(--sc);vertical-align:middle;margin-right:6px}
.ivg{display:inline-block;min-width:28px;text-align:center;font-family:var(--f-display);font-size:14px;border-radius:5px;padding:0 4px;color:#10121a;background:var(--ivc)}
.ivg.ss{background:linear-gradient(90deg,#ff6b6b,#ffd34d,#5fd38d,#4fa3ff)}

.trait-line{display:flex;gap:8px;align-items:flex-start;background:var(--panel2);border-radius:10px;padding:9px 10px}
.trait-line .grow b{font-size:14px}
.trait-line input{width:18px;height:18px;accent-color:var(--accent);margin-top:2px;flex:none;padding:0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.mcell{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:12px}
.mcell.inparty{border-color:var(--accent)}
.mcell .lv{color:var(--muted);font-size:11px;text-align:center}
.relic{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:3px}
.relic.off{opacity:.45}
.relic b{font-size:13px}
.relic .lvl{font-family:var(--f-display);color:var(--accent)}
.log{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;max-height:360px;overflow:auto}
.log b{color:var(--fg);font-weight:600}
.adm-h{color:var(--admin)}
.adm-sec{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.adm-sec>b{font-size:13px;color:var(--admin)}
.fld{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);min-width:0}
.fld input,.fld select{width:100%}

.modal{position:fixed;inset:0;background:rgba(5,6,10,.72);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:520px;width:100%;max-height:86vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.sheet-h{display:flex;align-items:center;gap:10px}
.sheet-h h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px;flex:1;min-width:0}
.x{background:var(--panel2);border:1px solid var(--line);border-radius:9px;width:34px;height:34px;cursor:pointer;flex:none}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:30;width:min(440px,calc(100% - 32px));pointer-events:none}
.toast{background:#2b3346;border:1px solid var(--muted);border-radius:12px;padding:10px 12px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:tin .25s ease-out}
.toast.gold{border-color:var(--accent)}
.toast.bad{border-color:var(--bad)}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

.starter{position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto;padding:24px 16px}
.starter-in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.logo{font-family:var(--f-display);font-size:40px;line-height:1.05;margin:12px 0 0;text-wrap:balance}
.logo span{color:var(--accent)}
.st-card{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;text-align:left}
.st-card:hover{border-color:var(--accent)}
.st-card .mon-n{font-size:24px}
.ver{color:var(--muted);font-size:11px;text-align:center}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:5px}
.dcell{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:5px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:11px;min-width:0}
.dcell .dno{color:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}
.dcell .dnm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dcell.seen .orb img{filter:brightness(0);opacity:.55}
.dcell.seen .dnm{color:var(--muted)}
.dcell.unseen{cursor:default;opacity:.45}
.qorb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--panel);color:var(--muted);font-family:var(--f-display);font-size:18px}
.badges{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;text-align:center;color:var(--muted)}
.badge i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-display);font-size:16px;color:#10121a;background:var(--bc);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.badge.off i{background:var(--panel2);color:var(--muted);box-shadow:none;border:1px dashed var(--line)}
.badge.on{color:var(--fg)}
textarea.code{width:100%;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px;resize:none;word-break:break-all;user-select:text;-webkit-user-select:text}
.pvp-team{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pvp-u{background:var(--panel2);border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;min-width:0;transition:opacity .2s}
.pvp-u.down{opacity:.3;filter:grayscale(1)}
.pvp-u .hp{width:100%}
.pvp-vs{text-align:center;font-family:var(--f-display);font-size:18px;color:var(--muted)}
.pvp-log{font-size:12px;color:var(--muted);max-height:160px;overflow:auto;display:flex;flex-direction:column-reverse;gap:2px;background:var(--panel2);border-radius:10px;padding:8px}
.pvp-res{font-family:var(--f-display);font-size:30px;text-align:center}
.pvp-res.win{color:var(--accent)}.pvp-res.lose{color:var(--bad)}
.name-in{font-size:16px;padding:12px}
.gymtag{color:var(--accent)}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="stagebar"><span class="stage-no" id="stageNo">1-1</span><span class="region" id="region"></span><span class="prog-label" id="progLabel"></span></div>
    <div class="prog" id="prog"><i></i></div>
    <div class="res" id="res"></div>
  </header>
  <section class="field" id="field" aria-label="전투 화면"><canvas id="cv"></canvas></section>
  <div class="controls">
    <button class="btn" id="bBoss" data-act="boss">자동 진행</button>
    <button class="btn" id="bMine" data-act="mine">광산 파밍</button>
    <button class="btn adm" id="bAdmin" data-act="adminOpen">관리자</button>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab on" data-act="tab" data-t="party">파티</button>
    <button class="tab" data-act="tab" data-t="skills">스킬</button>
    <button class="tab" data-act="tab" data-t="box">보관함</button>
    <button class="tab" data-act="tab" data-t="dex">도감</button>
    <button class="tab" data-act="tab" data-t="relic">유물</button>
    <button class="tab" data-act="tab" data-t="shop">상점</button>
    <button class="tab" data-act="tab" data-t="friend">친구</button>
    <button class="tab" data-act="tab" data-t="trainer">트레이너</button>
  </nav>
  <main class="panel" id="panel"></main>
  <p class="ver" id="ver"></p>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="toasts" id="toasts"></div>
<div class="starter" id="starter" hidden>
  <div class="starter-in">
    <h1 class="logo">포켓몬스토리<br><span>키우기</span></h1>
    <p class="sub">함께 모험을 시작할 첫 번째 포켓몬을 고르세요. 개체값은 고르는 순간 정해집니다. 처음에는 한 마리로 시작하고, 스테이지 2-1과 4-1에 도달하면 파티 슬롯이 하나씩 늘어납니다.</p>
    <label class="fld" for="pname">트레이너 이름 (최대 10자)<input id="pname" class="name-in" maxlength="10" autocomplete="off" placeholder="예: 레드"></label>
    <div id="starterList" style="display:flex;flex-direction:column;gap:10px"></div>
  </div>
</div>

function toast(msg,cls){const el=document.createElement('div');el.className='toast '+(cls||'');el.innerHTML=msg;const box=$('#toasts');box.appendChild(el);while(box.children.length>3)box.firstChild.remove();setTimeout(()=>el.remove(),2800)}

/* ================= 포켓몬 생성 / 특성 ================= */
function rollTraitCount(){const r=rnd();return r<0.01?3:r<0.11?2:1}
function rollTrait(ex,forceG){const up=1+((B&&B.augup)||0)/100;const g=forceG!==undefined?forceG:+wpick({0:TG_W[0],1:TG_W[1]*up,2:TG_W[2]*up,3:TG_W[3]*up});
  const opts=Object.keys(TRAITS).filter(k=>TRAITS[k].g===g&&!ex.includes(k));return pick(opts.length?opts:Object.keys(TRAITS).filter(k=>!ex.includes(k)))}
function rollTraits(n,forceG){const a=[];for(let i=0;i<n;i++)a.push(rollTrait(a,forceG));return a}
function makeMon(id,lv,traits,iv){const m={uid:S.uid++,id,lv,exp:0,iv:iv||rollIv(),traits:traits||rollTraits(rollTraitCount()),skills:[null,null,null,null]};S.caught[id]=1;return m}
function traitChips(m,act){return m.traits.map(k=>{const t=TRAITS[k];return`<button class="tchip" style="--tg:${TG_COL[t.g]}" ${act?`data-act="traitInfo" data-k="${k}"`:'tabindex="-1"'}>${t.n}</button>`}).join('')}

/* ================= 스킬 생성/드랍 ================= */
function makeSkill(t,g,m){return{uid:S.uid++,t,m:m===undefined?Math.floor(rnd()*MOVES[t].length):m,g,sc:0,st:0,pot:null,add:null,lock:false,eq:null,isNew:true}}
function dropSkill(types,boss,quiet){
  const maxG=Math.min(5,1+Math.floor(S.stage/12));const w={};
  for(let g=1;g<=maxG;g++)w[g]=Math.pow(boss?0.6:0.4,g-1);
  const g=+wpick(w);const t=rnd()<0.6?pick(types):pick(TK);
  if(S.bag.length>=S.bagMax){S.gold+=skillSellPrice({g});return null}
  const s=makeSkill(t,g);S.bag.push(s);UI.dirty=true;
  if(S.autoSynth&&!quiet)autoSynthFrom(g);
  if(g>=4&&!quiet){toast(`<b style="color:${GRADE_COL[g]}">${g}등급</b> ${T[t]} 스킬 「${MV(s).name}」 획득!`,'gold');log(`${g}등급 ${MV(s).name} 획득`)}
  return s}
const SYN_N=10;
function autoSynthFrom(g){while(g<10){const pool=S.bag.filter(s=>s.g===g&&!s.eq&&!s.lock&&isPlain(s));if(pool.length<SYN_N)break;
  const use=pool.slice(0,SYN_N).map(s=>s.uid);S.bag=S.bag.filter(s=>!use.includes(s.uid));const n=makeSkill(pick(TK),g+1);S.bag.push(n);
  toast(`자동 합성: <b style="color:${GRADE_COL[g+1]}">${g+1}등급</b> ${T[n.t]} 「${MV(n).name}」`,'gold');log(`자동 합성 → ${g+1}등급 ${MV(n).name}`);g++}}
const skillSellPrice=s=>Math.floor(10*s.g*s.g*(1+S.stage*0.08));

/* ================= 전투 ================= */
const M_HP=s=>Math.pow(1.045,s-1), M_ATK=s=>Math.pow(1.015,s-1);
const enemyLv=s=>Math.min(100,1+Math.floor(s*0.95));
function getRt(m){if(!R.rt[m.uid]){const mx=maxHp(m);R.rt[m.uid]={cd:[0,0,0,0],gap:0,basic:0.3,hp:mx,max:mx,down:false,downAt:0,moxie:0}}return R.rt[m.uid]}
function syncMax(m){const rt=getRt(m),mx=maxHp(m);if(mx!==rt.max){rt.hp=rt.down?0:Math.min(mx,rt.hp+(mx-rt.max));rt.max=mx}}
function mkEnemy(id,boss,rb,o){o=o||{};const p=D(id),lv=enemyLv(S.stage);const st={};STAT_K.forEach((k,i)=>{st[k]=calcStat(p.base[i],50,lv,i===0)});S.seen[id]=1;
  const role=rnd()<(st.atk>=st.spa?0.7:0.3)?'melee':'ranged';const rm=ROLE_MOD[role];st.hp*=rm.hp;st.atk*=rm.atk;st.spa*=rm.atk;st.def*=rm.def;st.spd*=rm.def;st.spe*=rm.spe;
  let hp=st.hp*M_HP(S.stage);if(boss)hp*=o.gym?(7.5/o.size):(LEGEND.includes(id)?6:5);
  let trait=null;if(boss)trait=(rb&&o.ace)?REG().bt:(!o.gym&&rnd()<0.5?pick(BOSS_TRAITS):null);
  return{...st,uid:++R.eid,id,lv,types:p.types,hp,max:hp,boss,gym:!!o.gym,ace:!!o.ace,trait,sturdyUsed:false,dots:[],vuln:0,vulnVal:0,para:0,seal:0,atkT:0.6+rnd()*0.8,aoeT:7,role,x:365+(o.slot||0)*24,stack:rnd()*12-6,stopX:285+rnd()*70,flash:0,lunge:0}}
function spawnWave(){const pool=S.mine?MINE_POOL:REG().pool;R.enemies=[];for(let i=0;i<3;i++)R.enemies.push(mkEnemy(pick(pool),false,false,{slot:i}));R.ever++;R.waveT=0}
function healBetween(){for(const m of partyMons()){const rt=getRt(m);
  if(rt.down){if(R.t-rt.downAt>8-B.revive){rt.down=false;rt.hp=rt.max*0.25;floatOn('u'+m.uid,'회복','heal')}continue}
  let h=0.15+B.hpPct/200;if(hasT(m,'naturalcure'))h+=0.15;if(hasT(m,'regenerator'))h+=0.33;rt.hp=Math.min(rt.max,rt.hp+rt.max*h);rt.moxie=0}}
function fullHeal(){partyMons().forEach(m=>{const rt=getRt(m);syncMax(m);rt.down=false;rt.hp=rt.max;rt.moxie=0})}
function startBoss(){const ch=Math.floor((S.stage-1)/10)%10,idx=(S.stage-1)%10,reg=REG();
  R.boss=true;R.waveDelay=0;R.waveT=0;R.gym=null;
  if(idx===9){const g=GYMS[ch];const team=g.team==='rival'?rivalTeam():g.team;R.gym=ch;
    R.enemies=team.map((id,i)=>mkEnemy(id,true,true,{gym:true,ace:i===team.length-1,size:team.length,slot:i}));R.bossMax=45+B.time;
    toast(`<b>${g.title}</b> ${g.leader}${ch<8?' 관장':''}이(가) 승부를 걸어왔다!`,'gold')}
  else{const id=(idx===4&&reg.leg)?reg.leg:finalEvo(pick(reg.pool));R.enemies=[mkEnemy(id,true,false,{ace:true})];R.bossMax=30+B.time;
    if(LEGEND.includes(id))toast(`전설의 포켓몬 <b>${D(id).name}</b> 출현!`,'gold')}
  R.bossT=R.bossMax;R.ever++;
  partyMons().forEach(m=>{const rt=getRt(m);rt.cd=[0,0,0,0];rt.gap=0;rt.moxie=0;if(rt.down){rt.down=false;rt.hp=rt.max*0.5}else rt.hp=Math.max(rt.hp,rt.max*0.5)})}
function nextSpawn(){if(!S.mine&&S.autoBoss&&S.kills>=GOAL)startBoss();else{healBetween();spawnWave()}}
function bossFail(){R.boss=false;S.kills=0;R.enemies=[];R.waveDelay=0.6;R.ever++;
  toast('보스 제한시간 초과! 다시 파밍한 뒤 재도전합니다.','bad');log(`${stageLabel(S.stage)} 보스 시간 초과`)}
function wipe(){const from=S.stage;R.stageT=0;R.boss=false;S.stage=Math.max(1,S.stage-1);S.kills=0;R.enemies=[];R.waveDelay=1;R.ever++;R.pver++;fullHeal();
  toast(`전멸했다… ${stageLabel(S.stage)}부터 다시 성장하며 도전합니다.`,'bad');log(`<b>${stageLabel(from)}</b>에서 전멸 → ${stageLabel(S.stage)}로 후퇴`)}
function bossWin(){const gym=R.gym;const clr=R.stageT||0;S.best=S.best||{};const prevBest=S.best[S.stage];if(!prevBest||clr<prevBest)S.best[S.stage]=clr;
  toast(`${stageLabel(S.stage)} 클리어 ${fmtTime(clr)}${prevBest?` (최고 ${fmtTime(Math.min(prevBest,clr))})`:' (첫 클리어)'}`,clr<(prevBest||1e9)&&prevBest?'gold':'');R.stageT=0;R.boss=false;R.gym=null;const before=slotsFor(S.maxStage);S.stage++;S.kills=0;S.maxStage=Math.max(S.maxStage,S.stage);fullHeal();
  if(gym!==null&&S.stage-1<=100){const g=GYMS[gym];const first=!S.badges[gym];S.badges[gym]=true;
    log(`<b>${g.title} ${g.leader}</b>에게 승리!${first?` <b>${g.badge}</b> 획득`:''}`);
    if(first)openModal('result',{title:`${g.badge} 획득!`,body:`${g.title} ${g.leader}에게 이겼다! 뱃지 ${S.badges.filter(Boolean).length}/10${gym===9?'<br><b>포켓몬리그 챔피언이 되었습니다!</b>':''}`})}
  else log(`<b>${stageLabel(S.stage-1)}</b> 클리어`);
  if(slotsFor(S.maxStage)>before){toast(`파티 슬롯 해금! 이제 포켓몬 ${slotsFor(S.maxStage)}마리로 싸울 수 있어요.`,'gold');log('파티 슬롯 해금')}
  R.pver++;if((S.stage-1)%10===0)toast(`「${REG().name}」 도착!`);UI.dirty=true}

/* 내 포켓몬 → 적 */
function atkStat(m,cat){const st=combatStats(m),rt=getRt(m);let a=cat==='p'?st.atk:st.spa;a*=1+B.atk/100;
  if(cat==='p'&&hasT(m,'hugepower'))a*=2;if(cat==='p'&&hasT(m,'hustle'))a*=1.4;
  if(hasT(m,'guts')&&rt.hp<rt.max*0.5)a*=1.4;if(rt.moxie)a*=1+0.06*rt.moxie;
  if(R.t<R.buffUntil)a*=1+R.buffVal;
  if(bossTrait()==='intimidate'&&!hasT(m,'moldbreaker'))a*=0.8;return a}
function hit(e,m,type,pow,cat,mul,o){
  if(e.dead)return;const tr=hasT(m,'moldbreaker')?null:e.trait;
  if(hasT(m,'hustle')&&cat==='p'&&rnd()<0.15){floatOn('e'+e.uid,'빗나감','zero');return}
  if(tr&&((tr==='levitate'&&type==='D')||(tr==='waterabsorb'&&type==='W')||(tr==='voltabsorb'&&type==='E')||(tr==='flashfire'&&type==='F'))){floatOn('e'+e.uid,`${TRAITS[tr].n}: 무효`,'trait');return}
  const ef=eff(type,e.types);if(ef===0){floatOn('e'+e.uid,'효과 없음','zero');return}
  const A=atkStat(m,cat);let Dd=cat==='p'?e.def:e.spd;if(hasT(m,'unaware'))Dd*=0.5;
  let d=pow*A*Math.sqrt(A/Math.max(1,Dd))*0.6*mul;
  if(D(m.id).types.includes(type)||hasT(m,'protean'))d*=hasT(m,'adaptability')?2:1.5;
  d*=ef;if(ef<1&&hasT(m,'tintedlens'))d*=2;
  {const r=ROLE_MOD[roleOf(m)];if(r&&r.syn===cat)d*=1.15}
  for(const k of m.traits){const t=TRAITS[k];if(t.boost&&t.boost[type])d*=1+t.boost[type]/100;
    if(t.pinch===type){const rt=getRt(m);d*=rt.hp<=rt.max/3?1.3:1.1}}
  if(hasT(m,'compoundeyes'))d*=1.08;if(hasT(m,'technician')&&pow<=2.0)d*=1.5;
  if(tr==='thickfat'&&(type==='F'||type==='I'))d*=0.5;if(tr==='multiscale'&&e.hp>=e.max)d*=0.5;if(tr==='solidrock'&&ef>1)d*=0.65;
  if(e.boss)d*=1+(B.boss+(o.boss||0))/100;
  if(e.vuln>R.t)d*=1+e.vulnVal;
  if(o.exec&&e.hp<e.max*0.3)d*=1+o.exec/100;
  if(ef>1)d*=1+B.sup/100;d*=1+B.dmg/100;
  if(UI.god)d*=1000;
  const crit=rnd()<(5+(hasT(m,'keeneye')?5:0)+(hasT(m,'superluck')?12:0)+(o.crit||0))/100;if(crit)d*=hasT(m,'sniper')?3:2;
  if(tr==='sturdy'&&!e.sturdyUsed&&e.hp>=e.max&&d>=e.hp){d=e.hp-1;e.sturdyUsed=true;floatOn('e'+e.uid,'옹골참!','trait')}
  e.hp-=d;e.flash=0.12;floatOn('e'+e.uid,fmt(d),crit?'crit':ef>1?'sup':ef<1?'weak':'');
  if(B.steal){const rt=getRt(m);if(!rt.down)rt.hp=Math.min(rt.max,rt.hp+Math.min(d,e.max)*B.steal/100)}
  if(o.dot&&!hasT(m,'sheerforce'))e.dots.push({until:R.t+5,dps:d*o.dot/100*(hasT(m,'serenegrace')?2:1)});
  if(e.hp<=0)killEnemy(e,m)}
function killEnemy(e,m){if(e.dead)return;e.dead=true;e.hp=0;if(m&&hasT(m,'moxie')){const rt=getRt(m);rt.moxie=Math.min(5,rt.moxie+1)}onKill(e);if(e.boss&&!R.enemies.some(x=>x.boss&&!x.dead))bossWin()}
function cast(m,s){
  const mv=MV(s),a=augs(s);const alive=R.enemies.filter(e=>!e.dead);if(!alive.length)return false;
  floatOn('u'+m.uid,mv.name,'info');
  if(mv.kind==='buff'){R.buffUntil=R.t+8;R.buffVal=(15+3*s.g+(a.dmg||0)/2)/100;return true}
  if(mv.kind==='debuff'){const v=(15+3*s.g+(a.dmg||0)/2)/100;alive.forEach(e=>{e.vuln=R.t+8;e.vulnVal=v});return true}
  let targets,pm=1;
  const prim=alive.reduce((b,e)=>e.x<b.x?e:b,alive[0]);const near=r=>alive.filter(e=>Math.abs(e.x-prim.x)<=r);let splash=false;
  if(mv.kind==='aoe'){targets=near(140);if(a.aoe)pm=1+a.aoe*0.004}else if(a.aoe){targets=near(140);pm=a.aoe/100}else{targets=[prim];splash=true}
  fxSkill(m,prim,s.t,targets.length>1);
  let mul=gradeMul(s.g)*(1+0.1*s.sc)*(1+(B.skill+(a.dmg||0))/100)*pm;
  if(hasT(m,'sheerforce'))mul*=1.3;if(hasT(m,'reckless'))mul*=1.35;
  const hits=mv.hits+(mv.kind==='multi'&&hasT(m,'skilllink')?2:0);
  const o={boss:a.boss||0,crit:a.crit||0,exec:a.exec||0,dot:a.dot||0};
  for(let h=0;h<hits;h++)targets.forEach(e=>hit(e,m,s.t,mv.pow,mv.cat,mul,o));
  if(a.multi)targets.forEach(e=>hit(e,m,s.t,mv.pow,mv.cat,mul*a.multi/100,{...o,dot:0}));
  if(splash&&mv.pow>0)alive.forEach(e=>{if(e!==prim&&!e.dead&&Math.abs(e.x-prim.x)<=34)hit(e,m,s.t,mv.pow,mv.cat,mul*0.3*hits,{...o,dot:0})});
  if(hasT(m,'reckless')&&!hasT(m,'magicguard')&&!UI.god){const rt=getRt(m);rt.hp-=rt.max*0.04;if(rt.hp<=0)faint(m)}
  const rc=((a.reset||0)+B.reset)*(hasT(m,'serenegrace')?2:1);
  return rc&&rnd()<rc/100?'reset':true}

/* 적 → 내 포켓몬 */
const ABSORB={levitate:'D',waterabsorb:'W',voltabsorb:'E',flashfire:'F'};
function enemyHit(e,m,pow){
  const rt=getRt(m);if(rt.down)return;const tt=D(m.id).types;const type=e.types.reduce((b,t)=>eff(t,tt)>eff(b,tt)?t:b,e.types[0]);const cat=e.atk>=e.spa?'p':'s';
  const ab=m.traits.find(k=>ABSORB[k]===type);if(ab){floatOn('u'+m.uid,`${TRAITS[ab].n}: 무효`,'trait');return}
  const ef=eff(type,D(m.id).types);if(ef===0){floatOn('u'+m.uid,'효과 없음','zero');return}
  const st=combatStats(m);const A=cat==='p'?e.atk:e.spa;const Dd=cat==='p'?st.def:st.spd;
  let d=pow*A*Math.sqrt(A/Math.max(1,Dd))*0.6*1.5*ef*M_ATK(S.stage)*(e.boss?(e.gym?1.5:2.2):1);
  if(partyHas('intimidate'))d*=0.8;
  if(hasT(m,'thickfat')&&(type==='F'||type==='I'))d*=0.5;
  if(hasT(m,'multiscale')&&rt.hp>=rt.max)d*=0.5;
  if(hasT(m,'solidrock')&&ef>1)d*=0.65;
  if(hasT(m,'wonderguard')&&ef<=1)d*=0.4;
  if(hasT(m,'magicguard'))d*=0.9;
  d*=1-Math.min(60,B.def)/100;
  if(UI.god)d=0;
  if(hasT(m,'sturdy')&&rt.hp>=rt.max&&d>=rt.hp){d=rt.hp-1;floatOn('u'+m.uid,'옹골참!','trait')}
  rt.hp-=d;rt.flash=0.12;floatOn('u'+m.uid,'-'+fmt(d),'hurt');
  const sg=hasT(m,'serenegrace')?2:1;
  if(hasT(m,'roughskin')&&!e.dead){e.hp-=d*0.15;if(e.hp<=0)killEnemy(e,m)}
  if(!e.dead){if(hasT(m,'static')&&rnd()<0.2*sg){e.para=R.t+3;floatOn('e'+e.uid,'마비','trait')}
    if(hasT(m,'flamebody')&&rnd()<0.2*sg){e.dots.push({until:R.t+5,dps:atkStat(m,'s')*0.35});floatOn('e'+e.uid,'화상','trait')}
    if(hasT(m,'poisonpoint')&&rnd()<0.2*sg){e.dots.push({until:R.t+5,dps:atkStat(m,'p')*0.35});floatOn('e'+e.uid,'독','trait')}
    if(hasT(m,'cursedbody')&&rnd()<0.3*sg){e.seal=R.t+3;floatOn('e'+e.uid,'봉인','trait')}}
  if(rt.hp<=0)faint(m)}
function faint(m){const rt=getRt(m);if(rt.down)return;rt.down=true;rt.hp=0;rt.downAt=R.t;floatOn('u'+m.uid,'기절!','hurt')}
function pickTarget(){const pm=partyMons();const al=pm.filter(m=>!getRt(m).down);if(!al.length)return null;const mel=al.find(m=>roleOf(m)==='melee');if(mel)return mel;
  const w=[0.6,0.4];let sum=0;al.forEach((m,i)=>sum+=w[i]||0.3);let r=rnd()*sum;for(let i=0;i<al.length;i++){r-=w[i]||0.3;if(r<=0)return al[i]}return al[0]}
const interval=(spe,lv)=>1.2/(0.5+spe/(2*lv+5));
const allDown=()=>!partyMons().some(m=>!getRt(m).down);

function partyFrontX(){const al=partyMons().filter(m=>!getRt(m).down);return al.length?Math.max(...al.map(m=>getRt(m).x)):40}
function step(dt){
  if(!S||!S.party.length)return;
  R.t+=dt;R.stageT=(R.stageT||0)+dt;
  const pm=partyMons();
  pm.forEach((m,i)=>{const rt=getRt(m);if(rt.x===undefined)rt.x=HOME[i];if(rt.flash>0)rt.flash-=dt;if(rt.lunge>0)rt.lunge-=dt});
  for(const e of R.enemies){if(e.flash>0)e.flash-=dt;if(e.lunge>0)e.lunge-=dt}
  const aliveE=R.enemies.filter(e=>!e.dead);const frontE=aliveE.length?aliveE.reduce((b,e)=>e.x<b.x?e:b,aliveE[0]):null;
  // 이동: 근거리는 앞으로 나가고, 나머지는 제자리로
  pm.forEach((m,i)=>{const rt=getRt(m);const home=HOME[i];const tx=(i===0&&!rt.down&&frontE)?clamp(frontE.x-40,home,300):home;rt.x+=clamp(tx-rt.x,-170*dt,170*dt)});
  if(R.waveDelay>0){R.walking=true;R.waveDelay-=dt;if(R.waveDelay<=0){R.walking=false;nextSpawn()}return}
  R.waveT+=dt;
  const pf=partyFrontX();
  for(const e of aliveE){const tx=e.role==='melee'?pf+40+e.stack:Math.max(e.stopX,pf+60);if(e.x>tx)e.x=Math.max(tx,e.x-140*dt);e.ready=e.x<=tx+1.5}
  for(const e of R.enemies){if(e.dead||!e.dots.length)continue;e.dots=e.dots.filter(d=>d.until>R.t);for(const d of e.dots)e.hp-=d.dps*dt;if(e.hp<=0)killEnemy(e,null)}
  if(R.boss){R.bossT-=dt;if(R.bossT<=0&&R.enemies.some(e=>!e.dead)){bossFail();return}}
  else if(R.waveT>40&&R.enemies.some(e=>!e.dead)){R.enemies=[];R.waveDelay=0.35;R.ever++;toast('싸움이 길어지자 야생 포켓몬이 도망쳤다. (상성을 확인해 보세요)');return}
  for(const e of R.enemies){if(e.dead)continue;e.atkT-=dt;
    if(e.ace&&e.ready){e.aoeT-=dt;if(e.aoeT<=0){e.aoeT=7;if(e.seal<R.t){fxRing(e.x,TC[e.types[0]]);partyMons().forEach(m=>enemyHit(e,m,0.35));if(allDown()){wipe();return}}}}
    if(e.atkT<=0){if(!e.ready){e.atkT=0;continue}let iv=interval(e.spe,e.lv)*1.25;if(e.para>R.t)iv*=2;if(e.boss&&partyHas('pressure'))iv*=1.25;e.atkT=iv;

function evoHint(m){const p=D(m.id);if(!p.evo.length)return'최종 진화';return p.evo.map(e=>e.lv?`Lv.${e.lv}에 ${D(e.to).name}로 진화`:`${STONES[e.stone]}로 ${D(e.to).name} 진화 (보유 ${S.items[e.stone]})`).join(' / ')}
const PANELS={
party(){const n=slotsFor(S.maxStage);let h='';
  for(let i=0;i<3;i++){
    if(i>=n){h+=`<div class="card locked"><b>${i+1}번 슬롯</b><span class="sub">스테이지 ${i===1?'2-1':'4-1'}에 도달하면 해금됩니다</span></div>`;continue}
    const m=monBy(S.party[i]);if(!m){h+=`<button class="empty-card" data-act="pickParty" data-slot="${i}">+ ${i+1}번 슬롯에 포켓몬 편성</button>`;continue}
    const p=D(m.id),nd=need(m.lv),rt=getRt(m);
    h+=`<div class="card"><div class="mon-h">${orb(m.id,56)}<div class="grow"><div class="mon-n">${p.name} <small>Lv.${m.lv}</small></div><div><span class="role" style="--rc:${ROLE_MOD[i===0?'melee':'ranged'].col}">${i+1}번 · ${ROLE_MOD[i===0?'melee':'ranged'].n}</span>${p.types.map(chip).join('')}</div>
      <div class="bar"><i style="width:${m.lv>=LV_MAX?100:m.exp/nd*100}%"></i></div><div class="sub">HP ${fmt(Math.max(0,rt.hp))}/${fmt(rt.max)}${rt.down?' · 기절':''} · ${evoHint(m)}</div></div></div>
      <div>${traitChips(m,true)}</div>
      <div class="slots">${[0,1,2,3].map(j=>{const s=skBy(m.skills[j]);
        return s?`<div class="slot"><span class="ord">${j+1}</span><button class="slot-main" data-act="skill" data-uid="${s.uid}">${skLine(s,'',m)}</button>${j>0?`<button class="ico" data-act="skUp" data-m="${m.uid}" data-j="${j}" aria-label="시전 순서 올리기">▲</button>`:'<span style="width:30px;flex:none"></span>'}</div>`
        :`<div class="slot"><span class="ord">${j+1}</span><button class="slot-main empty" data-act="pickSkill" data-m="${m.uid}" data-j="${j}">빈 슬롯 · 눌러서 ${p.types.map(t=>T[t]).join('/')} 스킬 착용</button><span style="width:30px;flex:none"></span></div>`}).join('')}</div>
      <div class="row">${i>0?`<button class="btn sm" data-act="partyUp" data-i="${i}">▲ 앞으로</button>`:''}<button class="btn sm" data-act="mon" data-uid="${m.uid}">능력치·특성</button><button class="btn sm" data-act="pickParty" data-slot="${i}">교체</button>${S.party.length>1?`<button class="btn sm" data-act="unparty" data-uid="${m.uid}">편성 해제</button>`:''}</div></div>`}
  h+=`<p class="sub" style="margin:0">1번은 근거리(${ROLE_MOD.melee.d}), 2·3번은 원거리(${ROLE_MOD.ranged.d})입니다. 적은 근거리를 먼저 노리고, 원거리는 광역 공격을 받거나 근거리가 쓰러졌을 때 맞습니다. 근거리는 적에게 붙어야 공격할 수 있어요. 스킬은 전투 시작 시 1번부터 순서대로, 이후엔 쿨타임대로 자동 시전하고, 스킬이 없으면 박치기(노말 물리)만 씁니다. 전멸하면 이전 스테이지로 돌아가 다시 성장하며 무한 도전합니다.</p>`;
  return h},
skills(){
  const list=S.bag.filter(s=>UI.filter==='all'||s.t===UI.filter).sort((a,b)=>b.g-a.g||a.t.localeCompare(b.t)||b.sc+b.st-a.sc-a.st);
  const selG=UI.sel.length?skBy(UI.sel[0]).g:null;
  return`<div class="card"><div class="row"><h3 class="grow">스킬 가방 <small>${S.bag.length}/${S.bagMax}</small></h3>
    <button class="btn sm${UI.synth?' on':''}" data-act="synthMode">${UI.synth?'합성 취소':'합성'}</button><button class="btn sm" data-act="autoSynth">지금 일괄 합성</button></div>
    <div class="row"><button class="btn sm${S.autoSynth?' on':''}" data-act="toggleAutoSynth">자동 합성 ${S.autoSynth?'ON':'OFF'}</button><span class="sub grow">켜두면 게임 중(오프라인 보상 제외) 같은 등급 미강화 스킬이 ${SYN_N}개 모일 때마다 자동으로 다음 등급으로 합성됩니다.</span></div>
    <div class="row"><select id="sellG" data-act="setSellG" aria-label="판매 기준 등급">${[1,2,3,4,5,6,7,8,9].map(g=>`<option value="${g}" ${S.sellG===g?'selected':''}>${g}등급 이하</option>`).join('')}</select><button class="btn sm warn" data-act="sellLow">전부 판매</button><span class="sub grow">착용·잠금·강화한 스킬은 판매되지 않아요.</span></div>
    <div class="filters"><button class="btn sm${UI.filter==='all'?' on':''}" data-act="filter" data-t="all">전체</button>${TK.map(t=>`<button class="btn sm${UI.filter===t?' on':''}" data-act="filter" data-t="${t}">${T[t]}</button>`).join('')}</div>
    ${UI.synth?`<div class="row"><span class="sub grow">같은 등급 스킬 ${SYN_N}개를 고르면 한 등급 위 스킬 1개(타입 랜덤)가 나옵니다. 착용·잠금 스킬은 고를 수 없고, 재료의 강화 수치는 사라져요. 선택 ${UI.sel.length}/${SYN_N}</span><button class="btn sm pri" data-act="synthGo" ${UI.sel.length===SYN_N?'':'disabled'}>합성하기</button></div>`:''}
    <div class="list">${list.length?list.map(s=>{const eqm=s.eq?monBy(s.eq):null;const tag=eqm?`<span class="eqtag">${D(eqm.id).name}</span>`:s.lock?'<span class="eqtag">잠금</span>':s.isNew?'<span class="eqtag" style="color:var(--bad)">NEW</span>':'';
      if(UI.synth){const bad=s.eq||s.lock||s.g>=10||(selG&&s.g!==selG&&!UI.sel.includes(s.uid));return`<button class="row-btn${UI.sel.includes(s.uid)?' sel':''}${bad?' dim':''}" data-act="synthPick" data-uid="${s.uid}" ${bad?'disabled':''}>${skLine(s,tag)}</button>`}
      return`<button class="row-btn" data-act="skill" data-uid="${s.uid}">${skLine(s,tag)}</button>`}).join(''):'<p class="sub">스킬이 없습니다. 몬스터를 처치하면 일정 확률로 스킬이 떨어집니다.</p>'}</div></div>`},
box(){const caught=Object.keys(S.caught).length;return`<div class="card"><div class="row"><h3 class="grow">보관함 <small>${S.mons.length}/${S.boxMax}</small></h3><span class="sub">도감 ${caught}/151</span></div>
  <p class="sub" style="margin:0">몬스터를 처치하면 아주 낮은 확률로 포획합니다 (일반 0.2%, 보스 2%, 전설 0.5%). 포획 시 개체값과 특성이 무작위로 정해지고, 특성은 1개 89% · 2개 10% · 3개 1%입니다. 노란 테두리가 현재 파티입니다.</p>
  <div class="grid">${S.mons.map(m=>`<button class="mcell${S.party.includes(m.uid)?' inparty':''}" data-act="mon" data-uid="${m.uid}">${orb(m.id,48)}<b>${D(m.id).name}</b><span class="lv">Lv.${m.lv} · 특성 ${m.traits.length}</span></button>`).join('')}</div>
  <div class="sec"><b>진화의 돌</b><div class="row">${Object.entries(STONES).map(([k,n])=>`<span class="sub">${n} ${S.items[k]}</span>`).join(' · ')}</div>
  <p class="sub" style="margin:0">스테이지 2-5부터 아주 드물게(0.06%) 떨어지고, 광산 파밍 중엔 0.8%로 오릅니다 (대신 골드·경험치 절반).</p></div></div>`},
relic(){const w=relicWeights();const tot=w.reduce((a,x)=>a+x,0)||1;
  return`<div class="card"><div class="row"><h3 class="grow">유물</h3><span class="sub">보유 ${relicCount()}/${Object.keys(RELICS).length*RELIC_MAX}</span></div>
  <p class="sub" style="margin:0">골드로 유물 상자를 사서 엽니다. 무작위 유물 하나의 레벨이 1 오르고(최대 10), 파티 전체에 적용됩니다. 상자 가격은 처음 1만 골드이고 살 때마다 1만씩 오릅니다. 한 등급을 전부 모으면 그 등급의 확률은 다음 등급으로 넘어갑니다.</p>
  <div class="odds">${RG_N.map((n,g)=>`<span style="color:${RG_COL[g]}">${n}<br><b>${pct(w[g]/tot*100)}%</b></span>`).join('')}</div>
  <div class="row"><button class="btn pri grow" data-act="relicDraw" ${S.gold>=relicPrice()&&!relicsAllMax()?'':'disabled'}>유물 상자 열기 · ${fmt(relicPrice())}골드</button><button class="btn" data-act="relicDraw" data-n="10" ${S.gold>=relicPrice10()&&!relicsAllMax()?'':'disabled'}>10회 · ${fmt(relicPrice10())}</button></div>
  ${RG_N.map((n,g)=>{const ks=Object.keys(RELICS).filter(k=>RELICS[k].g===g);const have=ks.reduce((a,k)=>a+(S.relics[k]||0),0);
    return`<div class="rgrade"><b style="color:${RG_COL[g]}">${n}</b><span class="sub">${have}/${ks.length*RELIC_MAX}</span></div><div class="grid">${ks.map(k=>{const r=RELICS[k],lv=S.relics[k]||0;
      return`<div class="relic${lv?'':' off'}" style="border-color:${lv?RG_COL[g]:'var(--line)'}"><span class="lvl">Lv.${lv}/${RELIC_MAX}</span><b>${r.n}</b><span class="sub">${r.f(pct(r.per*Math.max(lv,1)))}${lv?'':' (미보유)'}</span></div>`}).join('')}</div>`}).join('')}</div>`},
shop(){const row=(name,desc,price,act,extra,dis)=>`<div class="shop-row"><span class="grow"><b>${name}</b><br><span class="sub">${desc}</span></span><button class="btn sm pri" data-act="${act}" ${extra||''} ${(dis||S.gold<price)?'disabled':''}>${price===Infinity?'최대':fmt(price)+'골드'}</button></div>`;
  const bagFull=S.bagMax>=BAG_CAP,boxFull=S.boxMax>=BOX_CAP;
  return`<div class="card"><div class="row"><h3 class="grow">상점</h3><span class="sub">보유 골드 ${fmt(S.gold)}</span></div>
  <div class="sec-h"><b>확장</b></div>
  ${row('스킬 가방 +5칸',`현재 ${S.bagMax}/${BAG_CAP}칸 · 살 때마다 1만씩 비싸짐`,bagFull?Infinity:shopPrice('bag'),'buyBag','',bagFull)}
  ${row('포켓몬 보관함 +1칸',`현재 ${S.boxMax}/${BOX_CAP}칸 · 살 때마다 1만씩 비싸짐`,boxFull?Infinity:shopPrice('box'),'buyBox','',boxFull)}
  <div class="sec-h"><b>성장</b></div>
  ${row('오프라인 보상 시간 +1시간',`현재 최대 ${offMaxH()}시간 / 24시간 · 살 때마다 10만씩 비싸짐`,offMaxH()>=24?Infinity:offPrice(),'buyOff','',offMaxH()>=24)}
  ${row('유물 상자','무작위 유물 1레벨 · 살 때마다 1만씩 비싸짐',relicPrice(),'relicDraw','',relicsAllMax())}
  ${row('이상한사탕','포켓몬 1마리 레벨 +1 (능력치·특성 화면에서 사용) · 살 때마다 비싸짐',candyPrice(),'buyItem','data-k="candy"')}
  ${row('포켓몬 알','전설을 뺀 1세대 기본형 포켓몬 1마리가 Lv.5로 부화 · 개체값·특성 무작위',eggPrice(),'buyEgg','',S.mons.length>=S.boxMax)}
  ${row('스킬 상자','현재 스테이지 보스 드랍 기준으로 무작위 스킬 1개',skillBoxPrice(),'buySkillBox','',S.bag.length>=S.bagMax)}
  <div class="sec-h"><b>강화 재료</b></div>
  ${row('각성의 구슬','스킬 각성 개방·재설정',cubePrice(),'buyItem','data-k="cube"')}
  ${row('공명의 구슬','스킬 공명 개방·재설정',cubePrice()*4,'buyItem','data-k="acube"')}
  ${row('특성결정','포켓몬 특성 재설정',cubePrice()*2,'buyItem','data-k="capsule"')}
  <div class="sec-h"><b>진화의 돌</b><span class="sub">살 때마다 10만씩 비싸짐</span></div>
  <div class="row">${Object.entries(STONES).map(([k,n])=>`<button class="btn sm" data-act="buyItem" data-k="${k}" ${S.gold>=stonePrice()?'':'disabled'}>${n}</button>`).join('')}<span class="sub">개당 ${fmt(stonePrice())}골드</span></div></div>`},
dex(){const c=Object.keys(S.caught).length,s=Object.keys(S.seen).length;
  return`<div class="card"><div class="row"><h3 class="grow">도감</h3><span class="sub">잡은 포켓몬 ${c} · 본 포켓몬 ${s} / 151</span></div>
  <div class="bar"><i style="width:${c/151*100}%"></i></div>
  <p class="sub" style="margin:0">한 번이라도 손에 넣은 포켓몬은 색이 보이고, 만나기만 한 포켓몬은 그림자로 보입니다. 눌러서 정보를 볼 수 있어요.</p>
  <div class="dex">${DEX.map(p=>{const st=S.caught[p.id]?'caught':S.seen[p.id]?'seen':'unseen';
    return`<button class="dcell ${st}" data-act="dexInfo" data-id="${p.id}" ${st==='unseen'?'disabled':''}><span class="dno">No.${String(p.id).padStart(3,'0')}</span>${st==='unseen'?'<div class="qorb">?</div>':orb(p.id,40)}<span class="dnm">${st==='unseen'?'???':p.name}</span></button>`}).join('')}</div></div>`},
friend(){const code=myCode();
  return`<div class="card"><h3>내 친구 코드</h3><p class="sub" style="margin:0">이 코드를 친구에게 보내면 친구가 내 파티(최대 3마리)와 배틀할 수 있어요. 파티나 스킬을 바꾸면 코드도 바뀌니 다시 보내 주세요.</p>
  <textarea id="myCode" class="code" rows="3" readonly>${code}</textarea><div class="row"><button class="btn pri" data-act="copyCode">코드 복사</button></div></div>
  <div class="card"><h3>친구 추가 · 갱신</h3><textarea id="addCode" class="code" rows="3" placeholder="친구에게 받은 코드를 붙여넣으세요"></textarea>
  <div class="row"><button class="btn pri" data-act="addFriend">추가</button><span class="sub grow">이미 있는 친구의 새 코드를 넣으면 팀 정보가 갱신됩니다.</span></div></div>
  <div class="card"><div class="row"><h3 class="grow">친구 목록</h3><span class="sub">${S.friends.length}명 · 전적 ${S.pvp.w}승 ${S.pvp.l}패</span></div>
  ${S.friends.length?S.friends.map((f,i)=>`<div class="shop-row"><span class="grow"><b>${esc(f.name)}</b> <small>뱃지 ${f.badges} · 최고 ${stageLabel(f.max)}</small><br><span class="sub">${f.team.map(u=>`${D(u.i).name} Lv.${u.l}`).join(' · ')}<br>전적 ${f.w||0}승 ${f.l||0}패</span></span>
    <div style="display:flex;flex-direction:column;gap:4px"><button class="btn sm pri" data-act="pvp" data-i="${i}">3대3 배틀</button><button class="btn sm" disabled>보스레이드 (준비 중)</button><button class="btn sm warn" data-act="delFriendAsk" data-i="${i}">삭제</button></div></div>`).join(''):'<p class="sub" style="margin:0">아직 친구가 없어요. 친구에게 코드를 받아 추가해 보세요.</p>'}</div>`},
trainer(){const nb=S.badges.filter(Boolean).length;
  return`<div class="card"><div class="row"><h3 class="grow">${esc(S.name)} <small>트레이너</small></h3><button class="btn sm" data-act="renameAsk">이름 변경</button></div>
  <dl class="kv"><dt>최고 스테이지</dt><dd>${stageLabel(S.maxStage)}</dd><dt>도감</dt><dd>잡음 ${Object.keys(S.caught).length} · 봄 ${Object.keys(S.seen).length} / 151</dd><dt>친구 배틀</dt><dd>${S.pvp.w}승 ${S.pvp.l}패</dd><dt>뱃지</dt><dd>${nb}/10</dd></dl>
  <div class="sec"><b>뱃지 케이스</b><div class="badges">${GYMS.map((g,i)=>`<div class="badge ${S.badges[i]?'on':'off'}"><i style="--bc:${g.col}">${S.badges[i]?i+1:'?'}</i>${g.badge}</div>`).join('')}</div>
  <p class="sub" style="margin:0">각 지역 마지막 스테이지(1-10, 2-10 …)에서 체육관 관장과 싸워 이기면 뱃지를 얻습니다. 9-10은 사천왕, 10-10은 챔피언입니다.</p></div></div>
  <div class="card"><h3>기록</h3><div class="log">${S.log.map(l=>`<div>${new Date(l.t).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})} · ${l.m}</div>`).join('')||'<div>아직 기록이 없습니다.</div>'}</div></div>
  <div class="card"><h3>설정</h3><p class="sub" style="margin:0">게임 버전 ${GAME_VERSION}. 진행 상황은 5초마다 이 기기에 자동 저장되고, 새 버전이 올라오면 저장 후 자동으로 업데이트됩니다. 포켓몬 이미지는 PokeAPI에서 불러옵니다.</p><div class="row"><button class="btn warn" data-act="resetAsk">진행 초기화</button></div></div>`}
};
function renderPanel(){if(!S)return;$('#panel').innerHTML=PANELS[UI.tab]();document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.t===UI.tab));UI.dirty=false}

/* ================= 모달 ================= */
function openModal(fn,...args){if(fn==='mon'&&(!UI.modal||UI.modal.fn!=='mon'||UI.modal.args[0]!==args[0]))UI.tlocks=[false,false,false];UI.modal={fn,args};renderModal()}
function renderModal(){if(!UI.modal)return;const html=MODALS[UI.modal.fn](...UI.modal.args);if(html===null){closeModal();return}
  const sh=$('#sheet');const top=sh.scrollTop;const vals={};sh.querySelectorAll('input[id],select[id]').forEach(el=>{if(el.type!=='checkbox')vals[el.id]=el.value});
  sh.innerHTML=html;sh.scrollTop=top;for(const id in vals){const el=document.getElementById(id);if(el&&el.type!=='password')el.value=vals[id]}$('#modal').hidden=false}
function closeModal(){if(UI.pvpTimer){clearInterval(UI.pvpTimer);UI.pvpTimer=null}UI.modal=null;$('#modal').hidden=true;renderPanel()}
const head=(t,pre)=>`<div class="sheet-h">${pre||''}<h2>${t}</h2><button class="x" data-act="close" aria-label="닫기">✕</button></div>`;
const MODALS={
skill(uid){const s=skBy(uid);if(!s)return null;const mv=MV(s),a=augs(s),eqm=s.eq?monBy(s.eq):null;s.isNew=false;
  const potBlock=(key,label,item)=>{const p=s[key];const have=S.items[item];const nm=ITEM_N[item];
    return`<div class="sec"><div class="sec-h"><b>${label}</b>${p?`<span class="tier" style="color:${TIER_COL[p.tier]}">${TIER_N[p.tier]}</span>`:'<span class="sub">미개방</span>'}</div>
    ${p?`<div class="lines">${p.lines.map(k=>`<div>${AUG[k].n}: ${AUG[k].d(AUG[k].v[p.tier])}</div>`).join('')}</div>`:`<p class="sub" style="margin:0">${key==='pot'?'각성의 구슬로 개방하면 스킬의 성질이 바뀌는 옵션 2줄이 붙습니다.':'각성과 별도로 옵션 1줄이 추가로 붙습니다.'}</p>`}
    <div class="row"><button class="btn sm pri" data-act="cube" data-k="${key}" data-uid="${s.uid}" ${have?'':'disabled'}>${p?'재설정':'개방'} (${nm} · 보유 ${have})</button><button class="btn sm" data-act="buyCube" data-k="${item}" ${S.gold>=cubePrice()*(item==='acube'?4:1)?'':'disabled'}>구슬 구매 ${fmt(cubePrice()*(item==='acube'?4:1))}골드</button></div></div>`};
  return head(`${mv.name}${s.sc?` +${s.sc}`:''}`,`<span class="g${s.g===10?' g10':''}" style="--gc:${GRADE_COL[s.g]};height:30px;min-width:34px;font-size:18px">${s.g}</span>`)+
  `<div class="row">${chip(s.t)}<span class="sub">${s.g}등급 · ${mv.pow?(mv.cat==='p'?'물리':'특수')+' · ':''}${KIND[mv.kind]}${mv.hits>1?` ${mv.hits}회`:''} · ${T[s.t]} 타입 포켓몬만 착용 가능${eqm?` · <b style="color:var(--accent)">${D(eqm.id).name} 착용 중</b>`:''}</span></div>
  <dl class="kv"><dt>${mv.pow?'위력':'효과'}</dt><dd>${mv.pow?`${mv.cat==='p'?'공격':'특수공격'}의 ${Math.round(mv.pow*gradeMul(s.g)*(1+0.1*s.sc)*100)}%${mv.hits>1?` × ${mv.hits}회`:''}`:`8초간 ${15+3*s.g+(a.dmg||0)/2}%`}</dd>
  <dt>쿨타임</dt><dd>${mv.cd}초 → ${skCd(s).toFixed(1)}초</dd>${a.aoe&&mv.kind!=='aoe'&&mv.pow?`<dt>각성</dt><dd>광역기로 변화 (${a.aoe}% 위력)</dd>`:''}</dl>
  <div class="sec"><div class="sec-h"><b>주문서 강화 <small>데미지</small></b><span class="sub">+${s.sc}/15 · 데미지 +${s.sc*10}%</span></div>
   ${s.sc>=15?'<p class="sub" style="margin:0">최대치입니다.</p>':`<div class="row"><span class="sub grow">성공 ${scrollRate(s)}% · 성공 시 데미지 +10% · 실패해도 하락 없음</span><button class="btn sm pri" data-act="scroll" data-uid="${s.uid}" ${S.gold>=scrollCost(s)?'':'disabled'}>${fmt(scrollCost(s))}골드</button></div>`}</div>
  <div class="sec"><div class="sec-h"><b>숙련 <small>쿨타임</small></b><span class="sub">◆${s.st}/10 · 쿨타임 -${s.st*6}%</span></div>
   ${s.st>=10?'<p class="sub" style="margin:0">최대치입니다.</p>':`<div class="row"><span class="sub grow">성공 ${starRate(s)}% · 성공 시 쿨타임 -6%${s.st>=5?' · 실패 시 30% 확률로 ◆ 하락':''}</span><button class="btn sm pri" data-act="star" data-uid="${s.uid}" ${S.gold>=starCost(s)?'':'disabled'}>${fmt(starCost(s))}골드</button></div>`}</div>
  ${potBlock('pot','각성 (스킬 증강)','cube')}${potBlock('add','공명 (추가 옵션)','acube')}
  <div class="row" style="border-top:1px solid var(--line);padding-top:10px">${eqm?`<button class="btn sm" data-act="unequip" data-uid="${s.uid}">착용 해제</button>`:''}<button class="btn sm" data-act="lock" data-uid="${s.uid}">${s.lock?'잠금 해제':'잠금'}</button>${!eqm&&!s.lock?`<button class="btn sm warn" data-act="sellSkill" data-uid="${s.uid}">판매 ${fmt(skillSellPrice(s))}골드</button>`:''}${UI.admin?`<button class="btn sm adm" data-act="admMaxSkill" data-uid="${s.uid}">관리자: 최대 강화</button>`:''}</div>`},
pickSkill(mu,j){const m=monBy(mu);if(!m)return null;const p=D(m.id);const list=S.bag.filter(s=>canEquip(s,m)&&!m.skills.includes(s.uid)).sort((a,b)=>b.g-a.g||b.sc+b.st-a.sc-a.st);
  const st=monStats(m);
  return head(`${p.name} · ${j+1}번 슬롯`)+`<p class="sub" style="margin:0">${p.types.map(t=>T[t]).join('/')} 타입 스킬만 착용할 수 있어요. 이 포켓몬은 공격 ${st.atk} / 특수공격 ${st.spa}라 ${st.atk>=st.spa?'물리':'특수'} 기술이 더 잘 맞습니다.</p>
  <div class="list">${list.length?list.map(s=>{const o=s.eq?monBy(s.eq):null;return`<button class="row-btn" data-act="equip" data-uid="${s.uid}" data-m="${mu}" data-j="${j}">${skLine(s,o?`<span class="eqtag">${D(o.id).name}에서 이동</span>`:'',m)}</button>`}).join('')
   :`<p class="sub">착용 가능한 스킬이 없어요. 같은 타입의 몬스터를 잡으면 해당 타입 스킬이 잘 떨어집니다.</p>`}</div>`},
pickParty(slot){const list=S.mons.filter(m=>!S.party.includes(m.uid));
  return head(`${slot+1}번 슬롯 편성`)+`<div class="grid">${list.length?list.map(m=>`<button class="mcell" data-act="pset" data-slot="${slot}" data-uid="${m.uid}">${orb(m.id,48)}<b>${D(m.id).name}</b><span class="lv">Lv.${m.lv} · ${m.traits.map(k=>TRAITS[k].n).join('·')}</span></button>`).join(''):'<p class="sub">편성할 수 있는 포켓몬이 없어요. 몬스터를 잡아 보관함을 채워보세요.</p>'}</div>`},
mon(uid){const m=monBy(uid);if(!m)return null;const p=D(m.id),inP=S.party.includes(uid);const stones=p.evo.filter(e=>e.stone);const st=monStats(m);
  const maxBase=Math.max(...p.base);const ivSum=m.iv.reduce((a,x)=>a+x,0);const avgG=ivGrade(Math.round(ivSum/6));
  const locks=UI.tlocks.slice(0,m.traits.length);const cost=1+locks.filter(Boolean).length;const canRe=S.items.capsule>=cost&&locks.some(x=>!x);
  return head(`${p.name} <small>Lv.${m.lv}</small>`,orb(m.id,60))+`<div>${p.types.map(chip).join('')}<span class="sub"> 종족값 합계 ${p.bst} · ${evoHint(m)}</span></div>
  <div style="overflow-x:auto"><table class="stats"><thead><tr><th>능력치</th><th>종족값</th><th>개체값</th><th>실수치</th></tr></thead><tbody>
  ${STAT_K.map((k,i)=>{const g=ivGrade(m.iv[i]);return`<tr><td>${STAT_N[k]}</td><td><span class="sbar" style="width:${Math.round(p.base[i]/Math.max(150,maxBase)*60)}px;--sc:${TC[p.types[0]]}"></span>${p.base[i]}</td><td>${m.iv[i]} <span class="ivg${g==='SS'?' ss':''}" style="--ivc:${IVG_COL[g]}">${g}</span></td><td><b>${i===0?fmt(st.hp*HP_MUL):st[k]}</b></td></tr>`}).join('')}
  <tr><td>합계</td><td>${p.bst}</td><td>${ivSum} <span class="ivg${avgG==='SS'?' ss':''}" style="--ivc:${IVG_COL[avgG]}">${avgG}</span></td><td></td></tr></tbody></table></div>
  ${roleOf(m)?`<p class="sub" style="margin:0"><span class="role" style="--rc:${ROLE_MOD[roleOf(m)].col}">${ROLE_MOD[roleOf(m)].n}</span> 파티 역할 보정: ${ROLE_MOD[roleOf(m)].d}. 표의 실수치는 보정 전 값입니다.</p>`:''}
  <p class="sub" style="margin:0">개체값 1~20 D · 21~40 C · 41~60 B · 61~80 A · 81~99 S · 100 SS. 개체값은 포획 시 정해지며 바뀌지 않습니다. 게임 내 HP는 실수치의 ${HP_MUL}배입니다.</p>
  <div class="sec"><div class="sec-h"><b>특성 ${m.traits.length}/3</b><span class="sub">특성결정 보유 ${S.items.capsule}</span></div>
  ${m.traits.map((k,i)=>{const t=TRAITS[k];return`<label class="trait-line"><span class="grow"><b style="color:${TG_COL[t.g]}">${t.n}</b> <span class="tier" style="color:${TG_COL[t.g]}">${TG_N[t.g]}</span><br><span class="sub">${t.d}</span></span>${m.traits.length>1?`<input type="checkbox" id="tl${uid}-${i}" data-act="tlock" data-i="${i}" ${UI.tlocks[i]?'checked':''} aria-label="${t.n} 잠금">`:''}</label>`}).join('')}
  <div class="row"><button class="btn sm pri" data-act="treroll" data-uid="${uid}" ${canRe?'':'disabled'}>특성 재설정 (특성결정 ${cost}개)</button><span class="sub grow">특성 개수는 그대로, 등급은 노말 60% · 희귀 28% · 에픽 10% · 레전드리 2%. 잠근 특성은 유지되고 특성결정이 1개씩 더 듭니다.</span></div></div>
  <div class="row"><button class="btn sm" data-act="useCandy" data-uid="${uid}" ${S.items.candy&&m.lv<LV_MAX?'':'disabled'}>이상한사탕 사용 (보유 ${S.items.candy})</button><button class="btn sm" data-act="useCandy" data-uid="${uid}" data-all="1" ${S.items.candy&&m.lv<LV_MAX?'':'disabled'}>최대한 사용</button></div>
  ${stones.length?`<div class="row">${stones.map(e=>`<button class="btn sm pri" data-act="stoneEvo" data-uid="${uid}" data-to="${e.to}" data-k="${e.stone}" ${S.items[e.stone]?'':'disabled'}>${STONES[e.stone]} 사용 → ${D(e.to).name}</button>`).join('')}</div>`:''}
  <div class="sec"><b>착용 스킬</b><div class="list">${m.skills.map((u,j)=>{const s=skBy(u);return s?`<button class="row-btn" data-act="skill" data-uid="${s.uid}">${skLine(s,'',m)}</button>`:`<div class="sub">${j+1}번 슬롯 비어 있음</div>`}).join('')}</div></div>
  <div class="row">${!inP&&S.party.length<slotsFor(S.maxStage)?`<button class="btn sm pri" data-act="pset" data-slot="${S.party.length}" data-uid="${uid}">파티에 편성</button>`:''}${inP&&S.party.length>1?`<button class="btn sm" data-act="unparty" data-uid="${uid}">편성 해제</button>`:''}
  ${!inP?`<button class="btn sm warn" data-act="sellMonAsk" data-uid="${uid}">판매 ${fmt(monSellPrice(m))}골드</button>`:''}</div>
  ${UI.admin?`<div class="adm-sec"><b>관리자</b><div class="row"><button class="btn sm adm" data-act="admMonLv" data-uid="${uid}" data-v="10">+10레벨</button><button class="btn sm adm" data-act="admMonLv" data-uid="${uid}" data-v="99">Lv.99</button><button class="btn sm adm" data-act="admMonIv" data-uid="${uid}">개체값 전부 100</button><button class="btn sm adm" data-act="admMonIvRe" data-uid="${uid}">개체값 다시 뽑기</button><button class="btn sm adm" data-act="admMonTraits" data-uid="${uid}">특성 3칸 개방</button><button class="btn sm adm" data-act="admMonLegend" data-uid="${uid}">특성 전부 레전드리</button></div>
  <div class="row"><select id="admTraitPick" aria-label="특성 선택">${Object.entries(TRAITS).sort((a,b)=>b[1].g-a[1].g).map(([k,t])=>`<option value="${k}">[${TG_N[t.g]}] ${t.n}</option>`).join('')}</select><select id="admTraitSlot" aria-label="특성 칸">${[0,1,2].map(i=>`<option value="${i}">${i+1}번 칸</option>`).join('')}</select><button class="btn sm adm" data-act="admMonSetTrait" data-uid="${uid}">특성 지정</button></div></div>`:''}`},
inv(){const desc={cube:'스킬 각성 개방·재설정 (스킬 화면)',acube:'스킬 공명 개방·재설정 (스킬 화면)',capsule:'포켓몬 특성 재설정 (능력치·특성 화면)',candy:'포켓몬 레벨 +1 (능력치·특성 화면)',t:'피카츄·이브이 진화',f:'식스테일·가디·이브이 진화',w:'슈륙챙이·셀러·별가사리·이브이 진화',l:'냄새꼬·우츠동·아라리 진화',m:'니드리나·니드리노·삐삐·푸린 진화'};
  return head('인벤토리')+`<div class="inv-row" style="border-top:0;padding-top:0"><span class="grow"><b>골드</b><br><span class="sub">상점·강화·유물 상자에 사용</span></span><span class="cnt">${fmt(S.gold)}</span></div>
  ${Object.entries(ITEM_N).map(([k,n])=>`<div class="inv-row"><span class="grow"><b>${n}</b><br><span class="sub">${desc[k]||''}</span></span><span class="cnt">${fmt(S.items[k]||0)}</span></div>`).join('')}
  <div class="row"><button class="btn pri" data-act="tabGo" data-t="shop">상점으로</button><button class="btn" data-act="close">닫기</button></div>`},
traitInfo(k){const t=TRAITS[k];return head(t.n)+`<p><span class="tier" style="color:${TG_COL[t.g]}">${TG_N[t.g]} 특성</span></p><p>${t.d}</p><button class="btn pri" data-act="close">확인</button>`},
sellMon(uid){const m=monBy(uid);if(!m)return null;return head('포켓몬 판매')+`<p>${D(m.id).name} (Lv.${m.lv}, 특성 ${m.traits.map(k=>TRAITS[k].n).join('·')})를 ${fmt(monSellPrice(m))}골드에 판매할까요? 착용한 스킬은 가방으로 돌아갑니다. 되돌릴 수 없어요.</p><div class="row"><button class="btn warn" data-act="sellMonGo" data-uid="${uid}">판매</button><button class="btn" data-act="close">취소</button></div>`},
reset(){return head('진행 초기화')+`<p>모든 포켓몬, 스킬, 재화가 사라지고 스타팅 선택부터 다시 시작합니다. 되돌릴 수 없어요.</p><div class="row"><button class="btn warn" data-act="resetGo">초기화</button><button class="btn" data-act="close">취소</button></div>`},
offline(r){return head('다녀오셨군요!')+`<p class="sub" style="margin:0">자리를 비운 ${r.time} 동안 포켓몬들이 계속 싸웠어요. (최대 ${offMaxH()}시간 · 온라인 효율의 ${Math.round(r.eff*100)}%)</p>
  <dl class="kv"><dt>골드</dt><dd>+${fmt(r.gold)}</dd><dt>경험치</dt><dd>파티 각 +${fmt(r.xp)}</dd><dt>스킬북</dt><dd>${r.skills}개</dd><dt>특성결정</dt><dd>${r.caps}개</dd><dt>포획</dt><dd>${r.mons.length?r.mons.join(', '):'없음'}</dd></dl><button class="btn pri" data-act="close">받기</button>`},
dexInfo(id){const p=D(id);const caught=!!S.caught[id];const where=REGIONS.map((r,i)=>r.pool.includes(id)||r.leg===id||(GYMS[i].team!=='rival'&&GYMS[i].team.includes(id))?r.name:null).filter(Boolean);
  let first=p;while(first.prev)first=D(first.prev);const chain=[];const walk=q=>{chain.push(q);q.evo.forEach(e=>walk(D(e.to)))};walk(first);
  return head(`No.${String(id).padStart(3,'0')} ${caught||S.seen[id]?p.name:'???'}`,orb(id,56))+`<div>${p.types.map(chip).join('')}<span class="sub"> ${caught?'잡은 적 있음':'만난 적만 있음'}</span></div>
  <div style="overflow-x:auto"><table class="stats"><thead><tr><th>종족값</th><th></th></tr></thead><tbody>${STAT_K.map((k,i)=>`<tr><td>${STAT_N[k]}</td><td><span class="sbar" style="width:${Math.round(p.base[i]/160*110)}px;--sc:${TC[p.types[0]]}"></span>${p.base[i]}</td></tr>`).join('')}<tr><td>합계</td><td>${p.bst}</td></tr></tbody></table></div>
  <dl class="kv"><dt>진화</dt><dd>${chain.length>1?chain.map(q=>S.caught[q.id]||S.seen[q.id]?q.name:'???').join(' → '):'진화하지 않음'}</dd><dt>출현</dt><dd>${where.length?where.join(', '):'상점의 포켓몬 알 등'}</dd></dl>`},
pvp(i){const f=S.friends[i];if(!f)return null;
  return head(`${esc(S.name)} vs ${esc(f.name)}`)+`<div class="pvp-team" id="pvpB">${f.team.map((u,j)=>`<div class="pvp-u" id="pvB${j}">${orb(u.i,44)}<span>${D(u.i).name} Lv.${u.l}</span><div class="hp"><i></i></div></div>`).join('')}</div>
  <div class="pvp-vs" id="pvpRes">VS</div>
  <div class="pvp-team" id="pvpA">${myTeam().map((u,j)=>`<div class="pvp-u" id="pvA${j}">${orb(u.i,44,true)}<span>${D(u.i).name} Lv.${u.l}</span><div class="hp"><i></i></div></div>`).join('')}</div>
  <div class="pvp-log" id="pvpLog"></div><div class="row"><button class="btn" data-act="pvpSkip" id="pvpSkipBtn">결과 바로 보기</button><button class="btn" data-act="close">닫기</button></div>`},
rename(){return head('트레이너 이름 변경')+`<input id="newName" class="name-in" maxlength="10" value="${esc(S.name)}" aria-label="새 이름"><div class="row"><button class="btn pri" data-act="renameGo">저장</button><button class="btn" data-act="close">취소</button></div>`},
delFriend(i){const f=S.friends[i];if(!f)return null;return head('친구 삭제')+`<p>${esc(f.name)}님을 친구 목록에서 삭제할까요?</p><div class="row"><button class="btn warn" data-act="delFriendGo" data-i="${i}">삭제</button><button class="btn" data-act="close">취소</button></div>`},
result(r){return head(r.title)+`<p>${r.body}</p><button class="btn pri" data-act="close">확인</button>`},
adminLogin(err){return head('관리자 로그인')+`<p class="sub" style="margin:0">관리자 암호를 입력하세요.</p>
  <div class="row"><input type="password" id="admPw" inputmode="numeric" autocomplete="off" placeholder="암호" class="grow" aria-label="관리자 암호"><button class="btn pri" data-act="adminLogin">확인</button></div>
  ${err?'<p class="sub" style="margin:0;color:var(--bad)">암호가 틀렸습니다.</p>':''}`},
admin(){const it=Object.entries(ITEM_N);
  return head('<span class="adm-h">관리자 메뉴</span>')+`<p class="sub" style="margin:0">테스트용 메뉴입니다. 이 화면을 닫아도 앱을 다시 켜기 전까지 관리자 상태가 유지됩니다.</p>
  <div class="adm-sec"><b>재화</b>
   <div class="row"><button class="btn sm adm" data-act="admGold" data-v="1e4">골드 +1만</button><button class="btn sm adm" data-act="admGold" data-v="1e6">+100만</button><button class="btn sm adm" data-act="admGold" data-v="1e8">+1억</button><button class="btn sm adm" data-act="admGold" data-v="1e12">+1조</button><button class="btn sm adm" data-act="admGold" data-v="0">골드 0으로</button></div>

/* ================= 친구 코드 ================= */
function myTeam(){return partyMons().slice(0,3).map(m=>({i:m.id,l:m.lv,v:m.iv.slice(),t:m.traits.slice(),s:m.skills.map(skBy).filter(Boolean).map(s=>[s.t,s.m,s.g,s.sc,s.st,s.pot?[s.pot.tier,s.pot.lines]:0,s.add?[s.add.tier,s.add.lines]:0])}))}
function myCode(){const o={v:1,id:S.pid,n:S.name,b:S.badges.filter(Boolean).length,x:S.maxStage,p:myTeam()};return'PKS1.'+btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function parseCode(c){c=(c||'').replace(/\s/g,'');if(!c.startsWith('PKS1.'))throw new Error('코드 형식이 아니에요');
  const o=JSON.parse(decodeURIComponent(escape(atob(c.slice(5)))));const int=(v,a,b)=>Number.isInteger(v)&&v>=a&&v<=b;
  if(typeof o.id!=='string'||o.id.length>16||typeof o.n!=='string'||!Array.isArray(o.p)||o.p.length<1||o.p.length>3)throw new Error('코드가 손상됐어요');
  const team=o.p.map(u=>{if(!int(u.i,1,151)||!int(u.l,1,99)||!Array.isArray(u.v)||u.v.length!==6||!u.v.every(x=>int(x,1,100)))throw new Error('포켓몬 정보가 잘못됐어요');
    const t=(Array.isArray(u.t)?u.t:[]).filter(k=>TRAITS[k]).slice(0,3);if(!t.length)t.push('keeneye');
    const okPot=x=>x===0||(Array.isArray(x)&&int(x[0],0,3)&&Array.isArray(x[1])&&x[1].length<=2&&x[1].every(k=>AUG[k]));
    const s=(Array.isArray(u.s)?u.s:[]).slice(0,4).filter(a=>Array.isArray(a)&&MOVES[a[0]]&&int(a[1],0,MOVES[a[0]].length-1)&&int(a[2],1,10)&&int(a[3],0,15)&&int(a[4],0,10)&&okPot(a[5])&&okPot(a[6])&&D(u.i).types.includes(a[0]));
    return{i:u.i,l:u.l,v:u.v,t,s}});
  return{id:o.id,name:o.n.slice(0,10)||'트레이너',badges:int(o.b,0,10)?o.b:0,max:int(o.x,1,9999)?o.x:1,team}}

/* ================= 3대3 배틀 엔진 ================= */
function pvpRun(teamA,teamB){
  const mk=(u,side,idx)=>{const p=D(u.i);const st={};STAT_K.forEach((k,i)=>st[k]=calcStat(p.base[i],u.v[i],u.l,i===0));const rm=ROLE_MOD[idx===0?'melee':'ranged'];st.hp*=rm.hp;st.atk*=rm.atk;st.spa*=rm.atk;st.def*=rm.def;st.spd*=rm.def;st.spe*=rm.spe;const mx=st.hp*HP_MUL;
    return{side,idx,role:idx===0?'melee':'ranged',id:u.i,name:p.name,lv:u.l,types:p.types,st,traits:u.t,hp:mx,max:mx,down:false,cd:[0,0,0,0],gap:0,basic:0.3+Math.random()*0.4,dots:[],para:0,seal:0,moxie:0,
      skills:u.s.map(a=>({t:a[0],m:a[1],g:a[2],sc:a[3],st:a[4],pot:a[5]?{tier:a[5][0],lines:a[5][1]}:null,add:a[6]?{tier:a[6][0],lines:a[6][1]}:null}))}};
  const sides=[teamA.map((u,i)=>mk(u,0,i)),teamB.map((u,i)=>mk(u,1,i))];const SD=[{buff:0,bv:0,vuln:0,vv:0},{buff:0,bv:0,vuln:0,vv:0}];
  let t=0;const logs=[],frames=[];const L=s=>{if(logs.length<400)logs.push(s)};const has=(u,k)=>u.traits.includes(k);
  const alive=s=>sides[s].filter(u=>!u.down);
  const pickT=s=>{const al=alive(s);if(!al.length)return null;const mel=al.find(u=>u.role==='melee');if(mel)return mel;const w=[0.5,0.3,0.2];let sum=0;al.forEach((u,i)=>sum+=w[i]);let r=Math.random()*sum;for(let i=0;i<al.length;i++){r-=w[i];if(r<=0)return al[i]}return al[0]};
  const faint=(u,by)=>{if(!u.down&&u.hp<=0){u.down=true;u.hp=0;L(`${u.side?'상대':'내'} ${u.name} 쓰러짐!`);if(by&&has(by,'moxie'))by.moxie=Math.min(5,by.moxie+1)}};
  function dmg(a,d,type,pow,cat,mul,o){if(d.down)return;const mb=has(a,'moldbreaker');
    if(has(a,'hustle')&&cat==='p'&&Math.random()<0.15)return;
    if(!mb){const ab=d.traits.find(k=>ABSORB[k]===type);if(ab){L(`${d.name}의 ${TRAITS[ab].n}! 효과가 없다`);return}}
    const ef=eff(type,d.types);if(ef===0)return;
    let A=cat==='p'?a.st.atk:a.st.spa;if(cat==='p'&&has(a,'hugepower'))A*=2;if(cat==='p'&&has(a,'hustle'))A*=1.4;if(has(a,'guts')&&a.hp<a.max*0.5)A*=1.4;if(a.moxie)A*=1+0.06*a.moxie;
    if(t<SD[a.side].buff)A*=1+SD[a.side].bv;if(!mb&&alive(d.side).some(u=>has(u,'intimidate')))A*=0.8;
    let Df=cat==='p'?d.st.def:d.st.spd;if(has(a,'unaware'))Df*=0.5;
    let x=pow*A*Math.sqrt(A/Math.max(1,Df))*0.6*mul;
    if(a.types.includes(type)||has(a,'protean'))x*=has(a,'adaptability')?2:1.5;
    x*=ef;if(ef<1&&has(a,'tintedlens'))x*=2;if((a.role==='melee'&&cat==='p')||(a.role==='ranged'&&cat==='s'))x*=1.15;
    for(const k of a.traits){const tr=TRAITS[k];if(tr.boost&&tr.boost[type])x*=1+tr.boost[type]/100;if(tr.pinch===type)x*=a.hp<=a.max/3?1.3:1.1}
    if(has(a,'compoundeyes'))x*=1.08;if(has(a,'technician')&&pow<=2)x*=1.5;
    if(!mb){if(has(d,'thickfat')&&(type==='F'||type==='I'))x*=0.5;if(has(d,'multiscale')&&d.hp>=d.max)x*=0.5;if(has(d,'solidrock')&&ef>1)x*=0.65;if(has(d,'wonderguard')&&ef<=1)x*=0.4;if(has(d,'magicguard'))x*=0.9}
    if(t<SD[d.side].vuln)x*=1+SD[d.side].vv;if(o.exec&&d.hp<d.max*0.3)x*=1+o.exec/100;
    const cr=Math.random()<(5+(has(a,'keeneye')?5:0)+(has(a,'superluck')?12:0)+(o.crit||0))/100;if(cr)x*=has(a,'sniper')?3:2;
    if(!mb&&has(d,'sturdy')&&d.hp>=d.max&&x>=d.hp){x=d.hp-1;L(`${d.name}은(는) 옹골참으로 버텼다!`)}
    d.hp-=x;if(ef>1&&pow>0.8)L(`효과가 굉장했다! (${d.name})`);
    if(o.dot&&!has(a,'sheerforce'))d.dots.push({until:t+5,dps:x*o.dot/100*(has(a,'serenegrace')?2:1)});
    const sg=has(d,'serenegrace')?2:1;
    if(has(d,'roughskin'))a.hp-=x*0.15;
    if(has(d,'static')&&Math.random()<0.2*sg)a.para=t+3;
    if(has(d,'flamebody')&&Math.random()<0.2*sg)a.dots.push({until:t+5,dps:d.st.spa*0.35});
    if(has(d,'poisonpoint')&&Math.random()<0.2*sg)a.dots.push({until:t+5,dps:d.st.atk*0.35});
    if(has(d,'cursedbody')&&Math.random()<0.3*sg)a.seal=t+3;
    faint(d,a);faint(a,d)}
  function castP(u,s,i){const mv=MV(s),a=augs(s),foe=1-u.side;L(`${u.side?'상대':'내'} ${u.name}의 ${mv.name}!`);
    if(mv.kind==='buff'){SD[u.side].buff=t+8;SD[u.side].bv=(15+3*s.g+(a.dmg||0)/2)/100}
    else if(mv.kind==='debuff'){SD[foe].vuln=t+8;SD[foe].vv=(15+3*s.g+(a.dmg||0)/2)/100}
    else{let tg,pm=1;if(mv.kind==='aoe'){tg=alive(foe);if(a.aoe)pm=1+a.aoe*0.004}else if(a.aoe){tg=alive(foe);pm=a.aoe/100}else{const x=pickT(foe);tg=x?[x]:[]}
      let mul=gradeMul(s.g)*(1+0.1*s.sc)*(1+(a.dmg||0)/100)*pm;if(has(u,'sheerforce'))mul*=1.3;if(has(u,'reckless'))mul*=1.35;
      const hits=mv.hits+(mv.kind==='multi'&&has(u,'skilllink')?2:0);const o={crit:a.crit||0,exec:a.exec||0,dot:a.dot||0};
      for(let k=0;k<hits;k++)tg.forEach(d=>dmg(u,d,s.t,mv.pow,mv.cat,mul,o));if(a.multi)tg.forEach(d=>dmg(u,d,s.t,mv.pow,mv.cat,mul*a.multi/100,{...o,dot:0}));
      if(has(u,'reckless')&&!has(u,'magicguard')){u.hp-=u.max*0.04;faint(u,null)}}
    const rc=(a.reset||0)*(has(u,'serenegrace')?2:1);u.cd[i]=rc&&Math.random()<rc/100?0:MV(s).cd*Math.max(0.4,1-0.06*s.st);u.gap=has(u,'earlybird')&&t<6?0.4:0.8}
  const snap=()=>frames.push({t,hp:sides.map(s=>s.map(u=>Math.max(0,u.hp/u.max))),l:logs.length});
  snap();let nextF=0.5;const dt=0.1;
  while(t<90&&alive(0).length&&alive(1).length){t+=dt;
    for(const u of[...sides[0],...sides[1]]){if(u.down)continue;u.dots=u.dots.filter(x=>x.until>t);for(const x of u.dots)u.hp-=x.dps*dt;faint(u,null);if(u.down)continue;
      u.gap-=dt;u.basic-=dt;for(let i=0;i<4;i++)u.cd[i]-=dt;if(t<u.seal)continue;const foe=1-u.side;if(!alive(foe).length)break;
      if(u.gap<=0)for(let i=0;i<u.skills.length;i++){if(u.cd[i]<=0){castP(u,u.skills[i],i);break}}
      if(u.down)continue;
      if(u.basic<=0){u.basic=interval(u.st.spe,u.lv)*(t<u.para?2:1)/(has(u,'speedboost')?1+Math.min(0.5,Math.floor(t/5)*0.1):1);const tg=pickT(foe);if(tg)dmg(u,tg,'N',0.8,'p',1,{})}}
    if(t>=nextF){snap();nextF+=0.5}}
  snap();const ra=alive(0).length,rb=alive(1).length;let win;
  if(ra&&!rb)win=0;else if(rb&&!ra)win=1;else{const sa=sides[0].reduce((x,u)=>x+u.hp/u.max,0)/sides[0].length,sb=sides[1].reduce((x,u)=>x+u.hp/u.max,0)/sides[1].length;win=sa>=sb?0:1;L('시간 종료! 남은 체력으로 판정')}
  return{frames,logs,win}}
function playPvp(i){const f=S.friends[i];if(!f)return;const mine=myTeam();if(!mine.length)return;
  const res=pvpRun(mine,f.team);openModal('pvp',i);let k=0,shown=0;
  const draw=fr=>{['A','B'].forEach((s,si)=>fr.hp[si].forEach((v,j)=>{const el=document.getElementById(`pv${s}${j}`);if(!el)return;const hb=el.querySelector('.hp');hb.className='hp'+hpCls(v);hb.firstChild.style.width=(v*100)+'%';el.classList.toggle('down',v<=0)}));
    const lg=$('#pvpLog');if(lg){while(shown<fr.l){const d=document.createElement('div');d.textContent=res.logs[shown++];lg.prepend(d)}}};
  const finish=()=>{if(UI.pvpTimer){clearInterval(UI.pvpTimer);UI.pvpTimer=null}draw(res.frames[res.frames.length-1]);const r=$('#pvpRes');if(r){r.className='pvp-res '+(res.win===0?'win':'lose');r.textContent=res.win===0?'승리!':'패배…'}
    const b=$('#pvpSkipBtn');if(b)b.remove();if(res.win===0){S.pvp.w++;f.w=(f.w||0)+1}else{S.pvp.l++;f.l=(f.l||0)+1}log(`${esc(f.name)}님과의 3대3 배틀 ${res.win===0?'승리':'패배'}`);save()};
  UI.pvpFinish=finish;UI.pvpTimer=setInterval(()=>{if(k>=res.frames.length){finish();return}draw(res.frames[k++])},100)}

function showStarter(){$('#starterList').innerHTML=STARTERS.map((s,i)=>{const p=D(s[0]);return`<button class="st-card" data-act="starter" data-i="${i}">${orb(s[0],72)}<div><div class="mon-n">${p.name}</div><div>${p.types.map(chip).join('')}</div><div class="sub">특성 ${TRAITS[s[3]].n} · 시작 스킬 1등급 ${s[2]}</div></div></button>`}).join('');$('#starter').hidden=false}
function resetBattle(){R.stageT=0;R.enemies=[];R.boss=false;R.waveDelay=0.3;R.rt={};R.ever++;R.pver++;if(S)partyMons().forEach(getRt)}
function offlineReward(sec){if(!S||!S.party.length)return;sec=Math.min(sec,offMaxH()*3600);if(sec<60)return;
  const eff=0.2+B.offEff/100;const kills=sec*clamp(S.kps||0.3,0.05,5);const lv=enemyLv(S.stage);const reg=REG();
  const gold=kills*2*Math.pow(1.07,S.stage-1)*(1+B.gold/100)*eff;const xp=kills*(6+2.2*lv)*(1+B.exp/100)*eff;
  S.gold+=gold;partyMons().forEach(m=>gainExp(m,xp));
  const roll=x=>Math.floor(x)+(rnd()<x%1?1:0);
  let n=0;const cnt=Math.min(300,roll(kills*0.12*eff));for(let i=0;i<cnt;i++){if(dropSkill(D(pick(reg.pool)).types,false,true))n++}
  const caps=roll(kills/GOAL*0.35*eff);S.items.capsule+=caps;
  const mons=[];const mc=Math.min(10,roll(kills*0.002*eff*(1+B.cap/100)));for(let i=0;i<mc;i++){const m=capture(pick(reg.pool),undefined,{quiet:true});if(m)mons.push(D(m.id).name)}
  const h=Math.floor(sec/3600),mi=Math.floor(sec%3600/60);openModal('offline',{time:`${h?h+'시간 ':''}${mi}분`,gold,xp,skills:n,caps,mons,eff})}
function checkUpdate(){if(!window.__BUILD_ID||!S)return;fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(v=>{if(v&&v.build&&v.build!==window.__BUILD_ID){save();toast('새 버전을 받는 중… 진행 상황은 그대로 유지돼요','gold');setTimeout(()=>location.reload(),1500)}}).catch(()=>{})}

function boot(){
  $('#ver').textContent=`v${GAME_VERSION}`;cvInit();
  const saved=load();
  if(saved&&saved.party&&saved.party.length){S=saved;S.ver=GAME_VERSION;S.items=Object.assign(newState().items,S.items);const base=newState();for(const k of['seen','friends','pvp','badges','name','pid','starter','autoSynth','sellG','kps'])if(S[k]===undefined)S[k]=base[k];if(S.starter===4&&S.mons[0])S.starter=[1,4,7].includes(S.mons[0].id)?S.mons[0].id:4;
    S.caught=S.caught||{};S.shop=S.shop||{};S.bagMax=S.bagMax||BAG_BASE;S.boxMax=S.boxMax||BOX_BASE;delete S.items.chest;for(const k in S.relics)if(!RELICS[k])delete S.relics[k];refreshBonus();resetBattle();renderPanel();offlineReward((Date.now()-(S.last||Date.now()))/1000)}
  else showStarter();
  let last=performance.now();
  function frame(now){let dt=Math.min(1,(now-last)/1000);const dt0=dt;last=now;if(S){dt*=S.speed;while(dt>0){const h=Math.min(0.05,dt);step(h);dt-=h}renderBattle(now);if(UI.dirty&&!UI.modal&&now-(UI.lastPanel||0)>1000&&!['dex','friend','trainer'].includes(UI.tab)&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))){UI.lastPanel=now;renderPanel()}
    R.kpsT=(R.kpsT||0)+dt0*S.speed;if(R.kpsT>=60){S.kps=S.kps*0.6+((R.kpsK||0)/R.kpsT)*0.4;R.kpsT=0;R.kpsK=0}}requestAnimationFrame(frame)}
  requestAnimationFrame(frame);
  setInterval(save,5000);
  setInterval(checkUpdate,180000);setTimeout(checkUpdate,8000);
  let hiddenAt=0;
  document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();save()}else if(hiddenAt&&S){const sec=(Date.now()-hiddenAt)/1000;hiddenAt=0;last=performance.now();offlineReward(sec);checkUpdate()}});
  window.addEventListener('pagehide',save);
}
boot();
</script>
