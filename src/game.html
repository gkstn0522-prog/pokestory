dgSel(d){const s=dgState();const key=d.key;const cur=dgSelMons().map(r=>r.key);if(cur.includes(key)){s.sel=cur.filter(k=>k!==key)}else{const ref=dgRef(key);if(!ref)return;if(cur.length>=DG_MAXP){toast(`한 번에 최대 ${DG_MAXP}마리까지 갈 수 있어요`,'bad');return}if(dgSelBst()+ref.bst>dgCap()){toast(`종족값 합이 ${dgCap()}을 넘어요 (뱃지를 더 모으면 늘어나요)`,'bad');return}s.sel=[...cur,key]}renderPanel()},

dgReg(d){const s=dgState();const uid=+d.uid;const m=monBy(uid);if(!m||dgIsReg(uid))return;if(s.team.length>=DG_ROSTER){toast(`탐험대는 최대 ${DG_ROSTER}마리예요`,'bad');return}

dgUnreg(d){const s=dgState();const key=d.key||('m'+d.uid);s.team=s.team.filter(k=>k!==key);s.sel=s.sel.filter(k=>k!==key);toast(key[0]==='m'?'탐험대에서 해제했어요. 다시 키우기에 쓸 수 있어요':'던전 동료 보관함으로 보냈어요');closeModal();renderPanel()},

treroll(d){const m=monBy(+d.uid);if(!m)return;const n=m.traits.length;const locks=UI.tlocks.slice(0,n);const cost=1+locks.filter(Boolean).length;
  if(S.items.capsule<cost||!locks.some(x=>!x))return;

  const keep=m.traits.filter((k,i)=>locks[i]);m.traits=m.traits.map((k,i)=>{if(locks[i])return k;const nk=rollTrait(keep);keep.push(nk);return nk});
  const best=Math.max(...m.traits.map(k=>TRAITS[k].g));if(best>=2)toast(`<b style="color:${TG_COL[best]}">${TG_N[best]}</b> 특성 획득!`,'gold');renderModal()},
relicDraw(d){const n=d.n==='10'?10:1;const res={},list=[];let spent=0;
  for(let i=0;i<n;i++){if(relicsAllMax())break;const pr=relicPrice();if(S.gold<pr)break;S.gold-=pr;spent+=pr;S.shop.relic=(S.shop.relic||0)+1;const k=drawRelic();if(k){res[k]=(res[k]||0)+1;list.push(k)}}

  sfx('relic');openModal('relicOpen',{title:'유물 상자',list,foot:`사용 ${fmt(spent)}골드 · 다음 상자 ${fmt(relicPrice())}골드`})},
relicFree(d){const n=d.n==='all'?S.freeRelic:1;const res={},list=[];for(let i=0;i<n&&S.freeRelic>0;i++){if(relicsAllMax())break;S.freeRelic--;const k=drawRelic();if(k){res[k]=(res[k]||0)+1;list.push(k)}}

buyBag(){if(S.bagMax>=BAG_CAP)return;const pr=shopPrice('bag');if(S.gold<pr)return;S.gold-=pr;(S.tutF=S.tutF||{}).buy=true;dAdd('shop');S.shop.bag=(S.shop.bag||0)+1;S.bagMax=Math.min(BAG_CAP,S.bagMax+5);toast(`스킬 가방 ${S.bagMax}칸`,'gold');renderPanel()},
buyBox(){if(S.boxMax>=BOX_CAP)return;const pr=shopPrice('box');if(S.gold<pr)return;S.gold-=pr;(S.tutF=S.tutF||{}).buy=true;dAdd('shop');S.shop.box=(S.shop.box||0)+1;S.boxMax=Math.min(BOX_CAP,S.boxMax+1);toast(`보관함 ${S.boxMax}칸`,'gold');renderPanel()},
buyItem(d){const k=d.k;let pr;if(k==='candy')pr=candyPrice();else if(STONES[k])pr=stonePrice();else pr=cubePrice()*(k==='acube'?4:k==='capsule'?2:1);

hatchEgg(){const pool=DEX.filter(p=>!p.prev&&!LEGEND.includes(p.id)).map(p=>p.id);const m=capture(pick(pool),5,{admin:false});if(m)log(`알에서 <b>${D(m.id).name}</b>가 태어났다`);return m},

function offlineReward(sec){if(!S||!S.party.length)return;sec=Math.min(sec,offMaxH()*3600);if(sec<60)return;
  const eff=0.2+B.offEff/100;const kills=sec*clamp(S.kps||0.3,0.05,5);const lv=enemyLv(S.stage);const reg=REG();
  const opm=1-farmPen(S.stage)/100;const gold=kills*2*Math.pow(1.07,S.stage-1)*(1+B.gold/100)*eff*opm;const xp=kills*(6+2.2*lv)*(1+B.exp/100)*eff*opm;
  S.gold+=gold;partyMons().forEach(m=>gainExp(m,xp));
  const roll=x=>Math.floor(x)+(rnd()<x%1?1:0);
  let n=0;const cnt=Math.min(300,roll(kills*0.096*eff));for(let i=0;i<cnt;i++){if(dropSkill(D(pick(reg.pool)).types,false,true))n++}
  const caps=roll(kills/GOAL*0.35*eff);S.items.capsule+=caps;
  const mons=[];const mc=Math.min(10,roll(kills*0.002*eff*(1+B.cap/100)));for(let i=0;i<mc;i++){const m=capture(pick(reg.pool),undefined,{quiet:true});if(m)mons.push(D(m.id).name)}
  const h=Math.floor(sec/3600),mi=Math.floor(sec%3600/60);openModal('offline',{time:`${h?h+'시간 ':''}${mi}분`,gold,xp,skills:n,caps,mons,eff})}

function dexWhere(id){const p=D(id),out=[];if(LEGEND.includes(id))return['특별한 조건을 만족하면 만날 수 있다는 소문이 있어요… (비밀)'];
  const wild=REGIONS.map((r,i)=>r.pool.includes(id)?`${i+1}장 ${r.name}`:null).filter(Boolean);if(wild.length)out.push('야생: '+wild.join(', '));
  const boss=REGIONS.map((r,i)=>r.pool.some(x=>finalEvo(x)===id&&x!==id)?`${i+1}장`:null).filter(Boolean);if(boss.length)out.push('스테이지 보스: '+boss.join(', ')+' (포획 확률 낮음)');
  if(MINE_POOL.includes(id))out.push('광산 (3-10 클리어 후)');
  if(p.prev){const q=D(p.prev);const e=q.evo.find(x=>x.to===id);if(e)out.push(`진화: ${q.name} ${e.lv?`Lv.${e.lv}`:`+ ${STONES[e.stone]||'진화의 돌'}`}`)}
  const dg=DUNGEONS.filter(d=>d.pool.some(x=>x[0]===id||(D(x[0]).evo.some(e=>e.lv&&e.to===id)))).map(d=>d.name);if(dg.length)out.push('불가사의 던전 영입: '+dg.join(', '));
  const db=DUNGEONS.filter(d=>d.boss===id).map(d=>d.name);if(db.length)out.push('던전 최심부 보스 영입(클리어 시 30%): '+db.join(', '));
  if(!p.prev)out.push('상점의 포켓몬 알');return out.length?out:['진화나 알로 얻을 수 있어요']}

function dgGen(){const W=DG_W,H=DG_H;const g=new Array(W*H).fill(0),room=new Array(W*H).fill(-1);const rooms=[];
  for(let tries=0;tries<200&&rooms.length<8;tries++){const w=4+Math.floor(rnd()*5),h=3+Math.floor(rnd()*4),x=1+Math.floor(rnd()*(W-w-2)),y=1+Math.floor(rnd()*(H-h-2));
    if(rooms.some(r=>x<r.x+r.w+2&&x+w+2>r.x&&y<r.y+r.h+2&&y+h+2>r.y))continue;rooms.push({x,y,w,h,cx:x+(w>>1),cy:y+(h>>1)})}
  rooms.sort((a,b)=>a.cx-b.cx||a.cy-b.cy);
  rooms.forEach((r,i)=>{for(let yy=r.y;yy<r.y+r.h;yy++)for(let xx=r.x;xx<r.x+r.w;xx++){g[yy*W+xx]=1;room[yy*W+xx]=i}});
  const dig=(x,y)=>{if(g[y*W+x]===0)g[y*W+x]=1};
  const link=(a,b)=>{let x=a.cx,y=a.cy;const hf=rnd()<0.5;if(hf){while(x!==b.cx){dig(x,y);x+=Math.sign(b.cx-x)}while(y!==b.cy){dig(x,y);y+=Math.sign(b.cy-y)}}else{while(y!==b.cy){dig(x,y);y+=Math.sign(b.cy-y)}while(x!==b.cx){dig(x,y);x+=Math.sign(b.cx-x)}}dig(x,y)};
  for(let i=1;i<rooms.length;i++)link(rooms[i-1],rooms[i]);if(rooms.length>3)link(rooms[0],rooms[rooms.length-1]);if(rooms.length>5&&rnd()<0.6)link(rooms[1],rooms[rooms.length-2]);
  return{g,room,rooms}}
const dgAt=(x,y)=>x>=0&&y>=0&&x<DG_W&&y<DG_H&&DG.run.map.g[y*DG_W+x]===1;

function dgLos(a,b){let x0=a.x,y0=a.y;const x1=b.x,y1=b.y,dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let err=dx+dy;
  while(!(x0===x1&&y0===y1)){const e2=2*err;if(e2>=dy){err+=dy;x0+=sx}if(e2<=dx){err+=dx;y0+=sy}if(!(x0===x1&&y0===y1)&&!dgAt(x0,y0))return false}return true}
// BFS: goal(x,y) 만족하는 가장 가까운 칸으로 가는 첫 걸음. 아군은 이미 드러난 함정을 피해 가요.
function dgPath(u,goal,maxD,ignore){const r=DG.run,W=DG_W,H=DG_H,seen=new Int16Array(W*H).fill(-1),q=[u.y*W+u.x];seen[q[0]]=q[0];let head=0;const dist=new Int16Array(W*H);
  while(head<q.length){const c=q[head++];const cx=c%W,cy=(c/W)|0;if(c!==q[0]&&goal(cx,cy)){let s=c;while(seen[s]!==q[0])s=seen[s];return{x:s%W,y:(s/W)|0,d:dist[c]}}
    if(dist[c]>=maxD)continue;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=cx+dx,ny=cy+dy;if(!dgAt(nx,ny))continue;if(dx&&dy&&(!dgAt(cx+dx,cy)||!dgAt(cx,cy+dy)))continue;const n=ny*W+nx;if(seen[n]!==-1)continue;
      const isGoal=goal(nx,ny);const o=dgOcc(nx,ny);if(o&&o!==u&&!isGoal&&!(ignore&&ignore(o)))continue;
      if(u.side==='p'&&!isGoal){const tp=dgTrapAt(nx,ny);if(tp&&tp.seen)continue}
      seen[n]=c;dist[n]=dist[c]+1;q.push(n)}}return null}

function dgUseItem(k,u){const r=DG.run;if(!dgCanUse(k,u))return false;r.bag[k]--;r.used[k]=(r.used[k]||0)+1;const al=r.party.filter(x=>!x.down);

function dgTurn(act){const r=DG.run;if(!r||r.over)return;r.turn++;r.ft++;

    if(e.boss&&e.aggro){if(!r.bossT0){r.bossT0=r.turn;r.party.forEach(u=>{u.down=false;u.hp=u.max;u.sts={};u.sk.forEach(k=>{k.pp=k.ppMax;k.seal=0})});const L0=r.party[0];r.party.forEach(u=>{if(cheb(u,L0)>3){const sp=dgPath(L0,(x,y)=>!dgOcc(x,y),5);if(sp){u.x=u.px=sp.x;u.y=u.py=sp.y}}});dgLog('최심부의 기운으로 파티의 체력과 PP가 회복됐다!');dgLog(`<b>${D(e.id).name}</b>이(가) 덤벼든다! ${DG_ENR}턴 안에 쓰러뜨리지 못하면 격노해요`);r.story.push(r.d.id+'_boss')}
      else if(!e.enr&&r.turn-r.bossT0>=DG_ENR){e.enr=true;e.mul*=3;dgLog(`<b style="color:#ff6b6b">${D(e.id).name}이(가) 격노했다!</b> ${DG_ENR2-DG_ENR}턴 안에 못 쓰러뜨리면 던전 밖으로 튕겨 나가요`);dgFloat(e,'격노!','#ff6b6b')}

    else if(rnd()<0.4&&!e.mh){const dx=Math.floor(rnd()*3)-1,dy=Math.floor(rnd()*3)-1;if((dx||dy)&&dgAt(e.x+dx,e.y+dy)&&!dgOcc(e.x+dx,e.y+dy))dgStep(e,{x:e.x+dx,y:e.y+dy})}}

  if(r.ft%35===0&&!r.boss&&r.en.filter(e=>!e.down).length<12)dgSpawn(r.map.rooms,true);
